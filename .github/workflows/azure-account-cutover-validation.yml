name: Azure account cutover validation

on:
  push:
    branches:
      - azure-account-cutover-phase5-r6r2-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-account-cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact cutover head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove branch and exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "azure-account-cutover-phase5-r6r2-v1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor de6f6d0a6464a5c05e66c99ee0108299273f6bc0 HEAD
          echo ACCOUNT_CUTOVER_ANCESTRY=PASS

      - name: Run deep retired-account reference sweep
        run: python scripts/azure/audit_account_cutover.py

      - name: Validate release schema JSON
        run: python -m json.tool release/a1-release-manifest.schema.json >/dev/null

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Release and database-rebaseline account-binding regressions
        env:
          APP_ENV: TEST
          SYNTHETIC_ONLY: "true"
          REAL_DATA_ALLOWED: "false"
        run: python -m pytest -q backend/tests/test_db_rebaseline.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend synthetic Entra fixture regression
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run tests/auth.test.ts

      - name: Final no-mutation boundary
        run: |
          echo AZURE_LOGIN_EXECUTED=false
          echo AZURE_RESOURCE_MUTATION_COUNT=0
          echo ENTRA_MUTATION_COUNT=0
          echo REAL_AMEC_DATA_USED=false
          echo ACCOUNT_CUTOVER_VALIDATION=PASS
