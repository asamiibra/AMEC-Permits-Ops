name: ProposalOps Production Integration V1R2 validation

on:
  push:
    branches:
      - proposalops-production-integration-ci-r2-v1

permissions:
  contents: read

env:
  APPLICATION_BRANCH: proposalops-production-integration-v1
  APPLICATION_SHA: eec00021a308046998d9d1df1929628f319a96d4
  APPLICATION_PARENT_SHA: 1a17b395fdaa2309a2832609486783fd1f1d8eca
  VALIDATION_BRANCH: proposalops-production-integration-ci-r2-v1
  PHASE5_SHA: c42e6c449483b0951de0f366d700dbaf7b9e5525
  PHASE5_TREE: a497c6951064119453d175d1b93d4e59c9029fd0
  HISTORICAL_MAIN_SHA: 3474b35a13d27f0010ec5d03dd4a2f361ac6774d
  ACCOUNT_REBIND_SHA: 4a017b465300fc6c39b7807b24e08868479ec884
  FOUNDATION_SHA: ce8a887703ec8c15c8c781e1589e169ce395845a
  SQLSERVER_IMAGE_TAG: mcr.microsoft.com/mssql/server:2022-latest

jobs:
  validate:
    name: Production integration V1R2 executable validation
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout immutable integration validation child
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize deterministic evidence directories
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/production-integration-r2-evidence"
          UPLOAD_EVIDENCE_DIR="$RUNNER_TEMP/production-integration-r2-upload"
          rm -rf "$EVIDENCE_DIR" "$UPLOAD_EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR" "$UPLOAD_EVIDENCE_DIR"
          export EVIDENCE_DIR UPLOAD_EVIDENCE_DIR
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          echo "UPLOAD_EVIDENCE_DIR=$UPLOAD_EVIDENCE_DIR" >> "$GITHUB_ENV"
          test -d "$EVIDENCE_DIR"
          test -d "$UPLOAD_EVIDENCE_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["EVIDENCE_DIR"])
          (root / "evidence-directory.result.json").write_text(json.dumps({
              "result": "PASS", "evidence_directory_created": True,
              "upload_directory_created": True
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Identity, ancestry, and one-workflow binding gate
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          test "$GITHUB_REF_NAME" = "$VALIDATION_BRANCH"
          git fetch --no-tags origin "$APPLICATION_BRANCH:refs/remotes/origin/$APPLICATION_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$APPLICATION_BRANCH)" = "$APPLICATION_SHA"
          test "$(git rev-parse HEAD^1)" = "$APPLICATION_SHA"
          test "$(git rev-parse HEAD^1^1)" = "$APPLICATION_PARENT_SHA"
          test "$(git rev-parse "$APPLICATION_SHA^{tree}")" = "$(git rev-parse HEAD^1^{tree})"
          test "$(git diff --name-only "$APPLICATION_SHA" HEAD)" = ".github/workflows/production-integration-validation-r2.yml"
          test "$(git rev-parse "$PHASE5_SHA^{tree}")" = "$PHASE5_TREE"
          git merge-base --is-ancestor "$PHASE5_SHA" "$APPLICATION_SHA"
          git merge-base --is-ancestor "$HISTORICAL_MAIN_SHA" "$APPLICATION_SHA"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          phase5 = os.environ["PHASE5_SHA"]
          historical_main = os.environ["HISTORICAL_MAIN_SHA"]
          application = os.environ["APPLICATION_SHA"]
          matches = []
          for merge_sha in git("rev-list", "--merges", f"{phase5}..{application}").splitlines():
              parents = git("rev-list", "--parents", "-n", "1", merge_sha).split()[1:]
              if parents == [phase5, historical_main] and git("rev-parse", f"{merge_sha}^{{tree}}") == os.environ["PHASE5_TREE"]:
                  matches.append(merge_sha)
          assert len(matches) == 1, matches
          merge_sha = matches[0]
          assert git("rev-parse", f"{merge_sha}^1") == phase5
          assert git("rev-parse", f"{merge_sha}^2") == historical_main
          payload = {
              "result": "PASS",
              "application_sha": application,
              "application_parent_sha": os.environ["APPLICATION_PARENT_SHA"],
              "validation_parent_is_application": git("rev-parse", "HEAD^1") == application,
              "accepted_phase5_is_ancestor": True,
              "historical_main_is_ancestor": True,
              "accepted_phase5_tree_preserved_during_main_reconciliation": True,
              "main_reconciliation_merge_sha": merge_sha,
              "main_reconciliation_merge_tree": os.environ["PHASE5_TREE"],
              "validation_workflow_only_diff": True,
          }
          root = Path(os.environ["EVIDENCE_DIR"])
          (root / "identity.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (root / "main-reconciliation.json").write_text(json.dumps({
              "result": "PASS", "merge_sha": merge_sha,
              "merge_tree": os.environ["PHASE5_TREE"],
              "parent_one_phase5": True, "parent_two_historical_main": True,
              "accepted_phase5_tree_preserved": True,
              "content_diff_from_accepted_phase5": False
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          echo "MAIN_MODIFIED=false" >> "$GITHUB_ENV"
          echo "FORCE_PUSH_USED=false" >> "$GITHUB_ENV"
          echo "APPLICATION_BRANCH_MOVED=false" >> "$GITHUB_ENV"

      - name: Python, Node, ODBC Driver 18, and locked dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
          odbcinst -q -d | grep -F "ODBC Driver 18 for SQL Server"
          python -m pip install -r backend/requirements.txt
          python -m pip check
          (cd frontend && npm ci --silent)
          python - <<'PY'
          import json, platform
          from pathlib import Path
          Path(__import__("os").environ["EVIDENCE_DIR"] + "/runner-platform.result.json").write_text(json.dumps({
              "result": "PASS", "runner_platform": platform.platform(),
              "architecture": platform.machine(), "native_x64": platform.machine() == "x86_64",
              "odbc_driver_18_ready": True, "python_3_12_ready": True,
              "npm_ci_ready": True
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Explicit Playwright Chromium installation
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          (cd frontend && npx playwright install --with-deps chromium)
          printf 'PASS\n' > "$EVIDENCE_DIR/playwright-install.result.txt"

      - name: Account, release, foundation, and Phase5 source gates
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          python scripts/azure/audit_account_cutover.py > "$RUNNER_TEMP/account-audit.log"
          python -m json.tool release/a1-release-manifest.schema.json > "$RUNNER_TEMP/release-schema.json"
          APP_ENV=TEST SYNTHETIC_ONLY=true REAL_DATA_ALLOWED=false python -m pytest -q backend/tests/test_db_rebaseline.py > "$RUNNER_TEMP/account-test.log"
          az bicep install
          az bicep build --file infra/azure_sql_foundation/main.bicep --stdout > "$RUNNER_TEMP/foundation.bicep.json"
          python -m json.tool "$RUNNER_TEMP/foundation.bicep.json" >/dev/null
          test -s "$RUNNER_TEMP/foundation.bicep.json"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          account = [
              "backend/tests/test_db_rebaseline.py", "config/azure_account_binding.json",
              "frontend/tests/auth.test.ts", "release/a1-release-manifest.schema.json",
              "scripts/azure/audit_account_cutover.py", "scripts/release/verify_a1_release_manifest.py",
          ]
          foundation = [
              "infra/azure_sql_foundation/foundation.bicepparam.example", "infra/azure_sql_foundation/main.bicep",
              "infra/azure_sql_foundation/modules/budget.bicep", "infra/azure_sql_foundation/modules/core.bicep",
              "infra/azure_sql_foundation/modules/network.bicep", "infra/azure_sql_foundation/modules/private_dns.bicep",
          ]
          def blob(commit, path):
              return subprocess.check_output(["git", "rev-parse", f"{commit}:{path}"], text=True).strip()
          def work(path):
              return subprocess.check_output(["git", "hash-object", path], text=True).strip()
          assert all(blob(os.environ["ACCOUNT_REBIND_SHA"], path) == work(path) for path in account)
          assert all(blob(os.environ["FOUNDATION_SHA"], path) == work(path) for path in foundation)
          frozen = []
          for prefix in ("contracts/amec/phase5", "scripts/phase5"):
              frozen.extend(subprocess.check_output(["git", "ls-tree", "-r", "--name-only", os.environ["PHASE5_SHA"], "--", prefix], text=True).splitlines())
          frozen += ["backend/app/api/phase5.py", "backend/app/schemas/classifier_v2.py", "backend/app/services/classifier_v2.py"]
          frozen += subprocess.check_output(["git", "ls-tree", "-r", "--name-only", os.environ["PHASE5_SHA"], "--", "backend/tests/test_phase5_*", "frontend/browser-real-stack/phase5-classifier-shadow.spec.ts"], text=True).splitlines()
          frozen = sorted(set(frozen))
          assert all(blob(os.environ["PHASE5_SHA"], path) == work(path) for path in frozen)
          try:
              subprocess.check_call(["git", "cat-file", "-e", os.environ["PHASE5_SHA"] + ":infra/azure_sql_foundation"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          except subprocess.CalledProcessError:
              foundation_absent = True
          else:
              foundation_absent = False
          assert foundation_absent
          root = Path(os.environ["EVIDENCE_DIR"])
          (root / "source-parity.json").write_text(json.dumps({
              "result": "PASS", "account_path_count": 6, "account_source_byte_parity_count": 6,
              "account_source_byte_mismatch_count": 0, "foundation_path_count": 6,
              "foundation_source_byte_parity_count": 6, "foundation_source_byte_mismatch_count": 0,
              "phase5_frozen_path_mismatch_count": 0
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (root / "phase5-freeze.json").write_text(json.dumps({
              "result": "PASS", "frozen_path_count": len(frozen),
              "mismatch_count": 0, "accepted_source_mutated": False
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (root / "account-audit.result.txt").write_text("ACCOUNT_BINDING_AUDIT=PASS\n", encoding="utf-8")
          (root / "release-validation.result.txt").write_text("RELEASE_MANIFEST_VALIDATION=PASS\n", encoding="utf-8")
          (root / "foundation-bicep.result.json").write_text(json.dumps({
              "result": "PASS", "compiled_json_nonempty": True, "azure_login_executed": False
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Start disposable native SQL Server 2022 x64
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          SQLSERVER_PASSWORD="$(openssl rand -hex 24)Aa!"
          echo "::add-mask::$SQLSERVER_PASSWORD"
          export SQLSERVER_PASSWORD
          echo "SQLSERVER_PASSWORD=$SQLSERVER_PASSWORD" >> "$GITHUB_ENV"
          SQL_CONTAINER="production-integration-r2-sql-${GITHUB_RUN_ID}"
          export SQL_CONTAINER
          echo "SQL_CONTAINER=$SQL_CONTAINER" >> "$GITHUB_ENV"
          docker pull --platform linux/amd64 "$SQLSERVER_IMAGE_TAG"
          SQLSERVER_IMAGE_REPODIGEST="$(docker image inspect "$SQLSERVER_IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          export SQLSERVER_IMAGE_REPODIGEST
          echo "$SQLSERVER_IMAGE_REPODIGEST" | grep -Eq '^mcr\.microsoft\.com/mssql/server@sha256:[0-9a-f]{64}$'
          echo "SQLSERVER_IMAGE_REPODIGEST=$SQLSERVER_IMAGE_REPODIGEST" >> "$GITHUB_ENV"
          python - <<'PY'
          import os
          value = os.environ.get("SQLSERVER_PASSWORD")
          assert value and len(value) >= 20
          print("SQLSERVER_PASSWORD_CURRENT_STEP_EXPORT=PASS")
          PY
          write_sql_diagnostic() {
            local exists=false running=false container_status=absent exit_code=none oom_killed=false
            if docker inspect "$SQL_CONTAINER" >/dev/null 2>&1; then
              exists=true
              running="$(docker inspect --format '{{.State.Running}}' "$SQL_CONTAINER" 2>/dev/null || echo false)"
              container_status="$(docker inspect --format '{{.State.Status}}' "$SQL_CONTAINER" 2>/dev/null || echo unknown)"
              exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$SQL_CONTAINER" 2>/dev/null || echo unknown)"
              oom_killed="$(docker inspect --format '{{.State.OOMKilled}}' "$SQL_CONTAINER" 2>/dev/null || echo false)"
            fi
            python - "$exists" "$running" "$container_status" "$exit_code" "$oom_killed" <<'PY'
          import json, os, sys
          payload = {
              "container_exists": sys.argv[1] == "true", "container_running": sys.argv[2] == "true",
              "container_status": sys.argv[3], "container_exit_code": sys.argv[4],
              "container_oom_killed": sys.argv[5] == "true",
              "image_repo_digest": os.environ.get("SQLSERVER_IMAGE_REPODIGEST", ""),
              "attempt_limit": 60, "result": "FAIL"
          }
          with open(os.path.join(os.environ["EVIDENCE_DIR"], "sqlserver-bootstrap-diagnostic.json"), "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True); handle.write("\n")
          PY
          }
          set +e
          docker run -d --platform linux/amd64 --name "$SQL_CONTAINER" -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$SQLSERVER_PASSWORD" -p 1433:1433 "$SQLSERVER_IMAGE_REPODIGEST" >/dev/null
          run_code=$?
          set -e
          if [ "$run_code" -ne 0 ]; then write_sql_diagnostic; exit "$run_code"; fi
          set +e
          python - <<'PY'
          import os, time, pyodbc
          password = os.environ["SQLSERVER_PASSWORD"]
          master = "DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=" + password + ";Encrypt=no;TrustServerCertificate=yes"
          for attempt in range(60):
              try:
                  connection = pyodbc.connect(master, autocommit=True)
                  break
              except pyodbc.Error:
                  if attempt == 59:
                      raise
                  time.sleep(2)
          cursor = connection.cursor()
          cursor.execute("SELECT CONVERT(int, SERVERPROPERTY(?))", ("ProductMajorVersion",))
          major = int(cursor.fetchone()[0])
          assert major == 16
          import json
          with open(os.path.join(os.environ["EVIDENCE_DIR"], "sqlserver-bootstrap.result.json"), "w", encoding="utf-8") as handle:
              json.dump({"result":"PASS", "engine":"MICROSOFT_SQL_SERVER_2022_X64", "sqlserver_major":major, "image_platform":"linux/amd64", "image_repo_digest":os.environ["SQLSERVER_IMAGE_REPODIGEST"], "connection_probe":"PASS"}, handle, indent=2, sort_keys=True); handle.write("\n")
          print("NATIVE_SQLSERVER_BOOTSTRAP=PASS")
          PY
          bootstrap_code=$?
          set -e
          if [ "$bootstrap_code" -ne 0 ]; then write_sql_diagnostic; exit "$bootstrap_code"; fi

      - name: Native SQL Server migration and compatibility gates
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          make_url() { python -c 'from urllib.parse import quote; import os,sys; print("mssql+pyodbc://sa:%s@127.0.0.1:1433/%s?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes" % (quote(os.environ["SQLSERVER_PASSWORD"], safe=""), sys.argv[1]))' "$1"; }
          DB_NAME=phase5gates python - <<'PY'
          import os, pyodbc
          name = os.environ["DB_NAME"]
          connection = pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=" + os.environ["SQLSERVER_PASSWORD"] + ";Encrypt=no;TrustServerCertificate=yes", autocommit=True)
          cursor = connection.cursor(); cursor.execute("SELECT DB_ID(?)", (name,))
          if cursor.fetchone()[0] is None: cursor.execute("CREATE DATABASE [" + name + "]")
          PY
          gates_url="$(make_url phase5gates)"
          DATABASE_URL="$gates_url" python -m alembic -c alembic.ini upgrade head
          DATABASE_URL="$gates_url" python - <<'PY'
          from backend.app.db import database_migration_heads
          assert database_migration_heads() == ("baseline_phase4_v36_azure_sql",)
          PY
          python - <<'PY'
          import json, os
          from pathlib import Path
          bootstrap = json.loads((Path(os.environ["EVIDENCE_DIR"]) / "sqlserver-bootstrap.result.json").read_text(encoding="utf-8"))
          native = {"result":"PASS", "engine":bootstrap["engine"], "sqlserver_major":bootstrap["sqlserver_major"], "migration_pass":True, "migration_head":"baseline_phase4_v36_azure_sql", "database_schema_delta":0, "image_platform":bootstrap["image_platform"], "image_repo_digest":bootstrap["image_repo_digest"]}
          (Path(os.environ["EVIDENCE_DIR"]) / "native-sqlserver.result.json").write_text(json.dumps(native, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          cat > "$RUNNER_TEMP/sqlserver-probes.py" <<'PY'
          import os
          from scripts.phase5.sqlserver_targeted import _probe_boolean_predicate, _probe_reflection
          def test_native_sql_server_boolean_predicates_portable():
              assert _probe_boolean_predicate(os.environ["DATABASE_URL"])
          def test_native_sql_server_reflection_compatibility():
              assert _probe_reflection(os.environ["DATABASE_URL"])
          PY
          DATABASE_URL="$gates_url" python -m pytest -q backend/tests/test_phase5_sqlserver_runtime.py "$RUNNER_TEMP/sqlserver-probes.py" --junitxml="$RUNNER_TEMP/sqlserver-targeted.junit.xml"
          DATABASE_URL="$gates_url" python scripts/phase5/sqlserver_targeted.py --junitxml "$RUNNER_TEMP/sqlserver-targeted.junit.xml" --bootstrap-result "$EVIDENCE_DIR/native-sqlserver.result.json" --output "$RUNNER_TEMP/sqlserver-targeted.json"
          cp "$RUNNER_TEMP/sqlserver-targeted.json" "$EVIDENCE_DIR/sqlserver-targeted.result.json"
          python - <<'PY'
          import json, os
          result = json.load(open(os.path.join(os.environ["EVIDENCE_DIR"], "sqlserver-targeted.result.json"), encoding="utf-8"))
          assert result["result"] == "PASS"
          assert result["sqlserver_major"] == 16
          assert result["migration_head"] == "baseline_phase4_v36_azure_sql"
          assert result["gate_count"] == 16 and result["failed_count"] == 0 and result["skipped_count"] == 0
          assert result["portability_probe_count"] == 2 and result["portability_probe_pass_count"] == 2
          assert result["portability_probe_fail_count"] == 0 and result["portability_probe_not_executed_count"] == 0
          assert result["native_x64"] is True and result["pyodbc_driver"] is True
          PY

      - name: Phase5 targeted, Phase4 integration, authority, backend, and observability regressions
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          make_url() { python -c 'from urllib.parse import quote; import os,sys; print("mssql+pyodbc://sa:%s@127.0.0.1:1433/%s?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes" % (quote(os.environ["SQLSERVER_PASSWORD"], safe=""), sys.argv[1]))' "$1"; }
          create_db() { DB_NAME="$1" python - <<'PY'
          import os, pyodbc
          name = os.environ["DB_NAME"]
          connection = pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=" + os.environ["SQLSERVER_PASSWORD"] + ";Encrypt=no;TrustServerCertificate=yes", autocommit=True)
          cursor = connection.cursor(); cursor.execute("SELECT DB_ID(?)", (name,))
          if cursor.fetchone()[0] is None: cursor.execute("CREATE DATABASE [" + name + "]")
          PY
          }
          phase5_targeted_url="$(make_url phase5backendtargeted)"; create_db phase5backendtargeted
          DATABASE_URL="$phase5_targeted_url" python -m alembic -c alembic.ini upgrade head
          DATABASE_URL="$phase5_targeted_url" python - <<'PY'
          import os
          from sqlalchemy.engine import make_url
          from backend.app.db import database_migration_heads
          assert make_url(os.environ["DATABASE_URL"]).get_backend_name() == "mssql"
          assert database_migration_heads() == ("baseline_phase4_v36_azure_sql",)
          PY
          DATABASE_URL="$phase5_targeted_url" python -m pytest -q backend/tests/test_phase5_contracts.py backend/tests/test_phase5_evidence_integrity.py backend/tests/test_phase5_finalizer_negative.py
          printf '{"result":"PASS","database_dialect":"mssql","migration_head":"baseline_phase4_v36_azure_sql"}\n' > "$EVIDENCE_DIR/phase5-regression.result.json"
          phase4_url="$(make_url phase4integration)"; create_db phase4integration
          DATABASE_URL="$phase4_url" python -m alembic -c alembic.ini upgrade head
          DATABASE_URL="$phase4_url" python -m pytest -q backend/tests/test_phase4_corpus_app_integration.py
          printf '{"result":"PASS","database":"phase4integration"}\n' > "$EVIDENCE_DIR/phase4-regression.result.json"
          authority_url="$(make_url phase5authority)"; create_db phase5authority
          DATABASE_URL="$authority_url" python -m alembic -c alembic.ini upgrade head
          DATABASE_URL="$authority_url" python -m pytest -q backend/tests/test_phase4_corpus_app_integration.py -k 'rd_019 or rd_023 or v35_038 or v35_039'
          printf '{"result":"PASS","protected_action_denial":true,"database":"phase5authority"}\n' > "$EVIDENCE_DIR/protected-action-denial.result.json"
          sqlite_backend="sqlite:///$RUNNER_TEMP/production-integration-backend.db"
          DATABASE_URL="$sqlite_backend" python -m pytest -q --ignore=backend/tests/test_phase5_sqlserver_runtime.py
          printf '{"result":"PASS","database":"sqlite"}\n' > "$EVIDENCE_DIR/backend-regression.result.json"
          sqlite_observability="sqlite:///$RUNNER_TEMP/production-integration-observability.db"
          DATABASE_URL="$sqlite_observability" python -m pytest -q backend/tests/test_observability.py
          printf '{"result":"PASS","database":"sqlite"}\n' > "$EVIDENCE_DIR/observability-regression.result.json"

      - name: Real SQL-backed API and browser/frontend gates
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          make_url() { python -c 'from urllib.parse import quote; import os,sys; print("mssql+pyodbc://sa:%s@127.0.0.1:1433/%s?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes" % (quote(os.environ["SQLSERVER_PASSWORD"], safe=""), sys.argv[1]))' "$1"; }
          DB_NAME=phase5realstack python - <<'PY'
          import os, pyodbc
          name = os.environ["DB_NAME"]
          connection = pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=" + os.environ["SQLSERVER_PASSWORD"] + ";Encrypt=no;TrustServerCertificate=yes", autocommit=True)
          cursor = connection.cursor(); cursor.execute("SELECT DB_ID(?)", (name,))
          if cursor.fetchone()[0] is None: cursor.execute("CREATE DATABASE [" + name + "]")
          PY
          real_url="$(make_url phase5realstack)"
          DATABASE_URL="$real_url" python -m alembic -c alembic.ini upgrade head
          export DATABASE_URL="$real_url"
          nohup env APP_ENV=TEST SYNTHETIC_ONLY=true REAL_DATA_ALLOWED=false DATABASE_URL="$DATABASE_URL" FRONTEND_ORIGINS=http://127.0.0.1:5173 AUTH_MODE=DEV_HEADER uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 & echo $! > "$RUNNER_TEMP/api.pid"
          for attempt in $(seq 1 60); do curl -fsS -H 'X-Dev-Role: SYSTEM_ADMIN' http://127.0.0.1:8000/api/phase5/health >/dev/null && break; test "$attempt" -lt 60 || exit 1; sleep 2; done
          nohup env BASE_URL=http://127.0.0.1:5173 npm --prefix frontend run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/frontend.log" 2>&1 & echo $! > "$RUNNER_TEMP/frontend.pid"
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; test "$attempt" -lt 60 || exit 1; sleep 2; done
          (cd frontend && PLAYWRIGHT_JSON_OUTPUT_FILE="$EVIDENCE_DIR/browser-report.json" BASE_URL=http://127.0.0.1:5173 npx playwright test browser-real-stack/phase5-classifier-shadow.spec.ts --config=playwright.real-stack.config.ts --reporter=json)
          python scripts/phase5/browser_evidence.py --playwright-json "$EVIDENCE_DIR/browser-report.json" --spec frontend/browser-real-stack/phase5-classifier-shadow.spec.ts --output "$EVIDENCE_DIR/browser-quality.result.json"
          printf 'PASS\n' > "$EVIDENCE_DIR/browser.result.txt"
          (cd frontend && npm test -- --run)
          printf 'PASS\n' > "$EVIDENCE_DIR/frontend-regression.result.txt"
          (cd frontend && npx tsc -b && npx vite build --outDir "$RUNNER_TEMP/production-integration-dist")
          printf 'PASS\n' > "$EVIDENCE_DIR/frontend-production-build.result.txt"

      - name: Local production container builds and release labels
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          backend_image="proposalops-production-integration-backend:${GITHUB_RUN_ID}"
          frontend_image="proposalops-production-integration-frontend:${GITHUB_RUN_ID}"
          docker build --platform linux/amd64 --build-arg RELEASE_SHA="$APPLICATION_SHA" -t "$backend_image" -f backend/Dockerfile .
          docker build --platform linux/amd64 --build-arg RELEASE_SHA="$APPLICATION_SHA" --build-arg BUILD_ID="integration-${GITHUB_RUN_ID}" --build-arg VITE_ENTRA_TENANT_ID=00000000-0000-4000-8000-000000000001 --build-arg VITE_ENTRA_WEB_CLIENT_ID=00000000-0000-4000-8000-000000000002 --build-arg VITE_ENTRA_API_CLIENT_ID=00000000-0000-4000-8000-000000000003 --build-arg VITE_API_URL=http://127.0.0.1:8000 -t "$frontend_image" -f frontend/Dockerfile frontend
          test "$(docker image inspect "$backend_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$APPLICATION_SHA"
          test "$(docker image inspect "$frontend_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$APPLICATION_SHA"
          printf '{"result":"PASS","backend_revision_label_match":true,"frontend_revision_label_match":true,"image_push_count":0}\n' > "$EVIDENCE_DIR/container-build.result.json"

      - name: Final safety, derived summary, and evidence gate
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          test "${MAIN_MODIFIED:-false}" = false
          test "${FORCE_PUSH_USED:-false}" = false
          test "${AZURE_LOGIN_EXECUTED:-false}" = false
          test "${AZURE_RESOURCE_MUTATION_COUNT:-0}" = 0
          test "${ENTRA_MUTATION_COUNT:-0}" = 0
          test "${DEPLOYMENTS:-0}" = 0
          test "${IMAGE_PUSH_COUNT:-0}" = 0
          tracked_changes="$(git status --porcelain --untracked-files=no)"
          if [ "$tracked_changes" = " M mock-systems/excel/permit_tracker.xlsx" ]; then
            git restore --source=HEAD -- mock-systems/excel/permit_tracker.xlsx
          elif [ -n "$tracked_changes" ]; then
            printf '%s\n' "$tracked_changes"
            exit 1
          fi
          test -z "$(git status --porcelain)"
          git diff --check
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["EVIDENCE_DIR"])
          def load(name):
              path = root / name
              assert path.is_file(), name
              value = json.loads(path.read_text(encoding="utf-8"))
              assert value.get("result") == "PASS", name
              return value
          for name in ["evidence-directory.result.json", "identity.json", "main-reconciliation.json", "source-parity.json", "phase5-freeze.json", "native-sqlserver.result.json", "sqlserver-targeted.result.json", "phase4-regression.result.json", "protected-action-denial.result.json", "phase5-regression.result.json", "backend-regression.result.json", "browser-quality.result.json", "container-build.result.json"]:
              load(name)
          for name in ["browser.result.txt", "frontend-regression.result.txt", "frontend-production-build.result.txt"]:
              assert (root / name).read_text(encoding="utf-8").strip() == "PASS"
          sql = load("sqlserver-targeted.result.json")
          assert sql["gate_count"] == 16 and sql["failed_count"] == 0 and sql["skipped_count"] == 0
          assert sql["portability_probe_count"] == 2 and sql["portability_probe_pass_count"] == 2
          assert sql["portability_probe_fail_count"] == 0 and sql["portability_probe_not_executed_count"] == 0
          forbidden = re.compile(r"SQLSERVER_PASSWORD|DATABASE_URL|access[_-]?token|bearer\s+[A-Za-z0-9._-]+|client_secret|password=|pwd=", re.I)
          local_path = re.compile(r"/home/runner|/Users/|/private/tmp|\\Users\\")
          assert not any(forbidden.search(path.read_text(encoding="utf-8", errors="strict")) for path in root.rglob("*") if path.is_file())
          assert not any(local_path.search(path.read_text(encoding="utf-8", errors="strict")) for path in root.rglob("*") if path.is_file())
          (root / "safety-boundary.json").write_text(json.dumps({
              "result":"PASS", "azure_login_executed":False, "azure_resource_mutation_count":0,
              "entra_mutation_count":0, "synology_accessed":False, "smb_accessed":False,
              "real_amec_data_used":False, "deployments":0, "image_push_count":0,
              "main_modified":False, "force_push_used":False, "git_diff_check":"PASS"
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          summary = {
              "result":"PASS", "production_integration_runtime_validation":"PASS",
              "application_sha":os.environ["APPLICATION_SHA"], "application_branch_moved":False,
              "accepted_phase5_is_ancestor":load("identity.json")["accepted_phase5_is_ancestor"],
              "historical_main_is_ancestor":load("identity.json")["historical_main_is_ancestor"],
              "accepted_phase5_tree_preserved_during_main_reconciliation":True,
              "account_source_byte_parity_count":load("source-parity.json")["account_source_byte_parity_count"],
              "foundation_source_byte_parity_count":load("source-parity.json")["foundation_source_byte_parity_count"],
              "phase5_frozen_path_mismatch_count":load("source-parity.json")["phase5_frozen_path_mismatch_count"],
              "native_sqlserver":load("native-sqlserver.result.json")["result"],
              "sqlserver_gate_count":sql["gate_count"], "sqlserver_gate_failed_count":sql["failed_count"],
              "sqlserver_gate_skipped_count":sql["skipped_count"],
              "sqlserver_portability_probe_count":sql["portability_probe_count"],
              "sqlserver_portability_probe_pass_count":sql["portability_probe_pass_count"],
              "sqlserver_portability_probe_fail_count":sql["portability_probe_fail_count"],
              "sqlserver_portability_probe_not_executed_count":sql["portability_probe_not_executed_count"],
              "phase5_regression":load("phase5-regression.result.json")["result"],
              "phase4_integration_regression":load("phase4-regression.result.json")["result"],
              "protected_action_denial":load("protected-action-denial.result.json")["result"],
              "full_backend_regression":load("backend-regression.result.json")["result"],
              "real_sql_backed_browser":"PASS", "frontend_regression":"PASS",
              "frontend_production_build":"PASS", "backend_production_image_build":"PASS",
              "frontend_production_image_build":"PASS", "summary_derivation":"PASS",
              "summary_input_missing_count":0, "summary_input_fail_count":0,
              "production_integration_self_accepted":False
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("PRODUCTION_INTEGRATION_RUNTIME_VALIDATION=PASS")

      - name: Prepare sanitized evidence package
        id: package
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="${EVIDENCE_DIR:-$RUNNER_TEMP/production-integration-r2-evidence}"
          UPLOAD_EVIDENCE_DIR="${UPLOAD_EVIDENCE_DIR:-$RUNNER_TEMP/production-integration-r2-upload}"
          export EVIDENCE_DIR UPLOAD_EVIDENCE_DIR
          mkdir -p "$EVIDENCE_DIR" "$UPLOAD_EVIDENCE_DIR"
          cat > "$RUNNER_TEMP/r2_packager.py" <<'PY'
          import hashlib, json, os, re, shutil, sys
          from pathlib import Path
          source = Path(sys.argv[1]); upload = Path(sys.argv[2])
          allowlist = [
              "evidence-directory.result.json", "runner-platform.result.json", "playwright-install.result.txt",
              "identity.json", "main-reconciliation.json", "source-parity.json", "phase5-freeze.json",
              "account-audit.result.txt", "release-validation.result.txt", "foundation-bicep.result.json",
              "sqlserver-bootstrap.result.json", "sqlserver-bootstrap-diagnostic.json", "native-sqlserver.result.json",
              "sqlserver-targeted.result.json", "phase4-regression.result.json", "protected-action-denial.result.json",
              "phase5-regression.result.json", "backend-regression.result.json", "observability-regression.result.json",
              "browser.result.txt", "browser-quality.result.json", "frontend-regression.result.txt",
              "frontend-production-build.result.txt", "container-build.result.json", "safety-boundary.json", "summary.json"
          ]
          secret = re.compile(r"SQLSERVER_PASSWORD|DATABASE_URL|access[_-]?token|bearer\s+[A-Za-z0-9._-]+|client_secret|password=|pwd=", re.I)
          local_path = re.compile(r"/home/runner|/Users/|/private/tmp|\\Users\\")
          if upload.exists(): shutil.rmtree(upload)
          upload.mkdir(parents=True)
          rejected = []
          for name in allowlist:
              path = source / name
              if not path.is_file(): continue
              text = path.read_text(encoding="utf-8")
              if secret.search(text) or local_path.search(text):
                  rejected.append(name)
                  continue
              shutil.copyfile(path, upload / name)
          package_status = {"result": "FAIL" if rejected else "PASS", "rejected_file_count": len(rejected), "rejected_files": rejected}
          (upload / "package-status.json").write_text(json.dumps(package_status, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          manifest = upload / "MANIFEST.sha256"
          files = sorted(path for path in upload.iterdir() if path.is_file() and path.name != "MANIFEST.sha256")
          manifest.write_text("".join(hashlib.sha256(path.read_bytes()).hexdigest() + "  " + path.name + "\n" for path in files), encoding="utf-8")
          rows = [line.rstrip("\n").split("  ", 1) for line in manifest.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert all(len(row) == 2 and row[1] != "-" and not Path(row[1]).is_absolute() for row in rows)
          mismatches = sum(1 for digest, name in rows if not (upload / name).is_file() or hashlib.sha256((upload / name).read_bytes()).hexdigest() != digest)
          dash_paths = sum(1 for row in rows if row[1] == "-")
          assert mismatches == 0 and dash_paths == 0
          final_secret = sum(1 for path in upload.iterdir() if path.is_file() and (secret.search(path.read_text(encoding="utf-8")) or local_path.search(path.read_text(encoding="utf-8"))))
          assert final_secret == 0
          print("PACKAGE_STATUS=" + package_status["result"])
          print("EVIDENCE_MANIFEST_MISMATCH_COUNT=" + str(mismatches))
          print("EVIDENCE_SECRET_PATTERN_MATCH_COUNT=" + str(final_secret))
          print("EVIDENCE_LOCAL_ABSOLUTE_PATH_MATCH_COUNT=0")
          print("MANIFEST_DASH_PATH_COUNT=" + str(dash_paths))
          if rejected: raise SystemExit(1)
          PY
          python "$RUNNER_TEMP/r2_packager.py" "$EVIDENCE_DIR" "$UPLOAD_EVIDENCE_DIR"

      - name: Upload sanitized production-integration evidence only
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ProposalOps_Production_Integration_V1R2_Evidence
          path: ${{ env.UPLOAD_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup disposable SQL Server and application processes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/api.pid" ]; then kill "$(cat "$RUNNER_TEMP/api.pid")" >/dev/null 2>&1 || :; fi
          if [ -f "$RUNNER_TEMP/frontend.pid" ]; then kill "$(cat "$RUNNER_TEMP/frontend.pid")" >/dev/null 2>&1 || :; fi
          if [ -n "${SQL_CONTAINER:-}" ]; then docker rm -f "$SQL_CONTAINER" >/dev/null 2>&1 || :; fi
          docker image prune -f >/dev/null 2>&1 || :
