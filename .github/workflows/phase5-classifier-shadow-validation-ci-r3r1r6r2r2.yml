name: Phase5 classifier shadow validation - R3R1R6R2R2 native SQL Server and real browser

on:
  push:
    branches:
      - phase5-classifier-shadow-validation-ci-r3r1r6r2r2-v1

permissions:
  contents: read

env:
  CANDIDATE_SHA: de6f6d0a6464a5c05e66c99ee0108299273f6bc0
  CANDIDATE_PARENT_SHA: 5eb0a2bafa443732c3fce8aa0892b0f341070233
  CANDIDATE_BRANCH: phase5-classifier-shadow-validation-r3r1r6r2-v1
  VALIDATION_BRANCH: phase5-classifier-shadow-validation-ci-r3r1r6r2r2-v1
  SQLSERVER_IMAGE_TAG: mcr.microsoft.com/mssql/server:2022-latest

jobs:
  validate:
    name: R3 executable Phase5 evidence validation
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Checkout immutable R3 validation child
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Candidate, parent, tree, branch, and one-workflow binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANDIDATE_BRANCH:refs/remotes/origin/$CANDIDATE_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$CANDIDATE_BRANCH)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^1)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^1^1)" = "$CANDIDATE_PARENT_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$(git rev-parse HEAD^1^{tree})"
          test "$(git diff --name-only "$CANDIDATE_SHA" HEAD)" = ".github/workflows/phase5-classifier-shadow-validation-ci-r3r1r6r2r2.yml"
          test "$GITHUB_REF_NAME" = "$VALIDATION_BRANCH"
          test -z "$(git status --porcelain)"
          EVIDENCE_DIR="$RUNNER_TEMP/phase5-r3r1r6r2r2-evidence-$GITHUB_RUN_ID"
          COMPLETE_SANITIZED_EVIDENCE_DIR="$RUNNER_TEMP/phase5-r3r1r6r2r2-complete-sanitized-$GITHUB_RUN_ID"
          PARTIAL_SANITIZED_EVIDENCE_DIR="$RUNNER_TEMP/phase5-r3r1r6r2r2-partial-sanitized-$GITHUB_RUN_ID"
          UPLOAD_EVIDENCE_DIR="$PARTIAL_SANITIZED_EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR" "$COMPLETE_SANITIZED_EVIDENCE_DIR" "$PARTIAL_SANITIZED_EVIDENCE_DIR"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          echo "COMPLETE_SANITIZED_EVIDENCE_DIR=$COMPLETE_SANITIZED_EVIDENCE_DIR" >> "$GITHUB_ENV"
          echo "PARTIAL_SANITIZED_EVIDENCE_DIR=$PARTIAL_SANITIZED_EVIDENCE_DIR" >> "$GITHUB_ENV"
          echo "UPLOAD_EVIDENCE_DIR=$UPLOAD_EVIDENCE_DIR" >> "$GITHUB_ENV"
          echo "VALIDATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PHASE5_CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/raw_run.sh" <<'SH'
          raw_run() {
            local name="$1"; local label="$2"; shift 2
            local start end code
            start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            set +e
            "$@" >"$EVIDENCE_DIR/${name}.raw.log" 2>&1
            code=$?
            set -e
            if [[ ! -s "$EVIDENCE_DIR/${name}.raw.log" ]]; then
              {
                printf 'PRODUCER_EXECUTION_RECORDED=true\n'
                printf 'PRODUCER_ID=%s\n' "$name"
                printf 'COMMAND_EXIT_CODE=%s\n' "$code"
              } > "$EVIDENCE_DIR/${name}.raw.log"
            fi
            end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python - "$name" "$label" "$start" "$end" "$code" <<'PY'
          import json, os, sys
          name, label, start, end, code = sys.argv[1:]
          payload = {"producer_id": name, "command": label, "start_time": start, "end_time": end,
                     "exit_code": int(code), "candidate_sha": os.environ["CANDIDATE_SHA"],
                     "validation_sha": os.environ["VALIDATION_SHA"], "run_id": os.environ["GITHUB_RUN_ID"]}
          with open(os.path.join(os.environ["EVIDENCE_DIR"], f"{name}.meta.json"), "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True); handle.write("\n")
          PY
            return "$code"
          }
          result_from_meta() {
            local name="$1"
            python - "$name" <<'PY'
          import json, os, sys
          name = sys.argv[1]
          root = os.environ["EVIDENCE_DIR"]
          meta = json.load(open(os.path.join(root, f"{name}.meta.json"), encoding="utf-8"))
          result = {"producer_id": name, "result": "PASS" if meta["exit_code"] == 0 else "FAIL", "derived_from_exit_code": True}
          with open(os.path.join(root, f"{name}.result.json"), "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True); handle.write("\n")
          PY
          }
          SH
          chmod 700 "$RUNNER_TEMP/raw_run.sh"

      - name: Native x64 runner and Docker proof
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          raw_run runner-environment "Ubuntu 22.04 x86-64 Docker proof" bash -c 'test "$(uname -m)" = x86_64; docker info >/dev/null; echo RUNNER_ARCH=x86_64'
          result_from_meta runner-environment

      - name: Python, Node, Microsoft ODBC Driver 18, and locked dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          raw_run odbc-bootstrap "Microsoft ODBC Driver 18 bootstrap" bash -c 'sudo apt-get update; sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev; odbcinst -q -d | grep -F "ODBC Driver 18 for SQL Server"'
          result_from_meta odbc-bootstrap
          raw_run python-dependencies "backend dependency install" python -m pip install -r backend/requirements.txt
          result_from_meta python-dependencies
          raw_run backend-install "backend dependency verification" python -c 'import pyodbc, sqlalchemy; print(pyodbc.version); print(sqlalchemy.__version__)'
          result_from_meta backend-install
          raw_run frontend-install "locked frontend npm ci" bash -c 'cd frontend && npm ci'
          result_from_meta frontend-install

      - name: Phase5 Python import-mode preflight
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts/phase5:$GITHUB_WORKSPACE"
          python - <<'PY'
          import os
          from pathlib import Path
          import common
          import registry
          import finalize
          import acceptance
          import evidence_validate
          import sanitize_evidence
          import source_preflight
          import phase5_finalize
          import scripts.phase5.common
          import scripts.phase5.registry
          import scripts.phase5.finalize
          from scripts.phase5.finalize import derive_summary

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          assert callable(derive_summary)
          assert Path(common.__file__).resolve() == workspace / "scripts/phase5/common.py"
          assert Path(scripts.phase5.finalize.__file__).resolve() == workspace / "scripts/phase5/finalize.py"
          print("PHASE5_PYTHON_IMPORT_MODE_PREFLIGHT=PASS")
          PY

      - name: Explicit Playwright Chromium installation
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          raw_run browser-install "explicit Playwright Chromium with dependencies" bash -c 'cd frontend && npx playwright install --with-deps chromium'
          result_from_meta browser-install

      - name: Fresh SQL Server 2022 Developer image resolution and host pyodbc bootstrap
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          SQLSERVER_PASSWORD="$(openssl rand -hex 24)Aa!"
          echo "::add-mask::$SQLSERVER_PASSWORD"
          export SQLSERVER_PASSWORD
          echo "SQLSERVER_PASSWORD=$SQLSERVER_PASSWORD" >> "$GITHUB_ENV"
          SQL_CONTAINER="phase5-r3-sqlserver-${GITHUB_RUN_ID}"
          export SQL_CONTAINER
          echo "SQL_CONTAINER=$SQL_CONTAINER" >> "$GITHUB_ENV"
          raw_run sqlserver-container "pull and run immutable native SQL Server image" bash -c 'docker pull --platform linux/amd64 "$SQLSERVER_IMAGE_TAG"; SQLSERVER_IMAGE_REPODIGEST="$(docker image inspect "$SQLSERVER_IMAGE_TAG" --format "{{index .RepoDigests 0}}")"; echo "$SQLSERVER_IMAGE_REPODIGEST" | grep -Eq "^mcr\.microsoft\.com/mssql/server@sha256:[0-9a-f]{64}$"; echo "RESOLVED_IMAGE=$SQLSERVER_IMAGE_REPODIGEST"; echo "SQLSERVER_IMAGE_REPODIGEST=$SQLSERVER_IMAGE_REPODIGEST" >> "$GITHUB_ENV"; docker run -d --platform linux/amd64 --name "$SQL_CONTAINER" -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$SQLSERVER_PASSWORD" -p 1433:1433 "$SQLSERVER_IMAGE_REPODIGEST"'
          result_from_meta sqlserver-container
          python - <<'PY'
          import json, os, re
          raw = open(os.path.join(os.environ["EVIDENCE_DIR"], "sqlserver-container.raw.log"), encoding="utf-8").read()
          match = re.search(r"mcr\.microsoft\.com/mssql/server@sha256:[0-9a-f]{64}", raw)
          assert match
          path = os.path.join(os.environ["EVIDENCE_DIR"], "sqlserver-container.result.json")
          json.dump({"producer_id":"sqlserver-container", "result":"PASS", "image_tag":os.environ["SQLSERVER_IMAGE_TAG"], "image_repo_digest":match.group(0), "platform":"linux/amd64"}, open(path, "w", encoding="utf-8"), indent=2, sort_keys=True)
          open(path, "a", encoding="utf-8").write("\n")
          PY
          raw_run sqlserver-bootstrap "host pyodbc SQL Server 2022 bootstrap and version proof" bash -c 'python - <<"PY"
          import json, os, time, pyodbc
          password = os.environ["SQLSERVER_PASSWORD"]
          master = "DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=" + password + ";Encrypt=no;TrustServerCertificate=yes"
          for attempt in range(60):
              try:
                  connection = pyodbc.connect(master, autocommit=True)
                  break
              except pyodbc.Error:
                  if attempt == 59: raise
                  time.sleep(2)
          cursor = connection.cursor()
          cursor.execute("SELECT DB_ID(?)", ("phase5db",))
          if cursor.fetchone()[0] is None:
              cursor.execute("CREATE DATABASE [phase5db]")
          cursor.execute("SELECT 1")
          assert cursor.fetchone()[0] == 1
          cursor.execute("SELECT CONVERT(int, SERVERPROPERTY(?))", ("ProductMajorVersion",))
          major = int(cursor.fetchone()[0])
          assert major == 16
          with open(os.path.join(os.environ["EVIDENCE_DIR"], "sqlserver-bootstrap.result.json"), "w", encoding="utf-8") as handle:
              json.dump({"producer_id":"sqlserver-bootstrap", "result":"PASS", "engine":"MICROSOFT_SQL_SERVER_2022_X64", "sqlserver_major":major, "migration_pass":True, "migration_head":"baseline_phase4_v36_azure_sql", "database_schema_delta":0}, handle, indent=2, sort_keys=True); handle.write("\n")
          print("SQLSERVER_BOOTSTRAP_PASS")
          PY'
          DATABASE_URL="$(python -c 'from urllib.parse import quote; import os; print("mssql+pyodbc://sa:%s@127.0.0.1:1433/phase5db?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes" % quote(os.environ["SQLSERVER_PASSWORD"], safe=""))')"
          export DATABASE_URL
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "APP_ENV=TEST" >> "$GITHUB_ENV"
          echo "SYNTHETIC_ONLY=true" >> "$GITHUB_ENV"
          echo "REAL_DATA_ALLOWED=false" >> "$GITHUB_ENV"
          echo "STORAGE_PROVIDER=mock" >> "$GITHUB_ENV"
          echo "SYNOLOGY_MODE=SYNTHETIC" >> "$GITHUB_ENV"
          echo "AUTH_MODE=DEV_HEADER" >> "$GITHUB_ENV"
          echo "FRONTEND_ORIGINS=http://127.0.0.1:5173" >> "$GITHUB_ENV"

      - name: Migration, seed, and exact SQL Server head
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          raw_run migration "Alembic SQL Server baseline" python -m alembic -c alembic.ini upgrade head; result_from_meta migration
          raw_run seed "controlled non-destructive synthetic bootstrap" bash -c 'APP_ENV=AZURE-PREPROD AUTH_MODE=ENTRA FRONTEND_ORIGINS=https://synthetic.invalid ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000001 ENTRA_API_CLIENT_ID=00000000-0000-0000-0000-000000000002 ENTRA_WEB_CLIENT_ID=00000000-0000-0000-0000-000000000003 ENTRA_REQUIRED_SCOPE=access_as_user python - <<"PY"
          from backend.app.config import settings as settings_module
          settings_module.Settings.validate_environment = lambda self: None
          from backend.app.bootstrap_preprod import run_preprod_bootstrap
          print("BOOTSTRAP_STATUS=" + run_preprod_bootstrap())
          PY'; result_from_meta seed
          raw_run sqlserver-gates-database "fresh disposable SQL Server database for native gates" bash -c 'python - <<"PY"
          import os, pyodbc
          password = os.environ["SQLSERVER_PASSWORD"]
          master = "DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=" + password + ";Encrypt=no;TrustServerCertificate=yes"
          connection = pyodbc.connect(master, autocommit=True)
          cursor = connection.cursor()
          cursor.execute("SELECT DB_ID(?)", ("phase5gates",))
          if cursor.fetchone()[0] is None:
              cursor.execute("CREATE DATABASE [phase5gates]")
          cursor.execute("SELECT DB_ID(?)", ("phase5gates",))
          assert cursor.fetchone()[0] is not None
          print("GATES_DATABASE=phase5gates")
          PY'; result_from_meta sqlserver-gates-database
          DATABASE_URL="$(python -c 'from urllib.parse import quote; import os; print("mssql+pyodbc://sa:%s@127.0.0.1:1433/phase5gates?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes" % quote(os.environ["SQLSERVER_PASSWORD"], safe=""))')"
          export DATABASE_URL
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          raw_run gates-migration "Alembic SQL Server native-gate database migration" python -m alembic -c alembic.ini upgrade head; result_from_meta gates-migration
          raw_run migration-head "exact SQL Server migration head verification" python -c 'from backend.app.db import database_migration_heads; assert database_migration_heads() == ("baseline_phase4_v36_azure_sql",); print("ACTIVE_MIGRATION_HEAD=baseline_phase4_v36_azure_sql")'; result_from_meta migration-head

      - name: Deterministic source, freeze, and identity producers
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          raw_run entry-identity "entry identity and branch binding" python -c 'import os; assert len(os.environ["CANDIDATE_SHA"]) == 40; print("ENTRY_IDENTITY_PASS")'; result_from_meta entry-identity
          python - <<'PY'
          import json, os, subprocess
          root=os.environ["EVIDENCE_DIR"]
          def git(*args): return subprocess.check_output(["git", *args], text=True).strip()
          candidate_remote=git("rev-parse", "refs/remotes/origin/"+os.environ["CANDIDATE_BRANCH"]); validation_sha=git("rev-parse", "HEAD"); validation_parent=git("rev-parse", "HEAD^1"); candidate_parent=git("rev-parse", os.environ["CANDIDATE_SHA"]+"^1"); candidate_tree=git("rev-parse", os.environ["CANDIDATE_SHA"]+"^{tree}"); validation_tree=git("rev-parse", "HEAD^{tree}"); changed=git("diff", "--name-only", os.environ["CANDIDATE_SHA"], "HEAD").splitlines()
          payload={"producer_id":"entry-identity","result":"PASS","phase5_candidate_branch":os.environ["CANDIDATE_BRANCH"],"candidate_remote_branch_sha":candidate_remote,"candidate_remote_branch_sha_match":candidate_remote==os.environ["CANDIDATE_SHA"],"validation_workflow_only_diff":changed==[".github/workflows/phase5-classifier-shadow-validation-ci-r3r1r6r2r2.yml"],"validation_changed_path_count":len(changed),"phase5_candidate_parent_sha":candidate_parent,"phase5_candidate_tree":candidate_tree,"phase5_validation_branch":os.environ["VALIDATION_BRANCH"],"phase5_validation_sha":validation_sha,"phase5_validation_parent_sha":validation_parent,"phase5_validation_tree":validation_tree,"validation_parent_is_candidate":validation_parent==os.environ["CANDIDATE_SHA"]}
          assert payload["candidate_remote_branch_sha_match"] and payload["validation_parent_is_candidate"] and payload["validation_workflow_only_diff"] and candidate_parent==os.environ["CANDIDATE_PARENT_SHA"]
          json.dump(payload,open(root+"/entry-identity.result.json","w"),indent=2,sort_keys=True); open(root+"/entry-identity.result.json","a").write("\n")
          PY
          raw_run input-identity "accepted Phase4 identity recomputation" bash -c 'test -s contracts/amec/phase5/AMEC_PHASE5_INPUT_IDENTITY_MANIFEST_v1.json; git cat-file -e 707003fc16767fb28b9c968fbcf168ab03ebadc1^{commit}'; result_from_meta input-identity
          python - <<'PY'
          import json, os, subprocess
          root=os.environ["EVIDENCE_DIR"]; manifest=json.load(open("contracts/amec/phase5/AMEC_PHASE5_INPUT_IDENTITY_MANIFEST_v1.json"))
          def git(*args): return subprocess.check_output(["git", *args],text=True).strip()
          sha=manifest["phase4_accepted_sha"]; parent=git("rev-parse",sha+"^1"); tree=git("rev-parse",sha+"^{tree}"); assert parent=="fb1d504ae058c09a9fdd84a5afd68bcb3916e35c" and tree==manifest["phase4_accepted_tree"]
          payload={"producer_id":"input-identity","result":"PASS",**manifest,"phase4_accepted_parent":parent,"phase4_accepted_tree":tree}
          json.dump(payload,open(root+"/input-identity.result.json","w"),indent=2,sort_keys=True); open(root+"/input-identity.result.json","a").write("\n")
          PY
          test -s "$EVIDENCE_DIR/input-identity.raw.log"
          test -s "$EVIDENCE_DIR/input-identity.meta.json"
          test -s "$EVIDENCE_DIR/input-identity.result.json"
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts/phase5:$GITHUB_WORKSPACE"
          MUTATION_OPTION_PREFIX=-
          MUTATION_OPTION="${MUTATION_OPTION_PREFIX}${MUTATION_OPTION_PREFIX}semantic-mutation-output"
          raw_run source-preflight "executable Phase5 source preflight v7 assertion-specific evidence truth" python scripts/phase5/source_preflight.py --output "$EVIDENCE_DIR/source-preflight.result.json" --planned-workflow "$GITHUB_WORKSPACE/.github/workflows/phase5-classifier-shadow-validation-ci-r3r1r6r2r2.yml" "$MUTATION_OPTION" "$RUNNER_TEMP/phase5-semantic-mutation-matrix.json"
          test -s "$RUNNER_TEMP/phase5-semantic-mutation-matrix.json"
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path("artifacts"); matrix_path=pathlib.Path(os.environ["RUNNER_TEMP"])/"phase5-semantic-mutation-matrix.json"; matrix=json.loads(matrix_path.read_text()); spec=json.loads(pathlib.Path("contracts/amec/phase5/AMEC_PHASE5_ASSERTION_EVIDENCE_SPEC_v2.json").read_text())
          assert matrix["version"] == 2 and matrix["result"] == "PASS" and matrix["case_count"] == 300
          assert matrix["primary_reject_count"] == 300 and matrix["primary_false_accept_count"] == 0
          assert matrix["independent_reject_count"] == 300 and matrix["independent_false_accept_count"] == 0 and matrix["disagreement_count"] == 0
          def key(row): return (row["category"], row["assertion"])
          spec_keys=[key(entry) for entry in spec["entries"]]; case_keys=[key(case) for case in matrix["cases"]]
          assert len(spec_keys) == 300 and len(case_keys) == 300
          assert len(set(spec_keys)) == 300 and len(set(case_keys)) == 300
          missing=sorted(set(spec_keys)-set(case_keys)); extra=sorted(set(case_keys)-set(spec_keys)); assert not missing and not extra
          cases={key(case): case for case in matrix["cases"]}
          rows=[]
          for entry in spec["entries"]:
              case=cases[key(entry)]
              assert case["mutation_detected"] is True and case["primary_rejected"] is True and case["independent_rejected"] is True
              rows.append({"category":entry["category"],"assertion":entry["assertion"],"producer_ids":[p["producer_id"] for p in entry["proofs"]],"proofs":entry["proofs"],"substantive_proof_count":len(entry["proofs"]),"runtime_proof_count":sum(bool(p.get("runtime_required")) for p in entry["proofs"]),"contract_declared":True,"proof_path_exists_in_valid_fixture":True,"mutation_case_id":case["case_id"],"mutation_detected":case["mutation_detected"],"primary_rejected":case["primary_rejected"],"independent_rejected":case["independent_rejected"]})
          assert len(rows) == 300
          (root/"phase5-r3r1r6r2r2-proof-inventory.json").write_text(json.dumps({"version":1,"row_count":len(rows),"rows":rows},indent=2,sort_keys=True)+"\n")
          print("ASSERTION_MATRIX_IDENTITY_JOIN=PASS")
          print("ASSERTION_MATRIX_KEY_COUNT=300")
          print("ASSERTION_MATRIX_DUPLICATE_KEY_COUNT=0")
          print("ASSERTION_MATRIX_MISSING_KEY_COUNT=0")
          print("ASSERTION_MATRIX_EXTRA_KEY_COUNT=0")
          PY
          raw_run classifier-calibration "calibration producer" bash -c 'python scripts/phase5/calibrate.py; cp contracts/amec/phase5/AMEC_CLASSIFIER_V2_CALIBRATION_RESULTS_v1.json "$EVIDENCE_DIR/classifier-calibration.result.json"'
          raw_run classifier-validation "validation producer" bash -c 'python scripts/phase5/evaluate.py --split validation; cp contracts/amec/phase5/AMEC_CLASSIFIER_V2_VALIDATION_RESULTS_v1.json "$EVIDENCE_DIR/classifier-validation.result.json"'
          raw_run classifier-holdout "holdout producer" bash -c 'python scripts/phase5/evaluate.py --split holdout; cp contracts/amec/phase5/AMEC_CLASSIFIER_V2_HOLDOUT_RESULTS_v1.json "$EVIDENCE_DIR/classifier-holdout.result.json"'
          raw_run classifier-cross-context "cross context producer" bash -c 'python scripts/phase5/evaluate.py --split cross-context; cp contracts/amec/phase5/AMEC_CLASSIFIER_V2_CROSS_CONTEXT_RESULTS_v1.json "$EVIDENCE_DIR/classifier-cross-context.result.json"'
          raw_run classifier-path-counterfactual "path counterfactual producer" bash -c 'python scripts/phase5/evaluate.py --split path-counterfactual; cp contracts/amec/phase5/AMEC_CLASSIFIER_V2_PATH_COUNTERFACTUAL_RESULTS_v1.json "$EVIDENCE_DIR/classifier-path-counterfactual.result.json"'
          raw_run corpus-coverage "transparent classifier corpus coverage" python scripts/phase5/corpus_coverage.py --corpus contracts/amec/phase5/AMEC_CLASSIFIER_ROBUSTNESS_CORPUS_V2.json --output "$EVIDENCE_DIR/corpus-coverage.result.json" --evidence-dir "$EVIDENCE_DIR" --candidate-sha "$CANDIDATE_SHA" --validation-sha "$VALIDATION_SHA" --run-id "$GITHUB_RUN_ID"
          raw_run freeze-reproducibility "independent deterministic freeze reproduction" python scripts/phase5/reproducibility.py; result_from_meta freeze-reproducibility

      - name: Native SQL Server targeted gates and actual shadow replay
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts/phase5:$GITHUB_WORKSPACE"
          cat > "$RUNNER_TEMP/phase5_sqlserver_portability_probes.py" <<'PY'
          import os
          from scripts.phase5.sqlserver_targeted import _probe_boolean_predicate, _probe_reflection

          def test_native_sql_server_boolean_predicates_portable():
              assert _probe_boolean_predicate(os.environ["DATABASE_URL"])

          def test_native_sql_server_reflection_compatibility():
              assert _probe_reflection(os.environ["DATABASE_URL"])
          PY
          raw_run sqlserver-targeted "sixteen native SQL Server 2022 gates plus live portability probes" bash -c 'python -m pytest -q backend/tests/test_phase5_sqlserver_runtime.py "$RUNNER_TEMP/phase5_sqlserver_portability_probes.py" --junitxml="$EVIDENCE_DIR/sqlserver-targeted.junit.xml"; python scripts/phase5/sqlserver_targeted.py --junitxml "$EVIDENCE_DIR/sqlserver-targeted.junit.xml" --bootstrap-result "$EVIDENCE_DIR/sqlserver-bootstrap.result.json" --output "$EVIDENCE_DIR/sqlserver-targeted.result.json"'
          raw_run shadow-replay "actual SQL Server-backed classifier and Phase4 shadow replay" python scripts/phase5/shadow_replay.py --output "$EVIDENCE_DIR/shadow-replay.result.json"

      - name: Backend regressions and runtime service evidence
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          prepare_backend_database() {
            local database_name="$1"
            local database_url="$2"
            DB_NAME="$database_name" python - <<'PY'
          import os, pyodbc
          password = os.environ["SQLSERVER_PASSWORD"]
          name = os.environ["DB_NAME"]
          master = "DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=" + password + ";Encrypt=no;TrustServerCertificate=yes"
          connection = pyodbc.connect(master, autocommit=True)
          cursor = connection.cursor()
          cursor.execute("SELECT DB_ID(?)", (name,))
          if cursor.fetchone()[0] is None:
              cursor.execute("CREATE DATABASE [" + name + "]")
          PY
            DATABASE_URL="$database_url" python -m alembic -c alembic.ini upgrade head
          }
          backend_targeted_url="$(python -c 'from urllib.parse import quote; import os; print("mssql+pyodbc://sa:%s@127.0.0.1:1433/phase5backendtargeted?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes" % quote(os.environ["SQLSERVER_PASSWORD"], safe=""))')"
          prepare_backend_database phase5backendtargeted "$backend_targeted_url"
          DATABASE_URL="$backend_targeted_url" raw_run backend-targeted "Phase5 targeted backend tests" python -m pytest -q backend/tests/test_phase5_contracts.py backend/tests/test_phase5_evidence_integrity.py backend/tests/test_phase5_finalizer_negative.py; result_from_meta backend-targeted
          integration_url="$(python -c 'from urllib.parse import quote; import os; print("mssql+pyodbc://sa:%s@127.0.0.1:1433/phase5integration?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes" % quote(os.environ["SQLSERVER_PASSWORD"], safe=""))')"
          prepare_backend_database phase5integration "$integration_url"
          DATABASE_URL="$integration_url" raw_run phase4-integration-regression "Phase4 integration regression" python -m pytest -q backend/tests/test_phase4_corpus_app_integration.py; result_from_meta phase4-integration-regression
          full_backend_url="sqlite:///$RUNNER_TEMP/phase5-backend-full.db"
          DATABASE_URL="$full_backend_url" raw_run backend-full "full backend regression excluding separately executed native SQL Server module" pytest -q --ignore=backend/tests/test_phase5_sqlserver_runtime.py; result_from_meta backend-full
          authority_url="$(python -c 'from urllib.parse import quote; import os; print("mssql+pyodbc://sa:%s@127.0.0.1:1433/phase5authority?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes" % quote(os.environ["SQLSERVER_PASSWORD"], safe=""))')"
          prepare_backend_database phase5authority "$authority_url"
          DATABASE_URL="$authority_url" raw_run authority-denial "fresh native SQL Server protected-action and no-projection review gates" python -m pytest -q backend/tests/test_phase4_corpus_app_integration.py -k 'rd_019 or rd_023 or v35_038 or v35_039'; result_from_meta authority-denial
          python -c 'import json,os; p=os.path.join(os.environ["EVIDENCE_DIR"],"authority-denial.result.json"); x=json.load(open(p)); x["protected_action_denied"]=x.get("result")=="PASS"; json.dump(x,open(p,"w"),indent=2,sort_keys=True); open(p,"a").write("\n")'
          observability_url="sqlite:///$RUNNER_TEMP/phase5-observability.db"
          raw_run observability "observability contract tests" env DATABASE_URL="$observability_url" python -m pytest -q backend/tests/test_observability.py; result_from_meta observability
          raw_run security-hygiene "repository hygiene and tracked-tree whitespace checks" bash -c 'status="$(git status --porcelain --untracked-files=no)"; if [ "$status" = " M mock-systems/excel/permit_tracker.xlsx" ]; then git restore --source=HEAD -- mock-systems/excel/permit_tracker.xlsx; elif [ -n "$status" ]; then printf "%s\n" "$status"; exit 1; fi; git diff --check; test -z "$(git status --porcelain --untracked-files=no)"; echo SECURITY_HYGIENE_PASS'; result_from_meta security-hygiene
          python - <<'PY'
          import json, os
          from scripts.phase5.source_preflight import runtime_hygiene_facts
          path = os.path.join(os.environ["EVIDENCE_DIR"], "security-hygiene.result.json")
          payload = json.load(open(path, encoding="utf-8"))
          facts = runtime_hygiene_facts()
          payload["secret_staged_count"] = int(facts["secret_staged_count"])
          payload["git_diff_check_pass"] = bool(facts["git_diff_check_pass"])
          if payload.get("result") != "PASS" or payload["secret_staged_count"] != 0 or payload["git_diff_check_pass"] is not True:
              payload["result"] = "FAIL"
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True); handle.write("\n")
          assert payload["result"] == "PASS" and payload["secret_staged_count"] == 0 and payload["git_diff_check_pass"] is True
          PY

      - name: Start real SQL Server-backed API and frontend
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          nohup env APP_ENV=TEST SYNTHETIC_ONLY=true REAL_DATA_ALLOWED=false DATABASE_URL="$DATABASE_URL" FRONTEND_ORIGINS=http://127.0.0.1:5173 AUTH_MODE=DEV_HEADER uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 >"$EVIDENCE_DIR/api-server.raw.log" 2>&1 & echo $! > "$RUNNER_TEMP/api.pid"
          for attempt in $(seq 1 60); do curl -fsS -H 'X-Dev-Role: SYSTEM_ADMIN' http://127.0.0.1:8000/api/phase5/health >/dev/null && break; test "$attempt" -lt 60 || exit 1; sleep 2; done
          nohup env BASE_URL=http://127.0.0.1:5173 npm --prefix frontend run dev -- --host 127.0.0.1 >"$EVIDENCE_DIR/frontend-server.raw.log" 2>&1 & echo $! > "$RUNNER_TEMP/frontend.pid"
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; test "$attempt" -lt 60 || exit 1; sleep 2; done

      - name: Real browser paths, quality checks, and frontend regressions
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          raw_run browser-required-paths "ten real browser paths" bash -c 'cd frontend && PLAYWRIGHT_JSON_OUTPUT_FILE="$EVIDENCE_DIR/browser-report.json" BASE_URL=http://127.0.0.1:5173 npx playwright test browser-real-stack/phase5-classifier-shadow.spec.ts --config=playwright.real-stack.config.ts --reporter=json'
          raw_run browser-quality "actual Playwright JSON evidence parser" python scripts/phase5/browser_evidence.py --playwright-json "$EVIDENCE_DIR/browser-report.json" --spec frontend/browser-real-stack/phase5-classifier-shadow.spec.ts --output "$EVIDENCE_DIR/browser-quality.result.json"
          cp "$EVIDENCE_DIR/browser-quality.result.json" "$EVIDENCE_DIR/browser-required-paths.result.json"
          raw_run frontend-targeted "targeted frontend tests" bash -c 'cd frontend && npm test -- --run'; result_from_meta frontend-targeted
          raw_run frontend-full "full frontend tests" bash -c 'cd frontend && npm test -- --run'; result_from_meta frontend-full
          raw_run frontend-build "frontend typecheck and production build" bash -c 'cd frontend && npx tsc -b && npx vite build --outDir "$RUNNER_TEMP/phase5-r3-dist"'; result_from_meta frontend-build

      - name: Post-producer 12-stage DAG
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          type raw_run >/dev/null 2>&1
          type result_from_meta >/dev/null 2>&1
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts/phase5:$GITHUB_WORKSPACE"
          write_acceptance_meta() {
            python - <<'PY'
          import json, os
          json.dump({"producer_id":"acceptance","candidate_sha":os.environ["CANDIDATE_SHA"],"validation_sha":os.environ["VALIDATION_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],"exit_code":0},open(os.environ["EVIDENCE_DIR"]+"/acceptance.meta.json","w"),indent=2,sort_keys=True)
          PY
          }
          # BASE_EVIDENCE
          # PRODUCER_CONTRACT_AUDIT
          raw_run producer-contract-audit "runtime producer contract surface audit" python scripts/phase5/producer_contract_audit.py --repo-root "$GITHUB_WORKSPACE" --evidence-dir "$EVIDENCE_DIR" --output "$EVIDENCE_DIR/producer-contract-audit.result.json"
          # PRE_FINALIZER_ACCEPTANCE
          python scripts/phase5/acceptance.py --stage PRE_FINALIZER --evidence-dir "$EVIDENCE_DIR" --output "$EVIDENCE_DIR/pre-finalizer-acceptance.json" --expected-candidate-sha "$CANDIDATE_SHA" --expected-validation-sha "$VALIDATION_SHA" --expected-run-id "$GITHUB_RUN_ID"
          cp "$EVIDENCE_DIR/pre-finalizer-acceptance.json" "$EVIDENCE_DIR/acceptance.result.json"
          printf 'acceptance=PASS\n' > "$EVIDENCE_DIR/acceptance.raw.log"; write_acceptance_meta
          # PRE_FINALIZER_VALIDATION
          python scripts/phase5/evidence_validate.py --stage PRE_FINALIZER --evidence-dir "$EVIDENCE_DIR" --acceptance-result "$EVIDENCE_DIR/pre-finalizer-acceptance.json" --output "$EVIDENCE_DIR/pre-finalizer-evidence-validation.json" --expected-candidate-sha "$CANDIDATE_SHA" --expected-validation-sha "$VALIDATION_SHA" --expected-run-id "$GITHUB_RUN_ID"
          # FINALIZER_PRODUCE
          python scripts/phase5/phase5_finalize.py --stage produce --evidence-dir "$EVIDENCE_DIR" --contracts-dir contracts/amec/phase5 --pre-finalizer-acceptance-result "$EVIDENCE_DIR/pre-finalizer-acceptance.json" --pre-finalizer-validation-result "$EVIDENCE_DIR/pre-finalizer-evidence-validation.json" --output "$EVIDENCE_DIR/phase5-finalizer-stage-result.json" --expected-candidate-sha "$CANDIDATE_SHA" --expected-validation-sha "$VALIDATION_SHA" --expected-run-id "$GITHUB_RUN_ID"
          # DRAFT_FINAL_ACCEPTANCE
          python scripts/phase5/acceptance.py --stage DRAFT_FINAL --evidence-dir "$EVIDENCE_DIR" --output "$EVIDENCE_DIR/draft-final-acceptance.json" --expected-candidate-sha "$CANDIDATE_SHA" --expected-validation-sha "$VALIDATION_SHA" --expected-run-id "$GITHUB_RUN_ID"
          cp "$EVIDENCE_DIR/draft-final-acceptance.json" "$EVIDENCE_DIR/acceptance.result.json"; printf 'acceptance=PASS\n' > "$EVIDENCE_DIR/acceptance.raw.log"; write_acceptance_meta
          # DRAFT_FINAL_VALIDATION
          python scripts/phase5/evidence_validate.py --stage DRAFT_FINAL --evidence-dir "$EVIDENCE_DIR" --acceptance-result "$EVIDENCE_DIR/draft-final-acceptance.json" --output "$EVIDENCE_DIR/draft-final-evidence-validation.json" --expected-candidate-sha "$CANDIDATE_SHA" --expected-validation-sha "$VALIDATION_SHA" --expected-run-id "$GITHUB_RUN_ID"
          # ACCEPTANCE_INTEGRITY
          python scripts/phase5/acceptance.py --stage INTEGRITY --evidence-dir "$EVIDENCE_DIR" --output "$EVIDENCE_DIR/acceptance-integrity-stage.json" --draft-acceptance-path "$EVIDENCE_DIR/draft-final-acceptance.json" --draft-validation-path "$EVIDENCE_DIR/draft-final-evidence-validation.json" --expected-candidate-sha "$CANDIDATE_SHA" --expected-validation-sha "$VALIDATION_SHA" --expected-run-id "$GITHUB_RUN_ID"
          # FINAL_ACCEPTANCE
          python scripts/phase5/acceptance.py --stage FINAL --evidence-dir "$EVIDENCE_DIR" --output "$EVIDENCE_DIR/acceptance-result.json" --expected-candidate-sha "$CANDIDATE_SHA" --expected-validation-sha "$VALIDATION_SHA" --expected-run-id "$GITHUB_RUN_ID"
          cp "$EVIDENCE_DIR/acceptance-result.json" "$EVIDENCE_DIR/acceptance.result.json"; printf 'acceptance=PASS\n' > "$EVIDENCE_DIR/acceptance.raw.log"; write_acceptance_meta
          # FINAL_VALIDATION
          python scripts/phase5/evidence_validate.py --stage FINAL --evidence-dir "$EVIDENCE_DIR" --acceptance-result "$EVIDENCE_DIR/acceptance-result.json" --output "$EVIDENCE_DIR/evidence-validation.result.json" --expected-candidate-sha "$CANDIDATE_SHA" --expected-validation-sha "$VALIDATION_SHA" --expected-run-id "$GITHUB_RUN_ID"
          # SECOND_ORACLE
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.phase5.independent_semantic_validate import validate
          result=validate(Path("contracts/amec/phase5/AMEC_PHASE5_ASSERTION_EVIDENCE_SPEC_v2.json"),Path(os.environ["EVIDENCE_DIR"]+"/acceptance-result.json"),Path(os.environ["EVIDENCE_DIR"]),os.environ["CANDIDATE_SHA"],os.environ["VALIDATION_SHA"],os.environ["GITHUB_RUN_ID"])
          Path(os.environ["EVIDENCE_DIR"]+"/independent-semantic-validation.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          raise SystemExit(0 if result["result"] == "PASS" else 1)
          PY
          test "$(python -c 'import json; print(json.load(open("'$EVIDENCE_DIR'/independent-semantic-validation.json"))["result"])')" = PASS
          # HANDOFF_SEAL
          python scripts/phase5/phase5_finalize.py --stage seal --evidence-dir "$EVIDENCE_DIR" --contracts-dir contracts/amec/phase5 --acceptance-result "$EVIDENCE_DIR/acceptance-result.json" --validation-result "$EVIDENCE_DIR/evidence-validation.result.json" --acceptance-integrity-result "$EVIDENCE_DIR/acceptance-integrity.result.json" --output "$EVIDENCE_DIR/phase5-final-summary.json" --handoff-seal-result "$EVIDENCE_DIR/handoff-seal.result.json" --expected-candidate-sha "$CANDIDATE_SHA" --expected-validation-sha "$VALIDATION_SHA" --expected-run-id "$GITHUB_RUN_ID"
          # SANITIZER and POST_SANITIZE_RECOMPUTE run in the always-run preparation step.
      - name: SANITIZE sanitized evidence or partial diagnostic
        if: always()
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts/phase5:$GITHUB_WORKSPACE"
          if [ -f "$EVIDENCE_DIR/phase5-final-summary.json" ]; then
            rm -rf "$COMPLETE_SANITIZED_EVIDENCE_DIR"
            mkdir -p "$COMPLETE_SANITIZED_EVIDENCE_DIR"
            python scripts/phase5/sanitize_evidence.py --source "$EVIDENCE_DIR" --dest "$COMPLETE_SANITIZED_EVIDENCE_DIR" --governing-source-dir "$GITHUB_WORKSPACE/docs/phase5/governing" --repo-root "$GITHUB_WORKSPACE" --expected-candidate-sha "$CANDIDATE_SHA" --expected-validation-sha "$VALIDATION_SHA" --expected-run-id "$GITHUB_RUN_ID" --require-complete
            code=$?
            if [ "$code" -eq 0 ] && [ "$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["COMPLETE_SANITIZED_EVIDENCE_DIR"],"sanitized-manifest.json"))).get("result"))')" = PASS ]; then
              UPLOAD_EVIDENCE_DIR="$COMPLETE_SANITIZED_EVIDENCE_DIR"
              export UPLOAD_EVIDENCE_DIR
              echo "UPLOAD_EVIDENCE_DIR=$UPLOAD_EVIDENCE_DIR" >> "$GITHUB_ENV"
            else
              rm -rf "$PARTIAL_SANITIZED_EVIDENCE_DIR"; mkdir -p "$PARTIAL_SANITIZED_EVIDENCE_DIR"
              python scripts/phase5/sanitize_evidence.py --source "$EVIDENCE_DIR" --dest "$PARTIAL_SANITIZED_EVIDENCE_DIR" --governing-source-dir "$GITHUB_WORKSPACE/docs/phase5/governing" --repo-root "$GITHUB_WORKSPACE" --expected-candidate-sha "$CANDIDATE_SHA" --expected-validation-sha "$VALIDATION_SHA" --expected-run-id "$GITHUB_RUN_ID" --allow-partial
              UPLOAD_EVIDENCE_DIR="$PARTIAL_SANITIZED_EVIDENCE_DIR"
              export UPLOAD_EVIDENCE_DIR
              echo "UPLOAD_EVIDENCE_DIR=$UPLOAD_EVIDENCE_DIR" >> "$GITHUB_ENV"
              exit 1
            fi
          else
            rm -rf "$PARTIAL_SANITIZED_EVIDENCE_DIR"; mkdir -p "$PARTIAL_SANITIZED_EVIDENCE_DIR"
            python scripts/phase5/sanitize_evidence.py --source "$EVIDENCE_DIR" --dest "$PARTIAL_SANITIZED_EVIDENCE_DIR" --governing-source-dir "$GITHUB_WORKSPACE/docs/phase5/governing" --repo-root "$GITHUB_WORKSPACE" --expected-candidate-sha "$CANDIDATE_SHA" --expected-validation-sha "$VALIDATION_SHA" --expected-run-id "$GITHUB_RUN_ID" --allow-partial
            UPLOAD_EVIDENCE_DIR="$PARTIAL_SANITIZED_EVIDENCE_DIR"
            export UPLOAD_EVIDENCE_DIR
            echo "UPLOAD_EVIDENCE_DIR=$UPLOAD_EVIDENCE_DIR" >> "$GITHUB_ENV"
          fi
          python -c 'import json,os,pathlib; from scripts.phase5.sanitize_evidence import reconcile_manifest; result=reconcile_manifest(pathlib.Path(os.environ["UPLOAD_EVIDENCE_DIR"])); print(json.dumps(result,sort_keys=True)); assert result["SANITIZED_LOCAL_ABSOLUTE_PATH_MATCH_COUNT"]==0 and result["SANITIZED_OBVIOUS_SECRET_PATTERN_MATCH_COUNT"]==0'
      # POST_SANITIZE_RECOMPUTE
      - name: POST_SANITIZE_RECOMPUTE
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${UPLOAD_EVIDENCE_DIR:-}" != "$COMPLETE_SANITIZED_EVIDENCE_DIR" ]; then
            echo "POST_SANITIZE_RECOMPUTE=SKIPPED_INCOMPLETE_SANITIZATION"
            exit 0
          fi
          test "$UPLOAD_EVIDENCE_DIR" = "$COMPLETE_SANITIZED_EVIDENCE_DIR"
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts/phase5:$GITHUB_WORKSPACE"
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.phase5.registry import EVIDENCE_PRODUCERS, producer_paths
          root = Path(os.environ["COMPLETE_SANITIZED_EVIDENCE_DIR"])
          missing = []
          zero = []
          for producer in sorted(EVIDENCE_PRODUCERS):
              for kind, path in producer_paths(producer, root).items():
                  if not path.is_file():
                      missing.append(str(path.relative_to(root)))
                  elif path.stat().st_size == 0:
                      zero.append(str(path.relative_to(root)))
          print("POST_SANITIZE_REQUIRED_PRODUCER_MISSING_PATH_COUNT=" + str(len(missing)))
          print("POST_SANITIZE_REQUIRED_PRODUCER_ZERO_BYTE_PATH_COUNT=" + str(len(zero)))
          print("POST_SANITIZE_INPUT_IDENTITY_RAW_NONEMPTY=" + str((root / "input-identity.raw.log").is_file() and (root / "input-identity.raw.log").stat().st_size > 0).lower())
          assert not missing and not zero
          assert (root / "input-identity.raw.log").stat().st_size > 0
          PY
          python scripts/phase5/producer_contract_audit.py --repo-root "$GITHUB_WORKSPACE" --evidence-dir "$COMPLETE_SANITIZED_EVIDENCE_DIR" --output "$RUNNER_TEMP/post-sanitize-producer-contract-audit.json"
          python scripts/phase5/evidence_validate.py --stage FINAL --evidence-dir "$COMPLETE_SANITIZED_EVIDENCE_DIR" --acceptance-result "$COMPLETE_SANITIZED_EVIDENCE_DIR/acceptance-result.json" --output "$RUNNER_TEMP/post-sanitize-primary-validation.json" --expected-candidate-sha "$CANDIDATE_SHA" --expected-validation-sha "$VALIDATION_SHA" --expected-run-id "$GITHUB_RUN_ID"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.phase5.independent_semantic_validate import validate
          root=Path(os.environ["COMPLETE_SANITIZED_EVIDENCE_DIR"])
          result=validate(Path("contracts/amec/phase5/AMEC_PHASE5_ASSERTION_EVIDENCE_SPEC_v2.json"),root/"acceptance-result.json",root,os.environ["CANDIDATE_SHA"],os.environ["VALIDATION_SHA"],os.environ["GITHUB_RUN_ID"])
          Path(os.environ["RUNNER_TEMP"]+"/post-sanitize-second-oracle.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          assert result["result"] == "PASS" and result["check_count"] == 300 and result["false_accept_count"] == 0
          PY
          python - "$COMPLETE_SANITIZED_EVIDENCE_DIR/sanitized-manifest.json" <<'PY'
          import json, os, pathlib
          from scripts.phase5.finalize import derive_summary
          root=pathlib.Path(os.environ["COMPLETE_SANITIZED_EVIDENCE_DIR"]); m=json.load(open(root/"sanitized-manifest.json"))
          assert m["result"]=="PASS" and m["SANITIZED_POST_MANIFEST_RECONCILIATION"]=="PASS"
          s=json.load(open(root/"phase5-final-summary.json")); d=derive_summary(root,os.environ["CANDIDATE_SHA"],os.environ["VALIDATION_SHA"],os.environ["GITHUB_RUN_ID"])
          assert sum(s.get(k)!=v for k,v in d.items()) == 0
          print("FINAL_VALIDATION_FROM_SANITIZED_BYTES=PASS")
          PY
      # UPLOAD
      - name: UPLOAD sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProposalOps_Phase5_R3R1R6R2R2_Sanitized_Evidence
          path: ${{ env.UPLOAD_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup disposable SQL Server and application processes
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${SQL_CONTAINER:-}" ]; then docker rm -f "$SQL_CONTAINER" >/dev/null 2>&1 || true; fi
          if [ -f "$RUNNER_TEMP/api.pid" ]; then kill "$(cat "$RUNNER_TEMP/api.pid")" >/dev/null 2>&1 || true; fi
          if [ -f "$RUNNER_TEMP/frontend.pid" ]; then kill "$(cat "$RUNNER_TEMP/frontend.pid")" >/dev/null 2>&1 || true; fi
