          import json, os
          from pathlib import Path
          workflow=(Path(os.environ["RUNNER_TEMP"])/"proposalops-executing-workflow.yml").read_text(encoding="utf-8")
          def validate(candidate):
              self_start=candidate.index("      - name: Run validator adversarial mutation self-tests")
              next_step="      - name: Create four isolated database roles"
              self_end=candidate.index(next_step,candidate.index(next_step,self_start)+1)
              production=candidate[:self_start]+candidate[self_end:]
              spaced_target='Path(os.environ['+'"RUNNER_TEMP"'+']) / "proposalops-executing-workflow.yml"'
              compact_target='Path(os.environ['+'"RUNNER_TEMP"'+'])/"proposalops-executing-workflow.yml"'
              assert candidate.count(spaced_target)+candidate.count(compact_target)==2
              assert production.count('Path(os.environ['+'"GITHUB_WORKSPACE"'+']) / ".github" / "workflows" / "storage-contract.yml"')==0
              forbidden=("azure/"+"login","az"+" login","az"+" rest","az"+" sql","az"+" containerapp")
              assert all(token not in production for token in forbidden)
              required=("python -m pip install -r backend/requirements.txt","python -m pip check","python -m alembic --version","def semantic_identity(surface, item):","def identity_map(surface, items):","for identity in sorted(set(expected) | set(actual)):","if expected.get(identity) != actual.get(identity):",'row.pop("name", None)','export CANDIDATE_SHA="$SOURCE_SHA"','export VALIDATION_SHA="$GITHUB_SHA"',"      - name: Final truthful qualification assertion","sqlserver_readiness_poll_attempts","workflow_rerun_count","semantic_test_automatic_retry_count","mutation_retry_count","TABLES = [\"neg_extra\",\"neg_child\"","NEG-012","UNIQUE (unique_probe, another_probe)","NEG-018","WHERE filtered_index_probe >= 0",'release["PRETTY_NAME"]',"required_item_tests","unique_constraint_item_comparator_regression","semantic_identity_collision_test_fail","FINAL_QUALIFICATION_DEPENDENCY_BINDING","FINAL_QUALIFICATION_STATIC_SAFETY_BINDING","FINAL_QUALIFICATION_ITEM_TEST_BINDING","FINAL_QUALIFICATION_ADVERSARIAL_BINDING","FINAL_QUALIFICATION_RUNTIME_IDENTITY_BINDING")
              assert all(item in production for item in required)
              assert '"semantic_identity": surface' not in production
              assert '"REFERENCE_VERIFIER_CANDIDATE_QUALIFIED": True' not in production
              assert 'summary["REFERENCE_VERIFIER_CANDIDATE_QUALIFIED"] = True' not in production
              assert '"semantic_test_automatic_retry_count": 0,' in production
              assert production.count('REFERENCE_VERIFIER_CANDIDATE_QUALIFIED') >= 2
          def replace_last(text, old, new):
              index=text.rfind(old)
              assert index >= 0
              return text[:index]+new+text[index+len(old):]
          validate(workflow)
          variants=[
              ("BROKEN_DEPENDENCY", workflow.replace("python -m pip install -r backend/requirements.txt","python -m pip install pyodbc",1)),
              ("UNCONDITIONAL_QUALIFICATION", workflow.replace('summary["REFERENCE_VERIFIER_CANDIDATE_QUALIFIED"]=bool(summary.get("PRE_CLEANUP_QUALIFICATION") is True and cleanup_ok)','summary["REFERENCE_VERIFIER_CANDIDATE_QUALIFIED"] = True')),
              ("SYSTEM_NAME_LEAK", workflow.replace('supplied_name = row.pop("name", None)','supplied_name = row.get("name")')),
              ("NEGATIVE_RESET_LEAK", workflow.replace('TABLES = ["neg_extra",','TABLES = ["neg_child",')),
              ("NEG012_NOOP", replace_last(workflow,'UNIQUE (unique_probe, another_probe)','UNIQUE (unique_probe)')),
              ("NEG018_FILTER_NOOP", replace_last(workflow,'WHERE filtered_index_probe >= 0','WHERE filtered_index_probe IS NOT NULL')),
              ("COARSE_COMPARATOR", workflow.replace('for identity in sorted(set(expected) | set(actual)):', 'for identity in SURFACES:',1)),
              ("MISSING_ACCEPTED_PROVENANCE", workflow.replace('export CANDIDATE_SHA="$SOURCE_SHA"\n          export VALIDATION_SHA="$GITHUB_SHA"','',1)),
              ("MISSING_FINAL_ASSERT", workflow.replace('      - name: Final truthful qualification assertion\n        if: always()','      - name: Removed assertion\n        if: always()')),
              ("RETRY_MISREPORT", workflow.replace('"semantic_test_automatic_retry_count": 0,','"automatic_runtime_retry_count": 0,')),
              ("MISSING_RUNTIME_EVIDENCE", workflow.replace('"runner_os": release["PRETTY_NAME"]','"runner_os": "Ubuntu_22_04"',1)),
              ("WRONG_WORKFLOW_SELF_INSPECTION_TARGET", workflow.replace('Path(os.environ['+'"RUNNER_TEMP"'+']) / '+ '"proposalops-executing-workflow.yml"','Path(os.environ['+'"GITHUB_WORKSPACE"'+']) / '+ '".github" / "workflows" / "storage-contract.yml"',1)),
              ("EXECUTING_WORKFLOW_AZURE_TOKEN", workflow.replace('test "$(git rev-parse HEAD)" = "$GITHUB_SHA"','test "$(git rev-parse HEAD)" = "$GITHUB_SHA"\n          echo "' + ("az" + " login") + '" # mutation',1)),
          ]
          results=[]
          for name, candidate in variants:
              try:
                  validate(candidate)
              except AssertionError:
                  results.append({"variant":name,"rejected":True,"result":"PASS"})
              else:
                  results.append({"variant":name,"rejected":False,"result":"FAIL"})
          assert len(results)==13 and all(item["rejected"] for item in results)
          json.dump({
