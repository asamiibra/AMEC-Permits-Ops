      - name: Build isolated negative-control fixture and run NEG-001 through NEG-018
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/proposalops_negative_tests.py" <<'PY'
          import json, os, pyodbc, subprocess
          from pathlib import Path
          TESTS = [
              ("NEG-001","missing_table","tables","DROP TABLE dbo.neg_missing_table"),
              ("NEG-002","extra_table","tables","CREATE TABLE dbo.neg_extra (id int NOT NULL PRIMARY KEY)"),
              ("NEG-003","missing_column","columns","ALTER TABLE dbo.neg_child DROP COLUMN missing_column_probe"),
              ("NEG-004","length_change","columns","ALTER TABLE dbo.neg_child ALTER COLUMN length_probe varchar(32) NULL"),
              ("NEG-005","unicode_to_nonunicode","columns","ALTER TABLE dbo.neg_child ALTER COLUMN unicode_probe varchar(80) NOT NULL"),
              ("NEG-006","nullability_change","columns","ALTER TABLE dbo.neg_child ALTER COLUMN nullability_probe nvarchar(120) NOT NULL"),
              ("NEG-007","precision_change","columns","ALTER TABLE dbo.neg_parent ALTER COLUMN decimal_probe decimal(19,5) NOT NULL"),
              ("NEG-008","scale_change","columns","ALTER TABLE dbo.neg_parent ALTER COLUMN decimal_probe decimal(18,4) NOT NULL"),
              ("NEG-009","identity_change","columns","DROP TABLE dbo.neg_identity_probe; CREATE TABLE dbo.neg_identity_probe (id int IDENTITY(1,1) NOT NULL CONSTRAINT pk_neg_identity_probe PRIMARY KEY, payload int NOT NULL)"),
              ("NEG-010","default_semantic_change","defaults","ALTER TABLE dbo.neg_child DROP CONSTRAINT df_neg_child_default; ALTER TABLE dbo.neg_child ADD CONSTRAINT df_neg_child_default DEFAULT (1) FOR default_probe"),
              ("NEG-011","pk_column_or_order_change","primary_keys","ALTER TABLE dbo.neg_pk_probe DROP CONSTRAINT pk_neg_pk_probe; ALTER TABLE dbo.neg_pk_probe ADD CONSTRAINT pk_neg_pk_probe PRIMARY KEY (b, a)"),
              ("NEG-012","unique_constraint_change","unique_constraints","ALTER TABLE dbo.neg_unique_probe DROP CONSTRAINT uq_neg_unique_probe; ALTER TABLE dbo.neg_unique_probe ADD CONSTRAINT uq_neg_unique_probe UNIQUE (unique_probe, another_probe)"),
              ("NEG-013","fk_target_change","foreign_keys","ALTER TABLE dbo.neg_fk_probe DROP CONSTRAINT fk_neg_fk_probe; ALTER TABLE dbo.neg_fk_probe ADD CONSTRAINT fk_neg_fk_probe FOREIGN KEY (ref_id) REFERENCES dbo.neg_parent(id)"),
              ("NEG-014","fk_action_change","foreign_keys","ALTER TABLE dbo.neg_fk_probe DROP CONSTRAINT fk_neg_fk_probe; ALTER TABLE dbo.neg_fk_probe ADD CONSTRAINT fk_neg_fk_probe FOREIGN KEY (ref_id) REFERENCES dbo.neg_fk_target(id) ON DELETE CASCADE"),
              ("NEG-015","check_predicate_change","check_constraints","ALTER TABLE dbo.neg_child DROP CONSTRAINT ck_neg_child_check; ALTER TABLE dbo.neg_child ADD CONSTRAINT ck_neg_child_check CHECK (check_probe >= 0)"),
              ("NEG-016","index_column_or_order_change","indexes","DROP INDEX ix_neg_child_index ON dbo.neg_child; CREATE INDEX ix_neg_child_index ON dbo.neg_child (another_probe, index_probe)"),
              ("NEG-017","index_uniqueness_change","indexes","DROP INDEX ix_neg_child_unique ON dbo.neg_child; CREATE UNIQUE INDEX ix_neg_child_unique ON dbo.neg_child (index_probe)"),
              ("NEG-018","filtered_index_predicate_change","indexes","DROP INDEX ix_neg_child_filtered ON dbo.neg_child; CREATE INDEX ix_neg_child_filtered ON dbo.neg_child (filtered_index_probe) INCLUDE (another_probe) WHERE filtered_index_probe >= 0"),
          ]
          assert len(TESTS) == 18 and len({x[0] for x in TESTS}) == 18
          ROOT = Path(os.environ["RUNNER_TEMP"])
          collector = ROOT / "proposalops_catalog_capture.py"
          comparator = ROOT / "proposalops_catalog_compare.py"
          cs = "DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=" + os.environ["SQLSERVER_PASSWORD"] + ";DATABASE=" + os.environ["NEGATIVE_CONTROL_DB"] + ";Encrypt=yes;TrustServerCertificate=yes"
          BASELINE_DDL = """
          CREATE TABLE dbo.neg_parent (id int IDENTITY(1,1) NOT NULL CONSTRAINT pk_neg_parent PRIMARY KEY, title nvarchar(80) NOT NULL, code varchar(max) NULL, wide nvarchar(max) NULL, raw varbinary(max) NULL, decimal_probe decimal(18,5) NOT NULL CONSTRAINT df_neg_parent_decimal DEFAULT (0), parent_key varchar(64) NOT NULL, CONSTRAINT uq_neg_parent UNIQUE (parent_key));
          CREATE TABLE dbo.neg_child (child_id int NOT NULL CONSTRAINT pk_neg_child PRIMARY KEY, parent_id int NOT NULL, missing_column_probe int NULL, length_probe varchar(64) NULL, unicode_probe nvarchar(80) NOT NULL, nullability_probe nvarchar(120) NULL, default_probe int NULL CONSTRAINT df_neg_child_default DEFAULT (0), unique_probe varchar(64) NOT NULL, another_probe varchar(64) NOT NULL, check_probe int NOT NULL CONSTRAINT ck_neg_child_check CHECK (check_probe > 0), index_probe nvarchar(120) NULL, filtered_index_probe int NULL, CONSTRAINT uq_neg_child_unique UNIQUE (unique_probe), CONSTRAINT fk_neg_child_parent FOREIGN KEY (parent_id) REFERENCES dbo.neg_parent(id));
          CREATE TABLE dbo.neg_missing_table (id int NOT NULL CONSTRAINT pk_neg_missing PRIMARY KEY);
          CREATE TABLE dbo.neg_identity_probe (id int NOT NULL CONSTRAINT pk_neg_identity_probe PRIMARY KEY, payload int NOT NULL);
          CREATE TABLE dbo.neg_pk_probe (a int NOT NULL, b int NOT NULL, CONSTRAINT pk_neg_pk_probe PRIMARY KEY (a,b));
          CREATE TABLE dbo.neg_unique_probe (unique_probe varchar(64) NOT NULL, another_probe varchar(64) NOT NULL, CONSTRAINT uq_neg_unique_probe UNIQUE (unique_probe));
          CREATE TABLE dbo.neg_fk_target (id int NOT NULL CONSTRAINT pk_neg_fk_target PRIMARY KEY);
          CREATE TABLE dbo.neg_fk_probe (id int NOT NULL CONSTRAINT pk_neg_fk_probe PRIMARY KEY, ref_id int NOT NULL, CONSTRAINT fk_neg_fk_probe FOREIGN KEY (ref_id) REFERENCES dbo.neg_fk_target(id));
          CREATE INDEX ix_neg_child_index ON dbo.neg_child (index_probe, another_probe);
          CREATE INDEX ix_neg_child_unique ON dbo.neg_child (index_probe);
          CREATE INDEX ix_neg_child_filtered ON dbo.neg_child (filtered_index_probe) INCLUDE (another_probe) WHERE filtered_index_probe IS NOT NULL;
          """
          TABLES = ["neg_extra","neg_child","neg_missing_table","neg_identity_probe","neg_pk_probe","neg_unique_probe","neg_fk_probe","neg_fk_target","neg_parent"]
          def connect():
              return pyodbc.connect(cs, autocommit=True)
          def reset(c):
              for table in TABLES:
                  c.execute("IF OBJECT_ID(N'dbo."+table+"',N'U') IS NOT NULL DROP TABLE dbo."+table)
              for statement in BASELINE_DDL.split(";"):
                  if statement.strip(): c.execute(statement)
          def capture(path):
              subprocess.run(["python", str(collector), "--connection", cs, "--out", str(path)], check=True)
          def compare(left, right, out):
              subprocess.run(["python", str(comparator), str(left), str(right), str(out)], check=True)
          def column_dependencies(c, table, column):
              queries = [
                  "SELECT COUNT(*) FROM sys.default_constraints AS d JOIN sys.columns AS col ON col.object_id=d.parent_object_id AND col.column_id=d.parent_column_id JOIN sys.tables AS t ON t.object_id=col.object_id WHERE t.name=? AND col.name=?",
                  "SELECT COUNT(*) FROM sys.index_columns AS ic JOIN sys.tables AS t ON t.object_id=ic.object_id JOIN sys.columns AS col ON col.object_id=ic.object_id AND col.column_id=ic.column_id WHERE t.name=? AND col.name=?",
                  "SELECT COUNT(*) FROM sys.foreign_key_columns AS fc JOIN sys.tables AS t ON t.object_id=fc.parent_object_id JOIN sys.columns AS col ON col.object_id=fc.parent_object_id AND col.column_id=fc.parent_column_id WHERE t.name=? AND col.name=?",
              ]
              return sum(int(c.execute(q, table, column).fetchone()[0]) for q in queries)
          results = []
          cross_contamination = 0
          with connect() as c:
              reset(c)
              frozen = ROOT / "negative-baseline-frozen.json"
              capture(frozen)
              frozen_hash = json.load(open(frozen))["physical_sha256"]
              for test_id, name, surface, mutation in TESTS:
                  reset(c)
                  baseline = ROOT / (test_id + "-baseline.json")
                  mutated = ROOT / (test_id + "-mutated.json")
                  result = ROOT / (test_id + "-result.json")
                  capture(baseline)
                  baseline_hash = json.load(open(baseline))["physical_sha256"]
                  if baseline_hash != frozen_hash:
                      cross_contamination += 1
                      raise AssertionError("NEGATIVE_TEST_CROSS_CONTAMINATION")
                  if test_id == "NEG-003":
                      dep_count = column_dependencies(c, "neg_child", "missing_column_probe")
                      assert dep_count == 0
                  c.execute(mutation)
                  capture(mutated)
                  compare(baseline, mutated, result)
                  mismatch = json.load(open(result))["mismatches"]
                  assert any(item["surface"] == surface and item["semantic_identity"] != surface and "expected" in item and "actual" in item for item in mismatch)
                  if test_id == "NEG-009":
                      assert any(item["surface"] == "columns" and item["semantic_identity"].endswith("/id") and item["expected"].get("is_identity") != item["actual"].get("is_identity") for item in mismatch)
                  if test_id == "NEG-012":
                      assert json.load(open(baseline))["physical"]["unique_constraints"] != json.load(open(mutated))["physical"]["unique_constraints"]
                  if test_id == "NEG-018":
                      base_index = next(x for x in json.load(open(baseline))["physical"]["indexes"] if x["name"] == "ix_neg_child_filtered")
                      changed_index = next(x for x in json.load(open(mutated))["physical"]["indexes"] if x["name"] == "ix_neg_child_filtered")
                      assert base_index["filter_definition"] != changed_index["filter_definition"]
                      assert {k:base_index[k] for k in ("ordered_key_columns","descending_flags","included_columns")} == {k:changed_index[k] for k in ("ordered_key_columns","descending_flags","included_columns")}
                  results.append({"id": test_id, "name": name, "surface": surface, "result": "PASS", "mismatch_count": len(mismatch)})
          json.dump({"tests": results, "count": len(results), "pass": len(results), "fail": 0, "cross_contamination_count": cross_contamination, "negative_baseline_physical_sha256": frozen_hash, "neg003_dependent_object_count": 0, "neg012_semantic_change": "PASS", "neg018_filter_predicate_change": "PASS", "neg018_nonfilter_semantic_change_count": 0}, open(os.path.join(os.environ["RUNNER_TEMP"], "proposalops-reference-evidence", "negative-tests.json"), "w"), sort_keys=True, indent=2)
          PY
          python "$RUNNER_TEMP/proposalops_negative_tests.py"

