          ok = os.environ.get("CLEANUP_STATUS","1") == "0"
          root=os.path.join(os.environ["RUNNER_TEMP"], "proposalops-reference-evidence")
          json.dump({"reference_db_1": ok, "reference_db_2": ok, "acceptance_db": ok, "negative_control_db": ok, "sqlserver_container": ok, "sqlserver_volume": ok}, open(os.path.join(root, "cleanup-status.json"), "w"), sort_keys=True)
          PY
          exit 0

      - name: Finalize post-cleanup evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"proposalops-reference-evidence"
          summary=json.load(open(root/"reference-qualification-summary-pre-cleanup.json")) if (root/"reference-qualification-summary-pre-cleanup.json").exists() else {}
          cleanup=json.load(open(root/"cleanup-status.json")) if (root/"cleanup-status.json").exists() else {}
          for key in ("reference_db_1","reference_db_2","acceptance_db","negative_control_db","sqlserver_container","sqlserver_volume"):
              summary[key.upper()+"_CLEANUP"]=cleanup.get(key,False)
          cleanup_ok=all(summary.get(key.upper()+"_CLEANUP") is True for key in ("reference_db_1","reference_db_2","acceptance_db","negative_control_db","sqlserver_container","sqlserver_volume"))
          summary["REFERENCE_VERIFIER_CANDIDATE_QUALIFIED"]=bool(summary.get("PRE_CLEANUP_QUALIFICATION") is True and cleanup_ok)
          json.dump(summary, open(root/"reference-qualification-summary.json","w"), sort_keys=True, indent=2)
          PY

      - name: Final truthful qualification assertion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"proposalops-reference-evidence"
          summary=json.load(open(root/"reference-qualification-summary.json"))
          assert summary["REFERENCE_VERIFIER_CANDIDATE_QUALIFIED"] is True
          assert all(summary.get(key.upper()+"_CLEANUP") is True for key in ("reference_db_1","reference_db_2","acceptance_db","negative_control_db","sqlserver_container","sqlserver_volume"))
          PY

      - name: Upload disposable qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposalops-sqlserver-reference-qualification-v3-1-${{ github.run_id }}
          path: ${{ runner.temp }}/proposalops-reference-evidence
          if-no-files-found: error
          retention-days: 7
