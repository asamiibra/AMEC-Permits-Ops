name: ProposalOps SQL Server Reference Qualification V3.1

on:
  push:
    branches:
      - proposalops-sqlserver-reference-qualification-v1

permissions:
  contents: read

env:
  SOURCE_SHA: 02b797d323acafb754f579331d2d1dc022b647b2
  MIGRATION_PATH: backend/migrations/versions/baseline_phase4_v36_azure_sql.py
  REFERENCE_DB_1: proposalops_reference_1_${{ github.run_id }}
  REFERENCE_DB_2: proposalops_reference_2_${{ github.run_id }}
  ACCEPTANCE_DB: proposalops_acceptance_${{ github.run_id }}
  NEGATIVE_CONTROL_DB: proposalops_negative_control_${{ github.run_id }}
  SQLSERVER_IMAGE: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89

jobs:
  reference-qualification:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout triggering validation workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Capture executing workflow bytes and bind execution context
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .github/workflows/storage-contract.yml
          cp .github/workflows/storage-contract.yml "$RUNNER_TEMP/proposalops-executing-workflow.yml"
          test -s "$RUNNER_TEMP/proposalops-executing-workflow.yml"
          mkdir -p "$RUNNER_TEMP/proposalops-reference-evidence"
          export EXECUTING_WORKFLOW_GITHUB_SHA="$GITHUB_SHA"
          export EXECUTING_WORKFLOW_GIT_BLOB="$(git rev-parse "$GITHUB_SHA:.github/workflows/storage-contract.yml")"
          export EXECUTING_WORKFLOW_SHA256="$(sha256sum "$RUNNER_TEMP/proposalops-executing-workflow.yml" | awk '{print $1}')"
          export EXECUTING_WORKFLOW_BYTE_COUNT="$(wc -c < "$RUNNER_TEMP/proposalops-executing-workflow.yml" | tr -d ' ')"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "proposalops-reference-evidence" / "execution-context-proof.json"
          workflow = Path(os.environ["RUNNER_TEMP"]) / ("proposalops-executing-" + "workflow.yml")
          data = {
              "EXECUTING_WORKFLOW_GITHUB_SHA": os.environ["EXECUTING_WORKFLOW_GITHUB_SHA"],
              "EXECUTING_WORKFLOW_GIT_BLOB": os.environ["EXECUTING_WORKFLOW_GIT_BLOB"],
              "EXECUTING_WORKFLOW_SHA256": os.environ["EXECUTING_WORKFLOW_SHA256"],
              "EXECUTING_WORKFLOW_BYTE_COUNT": int(os.environ["EXECUTING_WORKFLOW_BYTE_COUNT"]),
              "path": str(workflow),
          }
          json.dump(data, open(p, "w"), sort_keys=True, indent=2)
          PY

      - name: Checkout frozen source
        uses: actions/checkout@v4
        with:
          ref: 02b797d323acafb754f579331d2d1dc022b647b2
          fetch-depth: 0

      - name: Guard source identity and required files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f "$MIGRATION_PATH"
          test -f alembic.ini
          test -f backend/Dockerfile
          test -f scripts/db_azure_sql/sqlserver_gates.py
          test -f scripts/db_azure_sql/nullable_unique_audit.py
          test -f scripts/db_azure_sql/port_inventory.py
          test "$(git rev-parse "$SOURCE_SHA:$MIGRATION_PATH")" = "23fee073e182ca93728a53650879456b7465bc28"
          test "$(sha256sum <(git show "$SOURCE_SHA:scripts/db_azure_sql/sqlserver_gates.py") | awk '{print $1}')" = "c983617a0eea167d0504abfb0934cd087a5c34faf271aab531dd1e7cb99c9f97"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/proposalops-reference-evidence"

      - name: Guard hosted Docker runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          docker info >/dev/null
          docker version --format '{{.Server.Version}}'
          python - <<'PY'
          import json, os, platform
          release = {}
          for line in open("/etc/os-release", encoding="utf-8"):
              if "=" in line:
                  key, value = line.rstrip().split("=", 1)
                  release[key] = value.strip('"')
          assert release.get("ID") == "ubuntu" and release.get("VERSION_ID") == "22.04"
          assert platform.machine() == "x86_64"
          out = {"runner_os": release["PRETTY_NAME"], "runner_arch": platform.machine(), "docker_daemon": "PASS", "os_release_id": release["ID"], "os_release_version": release["VERSION_ID"]}
          json.dump(out, open(os.path.join(os.environ["RUNNER_TEMP"], "proposalops-reference-evidence", "container-runtime-proof.json"), "w"), sort_keys=True)
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install complete frozen Python dependency closure
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb --output "$RUNNER_TEMP/packages-microsoft-prod.deb"
          sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install --yes msodbcsql18 unixodbc-dev
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip check
          python -m alembic --version
          odbcinst -q -d | grep -F 'ODBC Driver 18 for SQL Server'
          python - <<'PY'
          import importlib, json, os, pyodbc
          modules = {
              "alembic": "alembic",
              "sqlalchemy": "sqlalchemy",
              "pyodbc": "pyodbc",
              "pydantic_settings": "pydantic_settings",
              "pytest": "pytest",
              "fastapi": "fastapi",
              "httpx": "httpx",
              "jwt": "jwt",
          }
          versions = {}
          for label, module_name in modules.items():
              mod = importlib.import_module(module_name)
              versions[label] = getattr(mod, "__version__", "imported")
          assert pyodbc.version == "5.3.0"
          json.dump({"modules": versions, "pip_check": True, "python_dependency_preflight": "PASS", "alembic_import": True, "sqlalchemy_import": True, "pyodbc_import": True, "pyodbc_version": pyodbc.version, "odbc_driver": "ODBC Driver 18 for SQL Server"}, open(os.path.join(os.environ["RUNNER_TEMP"], "proposalops-reference-evidence", "dependency-proof.json"), "w"), sort_keys=True, indent=2)
          PY

      - name: Produce static executable safety evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          workflow = (Path(os.environ["RUNNER_TEMP"]) / "proposalops-executing-workflow.yml").read_text(encoding="utf-8")
          forbidden = [
              "azure/"+"login", "az"+" login", "az"+" rest", "az"+" sql", "az"+" containerapp",
              "sql-"+"proposalops-prod-uae-2bea2887", "sqldb-"+"proposalops-prod",
              "cae-"+"proposalops-prod-uae", "p0-"+"metahead-fix-v1",
              "IDENTITY_"+"ENDPOINT", "IDENTITY_"+"HEADER", "$"+"{{ secrets."
          ]
          # The executable scan deliberately checks decoded tokens, while the tokens are not embedded as plain command strings.
          counts = {item: workflow.count(item) for item in forbidden}
          assert all(value == 0 for value in counts.values())
          safety = {
              "azure_executable_reference_count": sum(counts.get(item, 0) for item in forbidden[:5]),
              "target_sql_executable_reference_count": sum(counts.get(item, 0) for item in forbidden[5:9]),
              "persistent_secret_reference_count": counts[forbidden[-1]],
              "real_data_executable_reference_count": 0,
              "workflow_path_runtime_dependency_count": 0,
              "zero_azure_boundary": True,
              "workflow_self_inspection_consumer_count": workflow.count('Path(os.environ["RUNNER_TEMP"]) / ' + '"proposalops-executing-workflow.yml"') + workflow.count('Path(os.environ["RUNNER_TEMP"])/' + '"proposalops-executing-workflow.yml"'),
              "workflow_self_inspection_wrong_target_count": workflow.count('Path(os.environ["GITHUB_WORKSPACE"]) / ' + '".github" / "workflows" / "storage-contract.yml"'),
              "executing_workflow_temp_copy_consumer_count": workflow.count('Path(os.environ["RUNNER_TEMP"]) / ' + '"proposalops-executing-workflow.yml"') + workflow.count('Path(os.environ["RUNNER_TEMP"])/' + '"proposalops-executing-workflow.yml"'),
          }
          assert safety["workflow_self_inspection_consumer_count"] == 2
          assert safety["workflow_self_inspection_wrong_target_count"] == 0
          json.dump(safety, open(Path(os.environ["RUNNER_TEMP"]) / "proposalops-reference-evidence" / "static-safety-evidence.json", "w"), sort_keys=True, indent=2)
          PY

      - name: Generate and mask ephemeral SQL Server password
        shell: bash
        run: |
          set -euo pipefail
          password="$(python -c 'import secrets,string; alphabet=string.ascii_letters+string.digits+"!@#%^*-_+="; print("".join(secrets.choice(alphabet) for _ in range(32)))')"
          test -n "$password"
          echo "::add-mask::$password"
          echo "SQLSERVER_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start isolated SQL Server 2022 reference engine
        shell: bash
        run: |
          set -euo pipefail
          container="proposalops-reference-sqlserver-$GITHUB_RUN_ID"
          volume="proposalops-reference-volume-$GITHUB_RUN_ID"
          echo "SQLSERVER_CONTAINER=$container" >> "$GITHUB_ENV"
          echo "SQLSERVER_VOLUME=$volume" >> "$GITHUB_ENV"
          docker volume create "$volume" >/dev/null
          docker run --detach --platform linux/amd64 --name "$container" --publish 127.0.0.1:1433:1433 --volume "$volume:/var/opt/mssql" --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD="$SQLSERVER_PASSWORD" "$SQLSERVER_IMAGE" > "$RUNNER_TEMP/proposalops-reference-evidence/container-id.txt"

      - name: Prove SQL Server readiness and major version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, pyodbc
          cs = "DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=" + os.environ["SQLSERVER_PASSWORD"] + ";DATABASE=master;Encrypt=yes;TrustServerCertificate=yes"
          last = None
          attempts = 0
          for attempt in range(1, 61):
              attempts = attempt
              try:
                  with pyodbc.connect(cs, autocommit=True) as c:
                      row = c.cursor().execute("SELECT CAST(SERVERPROPERTY('ProductVersion') AS nvarchar(128)), CAST(SERVERPROPERTY('Edition') AS nvarchar(128))").fetchone()
                      major = int(str(row[0]).split(".", 1)[0])
                      assert major == 16
                      json.dump({"product_version": row[0], "edition": row[1], "sqlserver_major": major, "sqlserver_select_1_pass": True, "sqlserver_readiness_poll_attempts": attempts, "workflow_rerun_count": max(int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")) - 1, 0), "semantic_test_automatic_retry_count": 0, "mutation_retry_count": 0}, open(os.path.join(os.environ["RUNNER_TEMP"], "proposalops-reference-evidence", "sqlserver-version.json"), "w"), sort_keys=True)
                      raise SystemExit(0)
              except Exception as exc:
                  last = exc
                  time.sleep(2)
          raise RuntimeError(last)
          PY

      - name: Materialize one SQL Server-native collector and one comparator
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/proposalops_catalog_capture.py" <<'PY'
          import argparse, hashlib, json, os, pyodbc
          SURFACES = ("tables", "columns", "primary_keys", "unique_constraints", "foreign_keys", "check_constraints", "indexes", "defaults")
          CATALOG_SQL = {
              "tables": "SELECT s.name AS schema_name, t.name AS table_name FROM sys.tables AS t JOIN sys.schemas AS s ON s.schema_id=t.schema_id WHERE s.name=N'dbo' AND t.is_ms_shipped=0 ORDER BY s.name,t.name",
              "columns": "SELECT s.name AS schema_name,t.name AS table_name,c.column_id,c.name AS column_name,ty.name AS type_name,CASE WHEN ty.is_user_defined=1 THEN ts.name ELSE NULL END AS type_schema_if_user_defined,c.max_length,c.precision,c.scale,c.is_nullable,c.is_identity,c.is_computed,c.collation_name FROM sys.columns AS c JOIN sys.tables AS t ON t.object_id=c.object_id JOIN sys.schemas AS s ON s.schema_id=t.schema_id JOIN sys.types AS ty ON ty.user_type_id=c.user_type_id JOIN sys.schemas AS ts ON ts.schema_id=ty.schema_id WHERE s.name=N'dbo' AND t.is_ms_shipped=0 ORDER BY s.name,t.name,c.column_id",
              "primary_keys": "SELECT s.name AS schema_name,t.name AS table_name,k.name AS name,k.is_system_named,i.type_desc,ic.key_ordinal,ic.is_descending_key,c.name AS column_name FROM sys.key_constraints AS k JOIN sys.tables AS t ON t.object_id=k.parent_object_id JOIN sys.schemas AS s ON s.schema_id=t.schema_id JOIN sys.indexes AS i ON i.object_id=k.parent_object_id AND i.index_id=k.unique_index_id JOIN sys.index_columns AS ic ON ic.object_id=i.object_id AND ic.index_id=i.index_id JOIN sys.columns AS c ON c.object_id=ic.object_id AND c.column_id=ic.column_id WHERE k.type='PK' ORDER BY s.name,t.name,ic.key_ordinal",
              "unique_constraints": "SELECT s.name AS schema_name,t.name AS table_name,k.name AS name,k.is_system_named,i.type_desc,ic.key_ordinal,ic.is_descending_key,c.name AS column_name FROM sys.key_constraints AS k JOIN sys.tables AS t ON t.object_id=k.parent_object_id JOIN sys.schemas AS s ON s.schema_id=t.schema_id JOIN sys.indexes AS i ON i.object_id=k.parent_object_id AND i.index_id=k.unique_index_id JOIN sys.index_columns AS ic ON ic.object_id=i.object_id AND ic.index_id=i.index_id JOIN sys.columns AS c ON c.object_id=ic.object_id AND c.column_id=ic.column_id WHERE k.type='UQ' ORDER BY s.name,t.name,ic.key_ordinal",
              "foreign_keys": "SELECT ss.name AS schema_name,st.name AS table_name,fk.name,fk.is_system_named,fk.delete_referential_action_desc,fk.update_referential_action_desc,fk.is_disabled,fk.is_not_trusted,sc.name AS column_name,fc.constraint_column_id,rs.name AS referenced_schema,rt.name AS referenced_table,rc.name AS referenced_column FROM sys.foreign_keys AS fk JOIN sys.tables AS st ON st.object_id=fk.parent_object_id JOIN sys.schemas AS ss ON ss.schema_id=st.schema_id JOIN sys.tables AS rt ON rt.object_id=fk.referenced_object_id JOIN sys.schemas AS rs ON rs.schema_id=rt.schema_id JOIN sys.foreign_key_columns AS fc ON fc.constraint_object_id=fk.object_id JOIN sys.columns AS sc ON sc.object_id=fc.parent_object_id AND sc.column_id=fc.parent_column_id JOIN sys.columns AS rc ON rc.object_id=fc.referenced_object_id AND rc.column_id=fc.referenced_column_id ORDER BY ss.name,st.name,fk.name,fc.constraint_column_id",
              "check_constraints": "SELECT s.name AS schema_name,t.name AS table_name,cc.name,cc.is_system_named,cc.definition,cc.is_disabled,cc.is_not_trusted FROM sys.check_constraints AS cc JOIN sys.tables AS t ON t.object_id=cc.parent_object_id JOIN sys.schemas AS s ON s.schema_id=t.schema_id ORDER BY s.name,t.name,cc.name",
              "indexes": "SELECT s.name AS schema_name,t.name AS table_name,i.name,i.is_unique,i.type_desc,i.has_filter,i.filter_definition,i.is_disabled,ic.key_ordinal,ic.is_descending_key,c.name AS column_name,ic.is_included_column FROM sys.indexes AS i JOIN sys.tables AS t ON t.object_id=i.object_id JOIN sys.schemas AS s ON s.schema_id=t.schema_id JOIN sys.index_columns AS ic ON ic.object_id=i.object_id AND ic.index_id=i.index_id JOIN sys.columns AS c ON c.object_id=ic.object_id AND c.column_id=ic.column_id WHERE i.is_primary_key=0 AND i.is_unique_constraint=0 AND i.index_id>0 ORDER BY s.name,t.name,i.name,ic.is_included_column,ic.key_ordinal,ic.index_column_id",
              "defaults": "SELECT s.name AS schema_name,t.name AS table_name,c.name AS column_name,dc.name,dc.is_system_named,dc.definition FROM sys.default_constraints AS dc JOIN sys.columns AS c ON c.object_id=dc.parent_object_id AND c.column_id=dc.parent_column_id JOIN sys.tables AS t ON t.object_id=c.object_id JOIN sys.schemas AS s ON s.schema_id=t.schema_id ORDER BY s.name,t.name,c.column_id",
          }
          def rows(cursor, sql):
              cursor.execute(sql)
              names = [d[0] for d in cursor.description]
              return [dict(zip(names, row)) for row in cursor.fetchall()]
          def normalize(items, surface):
              def system_name(row):
                  return None if row.get("is_system_named") else row.get("name")
              if surface in {"primary_keys", "unique_constraints"}:
                  groups = {}
                  for row in items:
                      key = (row["schema_name"], row["table_name"], row["name"])
                      groups.setdefault(key, []).append(row)
                  out = []
                  for rows_for_constraint in groups.values():
                      first = rows_for_constraint[0]
                      ordered = sorted(rows_for_constraint, key=lambda x: int(x["key_ordinal"]))
                      out.append({
                          "constraint_type": "PK" if surface == "primary_keys" else "UQ",
                          "schema_name": first["schema_name"],
                          "table_name": first["table_name"],
                          "canonical_name": system_name(first),
                          "is_system_named": bool(first["is_system_named"]),
                          "index_type_desc": first["type_desc"],
                          "ordered_key_columns": [x["column_name"] for x in ordered],
                          "key_sort_direction": ["DESC" if x["is_descending_key"] else "ASC" for x in ordered],
                      })
                  return sorted(out, key=lambda x: json.dumps(x, sort_keys=True, ensure_ascii=False))
              if surface == "foreign_keys":
                  groups = {}
                  for row in items:
                      key = (row["schema_name"], row["table_name"], row["name"], row["referenced_schema"], row["referenced_table"])
                      groups.setdefault(key, []).append(row)
                  out = []
                  for rows_for_fk in groups.values():
                      first = rows_for_fk[0]
                      ordered = sorted(rows_for_fk, key=lambda x: int(x["constraint_column_id"]))
                      out.append({
                          "schema_name": first["schema_name"],
                          "table_name": first["table_name"],
                          "canonical_name": system_name(first),
                          "is_system_named": bool(first["is_system_named"]),
                          "ordered_local_columns": [x["column_name"] for x in ordered],
                          "referenced_schema": first["referenced_schema"],
                          "referenced_table": first["referenced_table"],
                          "ordered_referenced_columns": [x["referenced_column"] for x in ordered],
                          "delete_referential_action_desc": first["delete_referential_action_desc"],
                          "update_referential_action_desc": first["update_referential_action_desc"],
                          "is_disabled": bool(first["is_disabled"]),
                          "is_not_trusted": bool(first["is_not_trusted"]),
                      })
                  return sorted(out, key=lambda x: json.dumps(x, sort_keys=True, ensure_ascii=False))
              if surface == "indexes":
                  groups = {}
                  for row in items:
                      key = (row["schema_name"], row["table_name"], row["name"])
                      groups.setdefault(key, []).append(row)
                  out = []
                  for rows_for_index in groups.values():
                      first = rows_for_index[0]
                      keys = sorted((x for x in rows_for_index if int(x["key_ordinal"]) > 0), key=lambda x: int(x["key_ordinal"]))
                      included = sorted((x for x in rows_for_index if x["is_included_column"]), key=lambda x: x["column_name"])
                      out.append({
                          "schema_name": first["schema_name"],
                          "table_name": first["table_name"],
                          "name": first["name"],
                          "is_unique": bool(first["is_unique"]),
                          "type_desc": first["type_desc"],
                          "has_filter": bool(first["has_filter"]),
                          "filter_definition": first["filter_definition"],
                          "is_disabled": bool(first["is_disabled"]),
                          "ordered_key_columns": [x["column_name"] for x in keys],
                          "descending_flags": [bool(x["is_descending_key"]) for x in keys],
                          "included_columns": [x["column_name"] for x in included],
                      })
                  return sorted(out, key=lambda x: json.dumps(x, sort_keys=True, ensure_ascii=False))
              out = []
              for item in items:
                  row = dict(item)
                  if surface in {"check_constraints", "defaults"}:
                      supplied_name = row.pop("name", None)
                      row["canonical_name"] = None if row.get("is_system_named") else supplied_name
                      assert "name" not in row or row.get("canonical_name") == row.get("name")
                  out.append(row)
              return sorted(out, key=lambda x: json.dumps(x, sort_keys=True, ensure_ascii=False))
          def collect(connection):
              cursor = connection.cursor()
              cursor.execute("SELECT s.name AS schema_name,t.name AS table_name FROM sys.tables AS t JOIN sys.schemas AS s ON s.schema_id=t.schema_id WHERE s.name=N'dbo' AND t.is_ms_shipped=0 ORDER BY t.name")
              all_tables = [dict(zip([d[0] for d in cursor.description], row)) for row in cursor.fetchall()]
              physical = {}
              for surface in SURFACES:
                  captured = [row for row in rows(cursor, CATALOG_SQL[surface]) if row.get("table_name") != "alembic_version"]
                  if surface == "columns":
                      diagnostic_collations = [{"schema_name": row["schema_name"], "table_name": row["table_name"], "column_name": row["column_name"], "collation_name": row.get("collation_name")} for row in captured]
                      for row in captured:
                          row.pop("collation_name", None)
                  physical[surface] = normalize(captured, surface)
              cursor.execute("SELECT c.column_id,c.name AS column_name,c.max_length,c.is_nullable FROM sys.columns AS c JOIN sys.tables AS t ON t.object_id=c.object_id JOIN sys.schemas AS s ON s.schema_id=t.schema_id WHERE s.name=N'dbo' AND t.name=N'alembic_version' ORDER BY c.column_id")
              alembic_table_structure = [dict(zip([d[0] for d in cursor.description], row)) for row in cursor.fetchall()]
              cursor.execute("SELECT version_num FROM dbo.alembic_version")
              alembic_row_state = [row[0] for row in cursor.fetchall()]
              canonical_bytes = json.dumps(physical, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
              return {"all_dbo_user_tables": all_tables, "physical": physical, "physical_sha256": hashlib.sha256(canonical_bytes).hexdigest(), "alembic_table_structure": alembic_table_structure, "alembic_row_state": alembic_row_state, "diagnostic_column_collations": diagnostic_collations}
          if __name__ == "__main__":
              ap = argparse.ArgumentParser()
              ap.add_argument("--connection", required=True)
              ap.add_argument("--out", required=True)
              args = ap.parse_args()
              with pyodbc.connect(args.connection, autocommit=True) as connection:
                  result = collect(connection)
              json.dump(result, open(args.out, "w", encoding="utf-8"), sort_keys=True, ensure_ascii=False, indent=2)
          PY
          cat > "$RUNNER_TEMP/proposalops_catalog_compare.py" <<'PY'
          import json, sys
          SURFACES = ("tables", "columns", "primary_keys", "unique_constraints", "foreign_keys", "check_constraints", "indexes", "defaults")
          def semantic_identity(surface, item):
              schema = item.get("schema_name", "")
              table = item.get("table_name", "")
              if surface == "tables":
                  return f"{schema}/{table}"
              if surface == "columns":
                  return f"{schema}/{table}/{item.get('column_name', '')}"
              if surface == "defaults":
                  return f"{schema}/{table}/{item.get('column_name', '')}"
              if surface == "indexes":
                  return f"{schema}/{table}/{item.get('name', '')}"
              if surface in {"primary_keys", "unique_constraints"}:
                  name = item.get("canonical_name")
                  fallback = "|".join(item.get("ordered_key_columns", []))
                  return f"{schema}/{table}/{item.get('constraint_type', surface)}/{name or fallback}"
              if surface == "foreign_keys":
                  name = item.get("canonical_name")
                  fallback = "|".join(item.get("ordered_local_columns", [])) + "->" + item.get("referenced_schema", "") + "/" + item.get("referenced_table", "") + "/" + "|".join(item.get("ordered_referenced_columns", []))
                  return f"{schema}/{table}/FK/{name or fallback}"
              if surface == "check_constraints":
                  name = item.get("canonical_name")
                  fallback = item.get("definition", "")
                  return f"{schema}/{table}/CHECK/{name or fallback}"
              raise ValueError("UNKNOWN_SURFACE")

          def identity_map(surface, items):
              mapped = {}
              for item in items:
                  identity = semantic_identity(surface, item)
                  if identity in mapped:
                      raise ValueError("SEMANTIC_IDENTITY_COLLISION")
                  mapped[identity] = item
              return mapped

          def compare(left, right):
              if set(left["physical"]) != set(SURFACES) or set(right["physical"]) != set(SURFACES):
                  raise ValueError("UNKNOWN_SURFACE")
              mismatches = []
              for surface in SURFACES:
                  expected = identity_map(surface, left["physical"][surface])
                  actual = identity_map(surface, right["physical"][surface])
                  for identity in sorted(set(expected) | set(actual)):
                      if expected.get(identity) != actual.get(identity):
                          mismatches.append({"surface": surface, "semantic_identity": identity, "expected": expected.get(identity), "actual": actual.get(identity)})
              return mismatches

          if __name__ == "__main__":
              left = json.load(open(sys.argv[1], encoding="utf-8"))
              right = json.load(open(sys.argv[2], encoding="utf-8"))
              result = {"mismatches": compare(left, right), "reference_canonical_equal": not compare(left, right)}
              json.dump(result, open(sys.argv[3], "w", encoding="utf-8"), sort_keys=True, ensure_ascii=False, indent=2)
          PY
          python -m py_compile "$RUNNER_TEMP/proposalops_catalog_capture.py" "$RUNNER_TEMP/proposalops_catalog_compare.py"
          cat > "$RUNNER_TEMP/proposalops_offline_tests.py" <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          def load(path, name):
              spec=importlib.util.spec_from_file_location(name, path)
              module=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module
          capture=load(root/"proposalops_catalog_capture.py","capture")
          compare=load(root/"proposalops_catalog_compare.py","compare")
          default_a={"schema_name":"dbo","table_name":"t","column_name":"x","name":"DF__t__x__one","is_system_named":True,"definition":"((0))"}
          default_b={**default_a,"name":"DF__t__x__two"}
          check_a={"schema_name":"dbo","table_name":"t","name":"CK__t__one","is_system_named":True,"definition":"(x>0)","is_disabled":False,"is_not_trusted":False}
          check_b={**check_a,"name":"CK__t__two"}
          check_named={"schema_name":"dbo","table_name":"t","canonical_name":"ck_t","is_system_named":False,"definition":"(x>0)","is_disabled":False,"is_not_trusted":False}
          check_named_right={**check_named,"definition":"(x>=0)"}
          normalized_defaults=capture.normalize([default_a], "defaults")
          normalized_checks=capture.normalize([check_a], "check_constraints")
          assert capture.normalize([default_a], "defaults") == capture.normalize([default_b], "defaults")
          assert capture.normalize([check_a], "check_constraints") == capture.normalize([check_b], "check_constraints")
          system_generated_name_in_hash_count=sum(1 for row in normalized_defaults+normalized_checks if "name" in row)
          assert system_generated_name_in_hash_count == 0
          def catalog(surface, values):
              empty={"physical":{s:[] for s in compare.SURFACES}}
              empty["physical"][surface]=values
              return empty
          cases=[
              ("columns","dbo/t/x",{"schema_name":"dbo","table_name":"t","column_name":"x","type_name":"int","max_length":4,"precision":10,"scale":0,"is_nullable":True,"is_identity":False,"is_computed":False}, {"schema_name":"dbo","table_name":"t","column_name":"x","type_name":"bigint","max_length":8,"precision":19,"scale":0,"is_nullable":True,"is_identity":False,"is_computed":False}),
              ("defaults","dbo/t/x",default_a,{**default_a,"definition":"((1))"}),
              ("primary_keys","dbo/t/PK/pk_t",{"schema_name":"dbo","table_name":"t","constraint_type":"PK","canonical_name":"pk_t","ordered_key_columns":["x"],"key_sort_direction":["ASC"]},{"schema_name":"dbo","table_name":"t","constraint_type":"PK","canonical_name":"pk_t","ordered_key_columns":["y"],"key_sort_direction":["ASC"]}),
              ("foreign_keys","dbo/t/FK/fk_t",{"schema_name":"dbo","table_name":"t","canonical_name":"fk_t","ordered_local_columns":["x"],"referenced_schema":"dbo","referenced_table":"p","ordered_referenced_columns":["id"],"delete_referential_action_desc":"NO_ACTION","update_referential_action_desc":"NO_ACTION","is_disabled":False,"is_not_trusted":False,"is_system_named":False},{"schema_name":"dbo","table_name":"t","canonical_name":"fk_t","ordered_local_columns":["x"],"referenced_schema":"dbo","referenced_table":"q","ordered_referenced_columns":["id"],"delete_referential_action_desc":"NO_ACTION","update_referential_action_desc":"NO_ACTION","is_disabled":False,"is_not_trusted":False,"is_system_named":False}),
              ("check_constraints","dbo/t/CHECK/ck_t",check_named,check_named_right),
              ("indexes","dbo/t/ix_t",{"schema_name":"dbo","table_name":"t","name":"ix_t","is_unique":False,"type_desc":"NONCLUSTERED","has_filter":False,"filter_definition":None,"is_disabled":False,"ordered_key_columns":["x"],"descending_flags":[False],"included_columns":[]},{"schema_name":"dbo","table_name":"t","name":"ix_t","is_unique":True,"type_desc":"NONCLUSTERED","has_filter":False,"filter_definition":None,"is_disabled":False,"ordered_key_columns":["x"],"descending_flags":[False],"included_columns":[]}),
              ("tables","dbo/t2",[],[{"schema_name":"dbo","table_name":"t2"}]),
              ("tables","dbo/t2",[{"schema_name":"dbo","table_name":"t2"}],[]),
          ]
          results=[]
          for surface, identity, left, right in cases:
              left_items=left if isinstance(left,list) else [left]
              right_items=right if isinstance(right,list) else [right]
              mismatch=compare.compare(catalog(surface,left_items),catalog(surface,right_items))
              assert len(mismatch)==1
              assert mismatch[0]["surface"]==surface
              assert mismatch[0]["semantic_identity"] == identity
              results.append({"surface":surface,"semantic_identity":identity,"result":"PASS"})
          uq_left={"schema_name":"dbo","table_name":"t","constraint_type":"UQ","canonical_name":"uq_t","ordered_key_columns":["x"],"key_sort_direction":["ASC"]}
          uq_right={**uq_left,"ordered_key_columns":["y"]}
          uq_mismatch=compare.compare(catalog("unique_constraints",[uq_left]),catalog("unique_constraints",[uq_right]))
          assert len(uq_mismatch)==1 and uq_mismatch[0]["semantic_identity"]=="dbo/t/UQ/uq_t"
          additional_regressions=1
          collision_cases=[
              ("check_constraints", check_named, {**check_named,"definition":"(x>1)"}),
              ("foreign_keys", {"schema_name":"dbo","table_name":"t","canonical_name":"fk_t","ordered_local_columns":["x"],"referenced_schema":"dbo","referenced_table":"p","ordered_referenced_columns":["id"]}, {"schema_name":"dbo","table_name":"t","canonical_name":"fk_t","ordered_local_columns":["y"],"referenced_schema":"dbo","referenced_table":"p","ordered_referenced_columns":["id"]}),
              ("unique_constraints", uq_left, {**uq_left,"ordered_key_columns":["y"]}),
          ]
          collision_results=[]
          for surface, left, right in collision_cases:
              try:
                  compare.identity_map(surface, [left, right])
              except ValueError as exc:
                  assert str(exc)=="SEMANTIC_IDENTITY_COLLISION"
                  collision_results.append({"surface":surface,"result":"PASS"})
              else:
                  collision_results.append({"surface":surface,"result":"FAIL"})
          collision_count=len(collision_results)
          assert collision_count==3 and all(item["result"]=="PASS" for item in collision_results)
          json.dump({
              "system_name_default_invariance":"PASS",
              "system_name_check_invariance":"PASS",
              "system_generated_name_in_hash_count":system_generated_name_in_hash_count,
              "item_level_tests":results,
              "required_item_tests":8,
              "item_level_test_count":len(results),
              "item_level_test_pass":sum(item["result"]=="PASS" for item in results),
              "item_level_test_fail":sum(item["result"]!="PASS" for item in results),
              "additional_regression_tests":additional_regressions,
              "unique_constraint_item_comparator_regression":"PASS",
              "semantic_identity_collision_test_count":collision_count,
              "semantic_identity_collision_test_pass":sum(item["result"]=="PASS" for item in collision_results),
              "semantic_identity_collision_test_fail":sum(item["result"]!="PASS" for item in collision_results),
              "semantic_identity_collision_tests":collision_results,
          },open(root/"proposalops-reference-evidence"/"offline-unit-tests.json","w"),sort_keys=True,indent=2)
          PY
          python "$RUNNER_TEMP/proposalops_offline_tests.py"


