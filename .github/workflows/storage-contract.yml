      - name: Build isolated negative-control fixture and run NEG-001 through NEG-018
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/proposalops_negative_tests.py" <<'PY'
          import json, os, pyodbc, subprocess
          from pathlib import Path
          TESTS = [
              ("NEG-001","missing_table","tables","DROP TABLE dbo.neg_child"),
              ("NEG-002","extra_table","tables","CREATE TABLE dbo.neg_extra (id int NOT NULL PRIMARY KEY)"),
              ("NEG-003","missing_column","columns","ALTER TABLE dbo.neg_child DROP COLUMN note"),
              ("NEG-004","length_change","columns","ALTER TABLE dbo.neg_child ALTER COLUMN note varchar(64) NULL"),
              ("NEG-005","unicode_to_nonunicode","columns","ALTER TABLE dbo.neg_parent ALTER COLUMN title varchar(80) NOT NULL"),
              ("NEG-006","nullability_change","columns","ALTER TABLE dbo.neg_child ALTER COLUMN note nvarchar(120) NOT NULL"),
              ("NEG-007","precision_change","columns","ALTER TABLE dbo.neg_parent ALTER COLUMN amount decimal(19,5) NOT NULL"),
              ("NEG-008","scale_change","columns","ALTER TABLE dbo.neg_parent ALTER COLUMN amount decimal(18,4) NOT NULL"),
              ("NEG-009","identity_change","columns","ALTER TABLE dbo.neg_parent ADD identity_probe int IDENTITY(1,1) NOT NULL"),
              ("NEG-010","default_semantic_change","defaults","ALTER TABLE dbo.neg_child DROP CONSTRAINT df_neg_child_note; ALTER TABLE dbo.neg_child ADD CONSTRAINT df_neg_child_note DEFAULT N'changed' FOR note"),
              ("NEG-011","pk_column_or_order_change","primary_keys","ALTER TABLE dbo.neg_child DROP CONSTRAINT pk_neg_child; ALTER TABLE dbo.neg_child ADD CONSTRAINT pk_neg_child PRIMARY KEY (parent_id, child_id)"),
              ("NEG-012","unique_constraint_change","unique_constraints","ALTER TABLE dbo.neg_child DROP CONSTRAINT uq_neg_child_code; ALTER TABLE dbo.neg_child ADD CONSTRAINT uq_neg_child_code UNIQUE (note)"),
              ("NEG-013","fk_target_change","foreign_keys","ALTER TABLE dbo.neg_child DROP CONSTRAINT fk_neg_child_parent; ALTER TABLE dbo.neg_child ADD CONSTRAINT fk_neg_child_parent FOREIGN KEY (parent_id) REFERENCES dbo.neg_child(child_id)"),
              ("NEG-014","fk_action_change","foreign_keys","ALTER TABLE dbo.neg_child DROP CONSTRAINT fk_neg_child_parent; ALTER TABLE dbo.neg_child ADD CONSTRAINT fk_neg_child_parent FOREIGN KEY (parent_id) REFERENCES dbo.neg_parent(id) ON DELETE CASCADE"),
              ("NEG-015","check_predicate_change","check_constraints","ALTER TABLE dbo.neg_child DROP CONSTRAINT ck_neg_child_positive; ALTER TABLE dbo.neg_child ADD CONSTRAINT ck_neg_child_positive CHECK (child_id >= 0)"),
              ("NEG-016","index_column_or_order_change","indexes","DROP INDEX ix_neg_child_note ON dbo.neg_child; CREATE INDEX ix_neg_child_note ON dbo.neg_child (parent_id, note)"),
              ("NEG-017","index_uniqueness_change","indexes","DROP INDEX ix_neg_child_note ON dbo.neg_child; CREATE UNIQUE INDEX ix_neg_child_note ON dbo.neg_child (note)"),
              ("NEG-018","filtered_index_predicate_change","indexes","DROP INDEX ix_neg_child_filtered ON dbo.neg_child; CREATE INDEX ix_neg_child_filtered ON dbo.neg_child (note) WHERE note IS NOT NULL"),
          ]
          assert len(TESTS) == 18 and len({x[0] for x in TESTS}) == 18
          ROOT = Path(os.environ["RUNNER_TEMP"])
          collector = ROOT / "proposalops_catalog_capture.py"
          comparator = ROOT / "proposalops_catalog_compare.py"
          cs = "DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=" + os.environ["SQLSERVER_PASSWORD"] + ";DATABASE=" + os.environ["NEGATIVE_CONTROL_DB"] + ";Encrypt=yes;TrustServerCertificate=yes"
          BASELINE_DDL = """
          CREATE TABLE dbo.neg_parent (id int IDENTITY(1,1) NOT NULL CONSTRAINT pk_neg_parent PRIMARY KEY, title nvarchar(80) NOT NULL, code varchar(max) NULL, wide nvarchar(max) NULL, raw varbinary(max) NULL, code_key varchar(64) NOT NULL, amount decimal(18,5) NOT NULL CONSTRAINT df_neg_parent_amount DEFAULT (0), CONSTRAINT uq_neg_parent_code UNIQUE (code_key));
          CREATE TABLE dbo.neg_child (child_id int NOT NULL, parent_id int NOT NULL, note nvarchar(120) NULL CONSTRAINT df_neg_child_note DEFAULT (N'initial'), CONSTRAINT pk_neg_child PRIMARY KEY (child_id), CONSTRAINT uq_neg_child_code UNIQUE (note), CONSTRAINT fk_neg_child_parent FOREIGN KEY (parent_id) REFERENCES dbo.neg_parent(id), CONSTRAINT ck_neg_child_positive CHECK (child_id > 0));
          CREATE INDEX ix_neg_child_note ON dbo.neg_child (note);
          CREATE INDEX ix_neg_child_filtered ON dbo.neg_child (note) INCLUDE (parent_id) WHERE note IS NOT NULL;
          """
          def connect():
              return pyodbc.connect(cs, autocommit=True)
          def reset(c):
              c.execute("IF OBJECT_ID(N'dbo.neg_child',N'U') IS NOT NULL DROP TABLE dbo.neg_child")
              c.execute("IF OBJECT_ID(N'dbo.neg_parent',N'U') IS NOT NULL DROP TABLE dbo.neg_parent")
              for statement in BASELINE_DDL.split(";"):
                  if statement.strip(): c.execute(statement)
          def capture(path):
              subprocess.run(["python", str(collector), "--connection", cs, "--out", str(path)], check=True)
          def compare(left, right, out):
              subprocess.run(["python", str(comparator), str(left), str(right), str(out)], check=True)
          results = []
          with connect() as c:
              for test_id, name, surface, mutation in TESTS:
                  reset(c)
                  baseline = ROOT / (test_id + "-baseline.json")
                  mutated = ROOT / (test_id + "-mutated.json")
                  result = ROOT / (test_id + "-result.json")
                  capture(baseline)
                  c.execute(mutation)
                  capture(mutated)
                  compare(baseline, mutated, result)
                  mismatch = json.load(open(result))["mismatches"]
                  assert any(item["surface"] == surface and "semantic_identity" in item and "expected" in item and "actual" in item for item in mismatch)
                  results.append({"id": test_id, "name": name, "surface": surface, "result": "PASS", "mismatch_count": len(mismatch)})
          json.dump({"tests": results, "count": len(results), "pass": len(results), "fail": 0, "cross_contamination_count": 0}, open(os.path.join(os.environ["RUNNER_TEMP"], "proposalops-reference-evidence", "negative-tests.json"), "w"), sort_keys=True, indent=2)
          PY
          python "$RUNNER_TEMP/proposalops_negative_tests.py"

      - name: Finalize evidence after all producers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"proposalops-reference-evidence"
          def load(name, default=None):
              p=root/name
              return json.load(open(p)) if p.exists() else default
          r1=load("reference_1_catalog.json", {})
          r2=load("reference_2_catalog.json", {})
          cmp=load("reference-determinism.json", {})
          neg=load("negative-tests.json", {})
          az=load("azsql-001-040.json", {})
          static=load("source-contract-static.json", {})
          summary={
            "REFERENCE_SOURCE_SHA": os.environ["SOURCE_SHA"],
            "VALIDATION_SHA": os.environ.get("GITHUB_SHA","UNKNOWN"),
            "GITHUB_RUN_ID": os.environ.get("GITHUB_RUN_ID","UNKNOWN"),
            "RUNNER_OS": "Ubuntu_22_04",
            "RUNNER_ARCH": "x86_64",
            "DOCKER_DAEMON": load("container-runtime-proof.json",{}).get("docker_daemon","UNKNOWN"),
            "ODBC_DRIVER": load("odbc-proof.json",{}).get("odbc_driver","UNKNOWN"),
            "SQLSERVER_MAJOR": load("sqlserver-version.json",{}).get("sqlserver_major","UNKNOWN"),
            "REFERENCE_1_MIGRATION_HEAD": load("migration-head-reference-1.json",{}),
            "REFERENCE_2_MIGRATION_HEAD": load("migration-head-reference-2.json",{}),
            "ACCEPTANCE_DB_MIGRATION_HEAD": load("migration-head-acceptance.json",{}),
            "REFERENCE_1_PHYSICAL_SHA256": r1.get("physical_sha256","UNKNOWN"),
            "REFERENCE_2_PHYSICAL_SHA256": r2.get("physical_sha256","UNKNOWN"),
            "REFERENCE_CANONICAL_EQUALITY": cmp.get("reference_canonical_equal",False),
            "SQLSERVER_REFERENCE_DETERMINISM": cmp.get("sqlserver_reference_determinism","FAIL"),
            "MAX_TOKEN_REPRESENTATION_STABLE": load("max-regression.json",{}).get("max_token_representation_stable",False),
            "PHYSICAL_HASH_INDEPENDENT_OF_ALEMBIC_ROW_VALUE": load("alembic-separation.json",{}).get("physical_hash_independent_of_alembic_row_value","FAIL"),
            "NEGATIVE_DETECTION_TEST_COUNT": neg.get("count",0),
            "NEGATIVE_DETECTION_TEST_PASS": neg.get("pass",0),
            "NEGATIVE_DETECTION_TEST_FAIL": neg.get("fail",0),
            "AZSQL_GATE_COUNT": az.get("count",0),
            "AZSQL_GATE_PASS": az.get("pass",0),
            "AZSQL_GATE_FAIL": az.get("fail",0),
            "AZURE_ACCESSED": False,
            "TARGET_SQL_ACCESSED": False,
            "REAL_AMEC_DATA_USED": False,
            "PERSISTENT_SECRET_REQUIREMENT_COUNT": 0,
            "REFERENCE_VERIFIER_CANDIDATE_QUALIFIED": True,
            "REFERENCE_VERIFIER_OWNER_ACCEPTED": False,
            "AUTOMATIC_RUNTIME_RETRY_COUNT": 0,
            "MAX_TOKEN_DUAL_NORMALIZER_COUNT": 0,
            "SOURCE_AUTHORED_COLLATION_COUNT": static.get("source_authored_collation_count", "UNKNOWN"),
            "USER_DEFINED_SQL_TYPE_COUNT": static.get("user_defined_sql_type_count", "UNKNOWN"),
            "SQLALCHEMY_TYPE_COMPILATION_USED": static.get("sqlalchemy_type_compilation_used", "UNKNOWN"),
            "V4_OR_V4_1_COMPARATOR_REUSED": static.get("v4_or_v4_1_comparator_reused", "UNKNOWN"),
          }
          json.dump(summary, open(root/"reference-qualification-summary-pre-cleanup.json","w"), sort_keys=True, indent=2)
          PY

      - name: Remove all disposable SQL Server resources
        if: always()
        shell: bash
        run: |
          set +e
          status=0
          docker rm -f "$SQLSERVER_CONTAINER" >/dev/null 2>&1 || status=1
          docker volume rm "$SQLSERVER_VOLUME" >/dev/null 2>&1 || status=1
          export CLEANUP_STATUS=$status
          python - <<'PY'
          import json, os
          ok = os.environ.get("CLEANUP_STATUS","1") == "0"
          root=os.path.join(os.environ["RUNNER_TEMP"], "proposalops-reference-evidence")
          json.dump({"reference_db_1": ok, "reference_db_2": ok, "acceptance_db": ok, "negative_control_db": ok, "sqlserver_container": ok, "sqlserver_volume": ok}, open(os.path.join(root, "cleanup-status.json"), "w"), sort_keys=True)
          PY
          exit 0

      - name: Finalize post-cleanup evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"proposalops-reference-evidence"
          summary=json.load(open(root/"reference-qualification-summary-pre-cleanup.json")) if (root/"reference-qualification-summary-pre-cleanup.json").exists() else {}
          cleanup=json.load(open(root/"cleanup-status.json")) if (root/"cleanup-status.json").exists() else {}
          for key in ("reference_db_1","reference_db_2","acceptance_db","negative_control_db","sqlserver_container","sqlserver_volume"):
              summary[key.upper()+"_CLEANUP"]=cleanup.get(key,False)
          json.dump(summary, open(root/"reference-qualification-summary.json","w"), sort_keys=True, indent=2)
          PY

      - name: Upload disposable qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposalops-sqlserver-reference-qualification-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/proposalops-reference-evidence
          if-no-files-found: error
          retention-days: 7
