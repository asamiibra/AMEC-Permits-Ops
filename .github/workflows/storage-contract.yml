          },open(Path(os.environ["RUNNER_TEMP"])/"proposalops-reference-evidence"/"validator-adversarial-mutation-tests.json","w"),sort_keys=True,indent=2)
          PY
          python "$RUNNER_TEMP/proposalops_validator_selftest.py"

