name: Phase4 V3.6R1 final SQL Server validation R3R5V2

on:
  push:
    branches:
      - phase4-v36r1-final-validation-r3r5v2-v1

permissions:
  contents: read

env:
  CANDIDATE_SHA: fb1d504ae058c09a9fdd84a5afd68bcb3916e35c
  CANDIDATE_BRANCH: phase4-v36r1-final-closure-r3r5-v1
  VALIDATION_BRANCH: phase4-v36r1-final-validation-r3r5v2-v1

jobs:
  validate:
    name: Native x64 final Phase4 validation
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable final validation commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Candidate and workflow identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANDIDATE_BRANCH:refs/remotes/origin/$CANDIDATE_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$CANDIDATE_BRANCH")" = "$CANDIDATE_SHA"
          echo CANDIDATE_REMOTE_BRANCH_SHA_BINDING=PASS
          test "$(git rev-parse HEAD^1)" = "$CANDIDATE_SHA"
          echo CANDIDATE_PARENT_SHA_BINDING=PASS
          test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$(git rev-parse HEAD^1^{tree})"
          test "$(git diff --name-only "$CANDIDATE_SHA" HEAD)" = ".github/workflows/phase4-v36r1-final-validation-r3r5v2.yml"
          test "${GITHUB_REF_NAME}" = "$VALIDATION_BRANCH"
          test -z "$(git status --porcelain)"
          evidence="$RUNNER_TEMP/phase4-final-evidence-${GITHUB_RUN_ID}"
          mkdir -p "$evidence"
          printf 'EVIDENCE_DIR=%s\n' "$evidence" >> "$GITHUB_ENV"
          printf 'VALIDATION_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/raw_run.sh" <<'SH'
          raw_run() {
            local name="$1"
            local label="$2"
            shift 2
            local start end code
            start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            set +e
            "$@" >"$EVIDENCE_DIR/${name}.raw.log" 2>&1
            code=$?
            set -e
            end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python - "$name" "$label" "$start" "$end" "$code" "$EVIDENCE_DIR/${name}.raw.log" <<'PY'
          import json, os, sys
          name, label, start, end, code, stdout_path = sys.argv[1:]
          record = {
              "command": label,
              "cwd": os.getcwd(),
              "start_time": start,
              "end_time": end,
              "exit_code": int(code),
              "stdout_path": stdout_path,
              "stderr_path": stdout_path,
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "validation_sha": os.environ["VALIDATION_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
          }
          with open(os.path.join(os.environ["EVIDENCE_DIR"], f"{name}.meta.json"), "w", encoding="utf-8") as handle:
              json.dump(record, handle, indent=2)
              handle.write("\n")
          if int(code) != 0:
              raise SystemExit(int(code))
          PY
          }
          SH
          chmod 700 "$RUNNER_TEMP/raw_run.sh"

      - name: Ubuntu x64 and Docker proof
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          raw_run candidate-binding "git candidate and workflow identity proof" bash -c 'test "$(git rev-parse HEAD^1)" = "$CANDIDATE_SHA"; test "$(git diff --name-only "$CANDIDATE_SHA" HEAD)" = ".github/workflows/phase4-v36r1-final-validation-r3r5v2.yml"; git rev-parse HEAD; git rev-parse HEAD^1'
          raw_run runner-environment "uname and docker info" bash -c 'test "$(uname -m)" = x86_64; docker info >/dev/null; echo RUNNER_OS=Ubuntu_22_04; echo RUNNER_ARCH=x86_64; echo DOCKER_DAEMON=PASS'
          printf '{"runner_os":"Ubuntu_22_04","runner_arch":"x86_64","docker_daemon":"PASS"}\n' > "$EVIDENCE_DIR/container-runtime-proof.json"

      - name: Python dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: R3R5 nullable unique preaudit and post-audit
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          preaudit_worktree="$RUNNER_TEMP/phase4-r3r5-preaudit-base"
          git worktree add --detach "$preaudit_worktree" "$CANDIDATE_SHA^"
          trap 'git worktree remove --force "$preaudit_worktree" >/dev/null 2>&1 || true' EXIT
          raw_run nullable-unique-preaudit "exact R3R4-base nullable unique preaudit" bash -c "cd '$preaudit_worktree' && python scripts/db_azure_sql/nullable_unique_audit.py --mode pre --json-out '$EVIDENCE_DIR/nullable-unique-preaudit.json'"
          raw_run nullable-unique-postaudit "exact R3R5 candidate nullable unique post-audit" python scripts/db_azure_sql/nullable_unique_audit.py --mode post --json-out "$EVIDENCE_DIR/nullable-unique-postaudit.json"
          python - "$EVIDENCE_DIR/nullable-unique-preaudit.json" "$EVIDENCE_DIR/nullable-unique-postaudit.json" <<'PY'
          import json
          import sys
          pre, post = (json.load(open(path, encoding="utf-8")) for path in sys.argv[1:])
          assert pre["unique_object_total_count"] == 216
          assert pre["nullable_unique_filter_required_count"] == 17
          assert pre["nullable_unique_filter_required_open_count"] == 17
          assert post["unique_object_total_count"] == 216
          assert post["unique_object_classified_count"] == 216
          assert post["unclassified_unique_object_count"] == 0
          assert post["unsafe_fk_or_semantic_review_required_count"] == 0
          assert post["model_nullable_unique_unfiltered_count"] == 0
          assert post["migration_nullable_unique_unfiltered_count"] == 0
          assert post["model_migration_nullable_unique_parity_mismatch_count"] == 0
          assert post["nullable_unique_filter_required_open_count"] == 0
          assert post["nullable_unique_filter_implemented_count"] == 17
          assert post["result"] == "PASS"
          print("REMOTE_NULLABLE_UNIQUE_POSTAUDIT=PASS")
          print("REMOTE_NULLABLE_UNIQUE_OBJECT_COUNT=17")
          print("REMOTE_NULLABLE_UNIQUE_FILTER_REQUIRED_OPEN=0")
          PY

      - name: R3 source closure
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          raw_run r3-source-closure "R3 historical provenance and SQL Server dependency closure" python - "$EVIDENCE_DIR/sqlserver-driver-dependency-verification.json" <<'PY'
          from __future__ import annotations
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import tomllib

          root = pathlib.Path.cwd()
          evidence_dir = pathlib.Path(os.environ["EVIDENCE_DIR"])
          provenance_path = evidence_dir / "rebaseline-v5-provenance-verification.json"
          subprocess.run([
              sys.executable,
              "scripts/db_rebaseline/verify_rebaseline_v5_provenance.py",
              "--manifest",
              "docs/database/rebaseline-v5-provenance-supplement-v1.json",
              "--evidence-out",
              str(provenance_path),
          ], check=True)
          subprocess.run([
              sys.executable,
              "-m",
              "pytest",
              "-q",
              "backend/tests/test_azure_sql_port.py::test_sqlserver_driver_dependency_metadata_consistent",
          ], check=True)

          def requirement_matches(path: pathlib.Path) -> list[str]:
              return re.findall(r"^pyodbc==([^\s\\]+)", path.read_text(encoding="utf-8"), re.MULTILINE)

          pyproject = tomllib.loads((root / "backend/pyproject.toml").read_text(encoding="utf-8"))
          pyproject_matches = [item for item in pyproject["project"]["dependencies"] if item.startswith("pyodbc")]
          requirements_matches = requirement_matches(root / "backend/requirements.txt")
          runtime_matches = requirement_matches(root / "backend/requirements-runtime.txt")
          lock_matches = requirement_matches(root / "backend/requirements-runtime.lock")
          dockerfile = (root / "backend/Dockerfile").read_text(encoding="utf-8")
          assert pyproject_matches == ["pyodbc==5.3.0"]
          assert requirements_matches == ["5.3.0"]
          assert runtime_matches == ["5.3.0"]
          assert lock_matches == ["5.3.0"]
          assert "COPY backend/requirements-runtime.lock /tmp/requirements-runtime.lock" in dockerfile
          assert "--require-hashes -r /tmp/requirements-runtime.lock" in dockerfile

          identity = {
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "validation_sha": os.environ["VALIDATION_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
          }
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          provenance.update(identity)
          provenance_path.write_text(json.dumps(provenance, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          dependency_evidence = {
              **identity,
              "result": "PASS",
              "pyproject": {"declaration_count": len(pyproject_matches), "exact": pyproject_matches[0]},
              "requirements_txt": {"declaration_count": len(requirements_matches), "exact": "pyodbc==" + requirements_matches[0]},
              "requirements_runtime_txt": {"declaration_count": len(runtime_matches), "exact": "pyodbc==" + runtime_matches[0]},
              "requirements_runtime_lock": {"version": lock_matches[0]},
              "dockerfile_runtime_authority": "backend/requirements-runtime.lock",
              "sqlserver_driver_dependency_metadata_parity": "PASS",
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(dependency_evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("R3_SOURCE_CLOSURE_EXIT_CODE=0")
          print("REBASELINE_SUPPLEMENTAL_PROVENANCE=PASS")
          print("SQLSERVER_DRIVER_DEPENDENCY_METADATA_PARITY=PASS")
          PY

      - name: Runner ODBC Driver 18 proof
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          raw_run odbc-install "runner existing Microsoft repository ODBC installation" bash -c '
            sudo apt-get update
            sudo apt-get install -y unixodbc-dev
            echo "=== existing Microsoft apt sources ==="
            grep -R --line-number "packages\\.microsoft\\.com/ubuntu/22\\.04/prod" /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true
            if ! dpkg-query -W -f="${Status}\\n" msodbcsql18 2>/dev/null | grep -q "^install ok installed$"; then
              if ! apt-cache show msodbcsql18 >/dev/null 2>&1; then
                echo RESULT=STOP_PHASE4_FINAL_CLOSURE_ODBC_RUNNER_PACKAGE_UNAVAILABLE
                exit 42
              fi
              sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
            fi
            odbcinst -q -d
            odbcinst -q -d | grep -F "ODBC Driver 18 for SQL Server"
            echo MICROSOFT_APT_SOURCE_CREATED_BY_WORKFLOW=false
            echo MICROSOFT_APT_KEY_CREATED_BY_WORKFLOW=false
            echo APT_SIGNED_BY_REWRITE_COUNT=0
          '

      - name: Frontend dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Backend production image build
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          raw_run backend-image-build "docker build backend production image" docker build --build-arg "RELEASE_SHA=$CANDIDATE_SHA" -f backend/Dockerfile -t proposalops-final-backend:"$CANDIDATE_SHA" .

      - name: Backend image ODBC and non-root proof
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          cat > "$RUNNER_TEMP/backend_image_proof.sh" <<'SH'
          set -euo pipefail
          IMAGE="proposalops-final-backend:$CANDIDATE_SHA"
          test "$(docker inspect --format '{{.Config.User}}' "$IMAGE")" = "10001:10001"
          echo BACKEND_IMAGE_NON_ROOT=true
          docker run --rm --entrypoint python "$IMAGE" -c 'import pyodbc; drivers=pyodbc.drivers(); print(drivers); assert "ODBC Driver 18 for SQL Server" in drivers'
          echo BACKEND_IMAGE_PYODBC_IMPORT_PASS=true
          echo BACKEND_IMAGE_MSODBCSQL18_PRESENT=true
          package_versions="$(docker run --rm --entrypoint dpkg-query "$IMAGE" -W '-f=${Package}=${Version}\n' packages-microsoft-prod msodbcsql18)"
          printf '%s\n' "$package_versions"
          printf '%s\n' "$package_versions" | grep -Eq '^packages-microsoft-prod=[^[:space:]]+$'
          printf '%s\n' "$package_versions" | grep -Eq '^msodbcsql18=[^[:space:]]+$'
          SH
          chmod 700 "$RUNNER_TEMP/backend_image_proof.sh"
          raw_run backend-image-odbc "in-image pyodbc and ODBC Driver 18 proof" bash "$RUNNER_TEMP/backend_image_proof.sh"
      - name: Start SQL Server 2022 and prove readiness
        shell: bash
        env:
          SQLSERVER_CONTAINER: proposalops-final-sqlserver-${{ github.run_id }}
          SQLSERVER_VOLUME: proposalops-final-volume-${{ github.run_id }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          SQLSERVER_PASSWORD="$(python -c 'import secrets; print("P4!aA1_" + secrets.token_urlsafe(32))')"
          echo "::add-mask::$SQLSERVER_PASSWORD"
          export SQLSERVER_PASSWORD
          printf 'SQLSERVER_PASSWORD=%s\n' "$SQLSERVER_PASSWORD" >> "$GITHUB_ENV"
          docker volume create "$SQLSERVER_VOLUME" >/dev/null
          printf 'SQLSERVER_CONTAINER=%s\nSQLSERVER_VOLUME=%s\n' "$SQLSERVER_CONTAINER" "$SQLSERVER_VOLUME" >> "$GITHUB_ENV"
          raw_run sqlserver-start "docker SQL Server 2022 Developer startup" docker run --detach --platform linux/amd64 --name "$SQLSERVER_CONTAINER" --publish 127.0.0.1:1433:1433 --volume "$SQLSERVER_VOLUME:/var/opt/mssql" --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD="$SQLSERVER_PASSWORD" mcr.microsoft.com/mssql/server:2022-latest
          cat > "$RUNNER_TEMP/sqlserver_probe.py" <<'PY'
          import os
          import time
          import pyodbc
          connection_string = "DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=" + os.environ["SQLSERVER_PASSWORD"] + ";DATABASE=master;Encrypt=yes;TrustServerCertificate=yes"
          for attempt in range(40):
              try:
                  connection = pyodbc.connect(connection_string, timeout=5)
                  break
              except pyodbc.Error:
                  if attempt == 39:
                      raise
                  time.sleep(5)
          cursor = connection.cursor()
          cursor.execute("SELECT 1")
          assert cursor.fetchone()[0] == 1
          cursor.execute("SELECT @@VERSION")
          print(cursor.fetchone()[0].splitlines()[0])
          cursor.execute("SELECT CAST(SERVERPROPERTY(N'ProductMajorVersion') AS INT)")
          major = cursor.fetchone()[0]
          print("SQLSERVER_MAJOR=" + str(major))
          assert major == 16
          connection.close()
          PY
          raw_run sqlserver-version "host pyodbc SELECT 1 @@VERSION and major version" python "$RUNNER_TEMP/sqlserver_probe.py"
          docker exec "$SQLSERVER_CONTAINER" true >/dev/null

      - name: R3R5 migration and metadata seed smoke with catalog proof
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/raw_run.sh"
          cat > "$RUNNER_TEMP/r3r5_seed_smoke.py" <<'PY'
          from __future__ import annotations
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import uuid

          import pyodbc

          ROOT = pathlib.Path.cwd()
          EVIDENCE = pathlib.Path(os.environ["EVIDENCE_DIR"])
          RUN_ID = os.environ["GITHUB_RUN_ID"]
          PASSWORD = os.environ["SQLSERVER_PASSWORD"]
          USERS = {
              "owner@amec.synthetic", "champion@amec.synthetic", "steward@amec.synthetic",
              "engineer@amec.synthetic", "preparer@amec.synthetic", "submitter@amec.synthetic",
              "admin@amec.synthetic",
          }
          PROJECTS = {"GHCE-2026-0142", "GHCE-2026-0187", "GHCE-2026-0210", "GHCE-2026-0244"}

          def quote_identifier(value: str) -> str:
              return "[" + value.replace("]", "]]" ) + "]"

          def connect(database: str):
              cs = (
                  "DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD="
                  + PASSWORD + ";DATABASE=" + database + ";Encrypt=yes;TrustServerCertificate=yes"
              )
              return pyodbc.connect(cs)

          def database_exists(database: str) -> bool:
              connection = connect("master")
              try:
                  row = connection.cursor().execute("SELECT DB_ID(?)", database).fetchone()
                  return row[0] is not None
              finally:
                  connection.close()

          def create_database(database: str) -> None:
              connection = connect("master")
              connection.autocommit = True
              try:
                  connection.cursor().execute("CREATE DATABASE " + quote_identifier(database))
              finally:
                  connection.close()

          def drop_database(database: str) -> None:
              connection = connect("master")
              connection.autocommit = True
              try:
                  connection.cursor().execute(
                      "IF DB_ID(?) IS NOT NULL BEGIN ALTER DATABASE "
                      + quote_identifier(database)
                      + " SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE "
                      + quote_identifier(database)
                      + "; END",
                      database,
                  )
              finally:
                  connection.close()

          def environment(database: str, root: pathlib.Path) -> dict[str, str]:
              values = os.environ.copy()
              values.update({
                  "APP_ENV": "TEST",
                  "SYNTHETIC_ONLY": "true",
                  "REAL_DATA_ALLOWED": "false",
                  "SYNTHETIC_TEST_ROOT": str(root),
                  "MOCK_SYSTEMS_ROOT": str(root / "mock-systems"),
                  "DATABASE_URL": (
                      "mssql+pyodbc://sa:" + __import__("urllib.parse", fromlist=["quote"]).quote(PASSWORD, safe="")
                      + "@127.0.0.1:1433/" + database
                      + "?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes"
                  ),
              })
              return values

          def command(args: list[str], values: dict[str, str]) -> None:
              subprocess.run(args, cwd=ROOT, env=values, check=True)

          def snapshot(database: str) -> dict[str, object]:
              connection = connect(database)
              try:
                  cursor = connection.cursor()
                  user_rows = cursor.execute(
                      "SELECT email, entra_object_id FROM dbo.users WHERE email IN (?,?,?,?,?,?,?)",
                      *sorted(USERS),
                  ).fetchall()
                  project_rows = cursor.execute(
                      "SELECT project_number, project_code FROM dbo.projects WHERE project_number IN (?,?,?,?)",
                      *sorted(PROJECTS),
                  ).fetchall()
                  emails = {row[0] for row in user_rows}
                  project_numbers = {row[0] for row in project_rows}
                  assert emails == USERS
                  assert project_numbers == PROJECTS
                  assert len(user_rows) == 7
                  assert sum(row[1] is None for row in user_rows) == 7
                  assert len(project_rows) == 4
                  assert sum(row[1] is None for row in project_rows) == 4
                  return {
                      "canonical_user_email_count": len(user_rows),
                      "canonical_user_entra_null_count": sum(row[1] is None for row in user_rows),
                      "canonical_user_emails": sorted(emails),
                      "canonical_project_number_count": len(project_rows),
                      "canonical_project_code_null_count": sum(row[1] is None for row in project_rows),
                      "canonical_project_numbers": sorted(project_numbers),
                  }
              finally:
                  connection.close()

          def duplicate_nonnull_rejection(database: str, table: str, column: str, selector: str) -> bool:
              connection = connect(database)
              try:
                  cursor = connection.cursor()
                  first_value = str(uuid.uuid5(uuid.NAMESPACE_URL, database + table + column))
                  cursor.execute("UPDATE dbo." + table + " SET " + column + "=? WHERE " + selector + "=?", first_value, sorted(USERS if table == "users" else PROJECTS)[0])
                  connection.commit()
                  second_selector = sorted(USERS if table == "users" else PROJECTS)[1]
                  try:
                      cursor.execute("UPDATE dbo." + table + " SET " + column + "=? WHERE " + selector + "=?", first_value, second_selector)
                      connection.commit()
                  except pyodbc.Error as exc:
                      connection.rollback()
                      message = str(exc)
                      assert "2601" in message or "2627" in message, message
                      return True
                  raise AssertionError("duplicate non-NULL value was accepted")
              finally:
                  connection.close()

          def normalized(value: str | None) -> str | None:
              if value is None:
                  return None
              return re.sub(r"[()\[\]]", "", re.sub(r"\s+", " ", value.strip())).lower()

          def catalog(database: str, output_name: str) -> dict[str, object]:
              audit = json.loads((EVIDENCE / "nullable-unique-postaudit.json").read_text(encoding="utf-8"))
              expected = [item for item in audit["objects"] if item["classification"] == "NULLABLE_UNIQUE_FILTER_REQUIRED"]
              connection = connect(database)
              failures: list[str] = []
              results: list[dict[str, object]] = []
              duplicate_logical = 0
              try:
                  cursor = connection.cursor()
                  for item in expected:
                      rows = cursor.execute(
                          "SELECT i.name, i.is_unique, i.has_filter, i.filter_definition, c.name, ic.key_ordinal "
                          "FROM sys.schemas s JOIN sys.tables t ON t.schema_id=s.schema_id "
                          "JOIN sys.indexes i ON i.object_id=t.object_id "
                          "JOIN sys.index_columns ic ON ic.object_id=i.object_id AND ic.index_id=i.index_id AND ic.is_included_column=0 "
                          "JOIN sys.columns c ON c.object_id=ic.object_id AND c.column_id=ic.column_id "
                          "WHERE s.name=N'dbo' AND t.name=? AND i.name=? ORDER BY ic.key_ordinal",
                          item["table_name"], item["object_name"],
                      ).fetchall()
                      observed = {
                          "object_name": item["object_name"],
                          "table_name": item["table_name"],
                          "ordered_key_columns": [row[4] for row in rows],
                          "is_unique": bool(rows and rows[0][1]),
                          "has_filter": bool(rows and rows[0][2]),
                          "filter_definition": rows[0][3] if rows else None,
                      }
                      expected_filter = item["expected_mssql_filter"]
                      passed = bool(rows) and observed["is_unique"] and observed["has_filter"] and observed["ordered_key_columns"] == item["ordered_key_columns"] and normalized(observed["filter_definition"]) == expected_filter
                      observed["pass"] = passed
                      if not passed:
                          failures.append(str(item["object_name"]))
                      results.append(observed)

                  for item in expected:
                      rows = cursor.execute(
                          "SELECT i.name, i.has_filter, i.filter_definition, c.name, ic.key_ordinal "
                          "FROM sys.schemas s JOIN sys.tables t ON t.schema_id=s.schema_id "
                          "JOIN sys.indexes i ON i.object_id=t.object_id AND i.is_unique=1 "
                          "JOIN sys.index_columns ic ON ic.object_id=i.object_id AND ic.index_id=i.index_id AND ic.is_included_column=0 "
                          "JOIN sys.columns c ON c.object_id=ic.object_id AND c.column_id=ic.column_id "
                          "WHERE s.name=N'dbo' AND t.name=? ORDER BY i.name, ic.key_ordinal",
                          item["table_name"],
                      ).fetchall()
                      grouped: dict[str, list[str]] = {}
                      for row in rows:
                          grouped.setdefault(row[0], []).append(row[3])
                      logical_key = tuple(item["ordered_key_columns"])
                      duplicate_logical += sum(1 for name, columns in grouped.items() if tuple(columns) == logical_key and name != item["object_name"])
              finally:
                  connection.close()
              record = {
                  "result": "PASS" if not failures and duplicate_logical == 0 else "FAIL",
                  "database": database,
                  "candidate_sha": os.environ["CANDIDATE_SHA"],
                  "validation_sha": os.environ["VALIDATION_SHA"],
                  "run_id": RUN_ID,
                  "remote_nullable_unique_object_count": len(expected),
                  "remote_nullable_unique_filtered_pass": len(expected) - len(failures),
