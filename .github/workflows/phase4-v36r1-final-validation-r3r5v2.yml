          raw_run nullable-unique-final-catalog "final fresh SQL Server nullable unique catalog proof" python - <<'PY'
          import json
          import os
          import re
          import pyodbc
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE_DIR"])
          audit = json.loads((evidence / "nullable-unique-postaudit.json").read_text(encoding="utf-8"))
          expected = [item for item in audit["objects"] if item["classification"] == "NULLABLE_UNIQUE_FILTER_REQUIRED"]
          connection = pyodbc.connect(
              "DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD="
              + os.environ["SQLSERVER_PASSWORD"] + ";DATABASE=proposalops_final;Encrypt=yes;TrustServerCertificate=yes"
          )
          def normalize(value):
              return re.sub(r"[()\[\]]", "", re.sub(r"\s+", " ", (value or "").strip())).lower()
          failures = []
          results = []
          duplicates = 0
          try:
              cursor = connection.cursor()
              for item in expected:
                  rows = cursor.execute(
                      "SELECT i.name, i.is_unique, i.has_filter, i.filter_definition, c.name, ic.key_ordinal "
                      "FROM sys.schemas s JOIN sys.tables t ON t.schema_id=s.schema_id "
                      "JOIN sys.indexes i ON i.object_id=t.object_id "
                      "JOIN sys.index_columns ic ON ic.object_id=i.object_id AND ic.index_id=i.index_id AND ic.is_included_column=0 "
                      "JOIN sys.columns c ON c.object_id=ic.object_id AND c.column_id=ic.column_id "
                      "WHERE s.name=N'dbo' AND t.name=? AND i.name=? ORDER BY ic.key_ordinal",
                      item["table_name"], item["object_name"],
                  ).fetchall()
                  passed = bool(rows) and bool(rows[0][1]) and bool(rows[0][2]) and [row[4] for row in rows] == item["ordered_key_columns"] and normalize(rows[0][3]) == item["expected_mssql_filter"]
                  if not passed:
                      failures.append(item["object_name"])
                  results.append({"object_name": item["object_name"], "pass": passed, "filter_definition": rows[0][3] if rows else None, "ordered_key_columns": [row[4] for row in rows]})
              for item in expected:
                  rows = cursor.execute(
                      "SELECT i.name, c.name, ic.key_ordinal FROM sys.schemas s JOIN sys.tables t ON t.schema_id=s.schema_id JOIN sys.indexes i ON i.object_id=t.object_id AND i.is_unique=1 JOIN sys.index_columns ic ON ic.object_id=i.object_id AND ic.index_id=i.index_id AND ic.is_included_column=0 JOIN sys.columns c ON c.object_id=ic.object_id AND c.column_id=ic.column_id WHERE s.name=N'dbo' AND t.name=? ORDER BY i.name, ic.key_ordinal",
                      item["table_name"],
                  ).fetchall()
                  grouped = {}
                  for row in rows:
                      grouped.setdefault(row[0], []).append(row[1])
                  duplicates += sum(1 for name, columns in grouped.items() if tuple(columns) == tuple(item["ordered_key_columns"]) and name != item["object_name"])
          finally:
              connection.close()
          record = {
              "result": "PASS" if not failures and duplicates == 0 else "FAIL",
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "validation_sha": os.environ["VALIDATION_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "database": "proposalops_final",
              "remote_nullable_unique_object_count": len(expected),
              "remote_nullable_unique_filtered_pass": len(expected) - len(failures),
              "remote_nullable_unique_filtered_fail": len(failures),
              "remote_duplicate_logical_unique_object_count": duplicates,
              "known_users_entra_filter": next((item["pass"] for item in results if item["object_name"] == "ix_users_entra_object_id"), False),
              "known_projects_project_code_filter": next((item["pass"] for item in results if item["object_name"] == "ix_projects_project_code"), False),
              "objects": results,
              "failures": failures,
          }
          (evidence / "nullable-unique-runtime-catalog-final-db.json").write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          assert record["result"] == "PASS", record
          print("FINAL_NULLABLE_UNIQUE_CATALOG=PASS")
          print("FINAL_NULLABLE_UNIQUE_FILTERED_PASS=" + str(record["remote_nullable_unique_filtered_pass"]))
          print("FINAL_NULLABLE_UNIQUE_FILTERED_FAIL=" + str(record["remote_nullable_unique_filtered_fail"]))
          print("FINAL_DUPLICATE_LOGICAL_UNIQUE_OBJECT_COUNT=" + str(duplicates))
          PY

