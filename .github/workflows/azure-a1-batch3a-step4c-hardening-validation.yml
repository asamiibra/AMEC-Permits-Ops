name: Azure A1 Batch 3A Step 4C Hardening

on:
  push:
    branches: [azure-a1-f1-batch3a-step4c]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  exact-head-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Exact ancestry and file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 446dfe578ebbe6433960ad94880e96674a685877 HEAD
          allowlist='backend/app/config/settings.py backend/app/main.py backend/app/runtime_provenance.py backend/app/db.py backend/app/migrate.py backend/app/observability.py backend/app/provision_db_roles.py backend/Dockerfile backend/requirements-runtime.txt backend/requirements-runtime.lock backend/requirements-test.lock backend/tests/test_environment_guardrails.py backend/tests/test_database_startup_contract.py backend/tests/test_azure_readiness.py backend/tests/test_azure_runtime_provenance.py backend/tests/test_azure_database_tls.py backend/tests/test_observability.py backend/tests/test_db_role_separation.py backend/tests/test_correlation_id.py backend/tests/test_seed_modes.py frontend/package.json frontend/package-lock.json frontend/Dockerfile frontend/nginx.conf deploy/webjobs/worker/run.sh deploy/webjobs/worker/settings.job deploy/webjobs/migrate/run.sh deploy/webjobs/migrate/settings.job scripts/azure/package_webjobs.sh release/a1-release-manifest.schema.json scripts/release/verify_a1_release_manifest.py docs/azure/A1_PREDEPLOY_HARDENING_AND_RELEASE_CONTRACT.md infra/azure/main.bicep infra/azure/modules/appservice.bicep infra/azure/README.md .github/workflows/azure-a1-batch3a-step4c-hardening-validation.yml'
          for path in $(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA"); do
            grep -Fqx "$path" <(tr ' ' '\n' <<<"$allowlist") || { echo "unauthorized path: $path"; exit 1; }
          done

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and test backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pytest -q backend/tests

      - name: Install and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test -- --run
          npm run build

      - name: Secret scan (redacted)
        run: |
          python -m pip install detect-secrets==1.5.0
          detect-secrets scan --all-files --exclude-files '(^|/)(node_modules|dist|artifacts)/' > /tmp/secrets.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/secrets.json'))
          findings=sum(len(v) for v in d.get('results',{}).values())
          print(f'SECRET_FINDINGS={findings}')
          raise SystemExit(findings != 0)
          PY

      - name: Build immutable candidate containers
        run: |
          docker build --build-arg RELEASE_SHA="$GITHUB_SHA" --build-arg VITE_ENTRA_TENANT_ID=11111111-1111-4111-8111-111111111111 --build-arg VITE_ENTRA_WEB_CLIENT_ID=22222222-2222-4222-8222-222222222222 --build-arg VITE_ENTRA_API_CLIENT_ID=33333333-3333-4333-8333-333333333333 --build-arg VITE_API_URL=https://api.invalid -t proposalops/frontend:$GITHUB_SHA frontend
          docker build --build-arg RELEASE_SHA="$GITHUB_SHA" -t proposalops/backend:$GITHUB_SHA .

      - name: Package deterministic WebJobs
        run: scripts/azure/package_webjobs.sh "$RUNNER_TEMP/webjobs"

      - name: Validate release verifier and IaC syntax
        run: |
          python scripts/release/verify_a1_release_manifest.py /dev/null || test $? -eq 1
          python -m py_compile backend/app/*.py scripts/release/verify_a1_release_manifest.py
          grep -q "healthCheckPath: '/health/ready'" infra/azure/modules/appservice.bicep

      - name: PostgreSQL and container tooling versions
        run: |
          docker version
          docker compose version
          npm --version
          python --version
