name: ProposalOps Production Integration V1R1 validation

on:
  push:
    branches:
      - proposalops-production-integration-ci-r1-v1

permissions:
  contents: read

env:
  APPLICATION_BRANCH: proposalops-production-integration-v1
  APPLICATION_SHA: eec00021a308046998d9d1df1929628f319a96d4
  APPLICATION_PARENT_SHA: 1a17b395fdaa2309a2832609486783fd1f1d8eca
  VALIDATION_BRANCH: proposalops-production-integration-ci-r1-v1
  PHASE5_SHA: c42e6c449483b0951de0f366d700dbaf7b9e5525
  PHASE5_TREE: a497c6951064119453d175d1b93d4e59c9029fd0
  HISTORICAL_MAIN_SHA: 3474b35a13d27f0010ec5d03dd4a2f361ac6774d
  ACCOUNT_REBIND_SHA: 4a017b465300fc6c39b7807b24e08868479ec884
  FOUNDATION_SHA: ce8a887703ec8c15c8c781e1589e169ce395845a
  SQLSERVER_IMAGE_TAG: mcr.microsoft.com/mssql/server:2022-latest

jobs:
  validate:
    name: Production integration V1 executable validation
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout immutable integration validation child
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identity, ancestry, and one-workflow binding gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$VALIDATION_BRANCH"
          git fetch --no-tags origin "$APPLICATION_BRANCH:refs/remotes/origin/$APPLICATION_BRANCH"
          test "$(git rev-parse HEAD^1)" = "$APPLICATION_SHA"
          test "$(git rev-parse "$APPLICATION_PARENT_SHA^{tree}")" = "$PHASE5_TREE"
          test "$(git rev-parse refs/remotes/origin/$APPLICATION_BRANCH)" = "$APPLICATION_SHA"
          test "$(git rev-parse HEAD^1^1)" = "$APPLICATION_PARENT_SHA"
          test "$(git diff --name-only "$APPLICATION_SHA" HEAD)" = ".github/workflows/production-integration-validation-r1.yml"
          test "$(git rev-parse "$PHASE5_SHA^{tree}")" = "$PHASE5_TREE"
          git merge-base --is-ancestor "$PHASE5_SHA" "$APPLICATION_SHA"
          git merge-base --is-ancestor "$HISTORICAL_MAIN_SHA" "$APPLICATION_SHA"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          phase5 = os.environ["PHASE5_SHA"]
          main = os.environ["HISTORICAL_MAIN_SHA"]
          candidate = os.environ["APPLICATION_SHA"]
          phase5_tree = git("rev-parse", f"{phase5}^{{tree}}")
          matches = []
          for sha in git("rev-list", "--merges", f"{phase5}..{candidate}").splitlines():
              parents = git("rev-list", "--parents", "-n", "1", sha).split()[1:]
              if parents == [phase5, main] and git("rev-parse", f"{sha}^{{tree}}") == phase5_tree:
                  matches.append(sha)
          assert len(matches) == 1, matches
          merge_sha = matches[0]
          assert git("rev-parse", f"{merge_sha}^1") == phase5
          assert git("rev-parse", f"{merge_sha}^2") == main
          payload = {
              "result": "PASS",
              "application_sha": candidate,
              "application_parent_sha": os.environ["APPLICATION_PARENT_SHA"],
              "validation_parent_is_application": git("rev-parse", "HEAD^1") == candidate,
              "accepted_phase5_is_ancestor": True,
              "historical_main_is_ancestor": True,
              "accepted_phase5_tree_preserved": git("rev-parse", f"{merge_sha}^{{tree}}") == phase5_tree,
              "main_reconciliation_merge_sha": merge_sha,
              "main_reconciliation_merge_tree": phase5_tree,
              "validation_workflow_only_diff": True,
          }
          root = Path(os.environ["RUNNER_TEMP"]) / "production-integration-evidence"
          root.mkdir(parents=True, exist_ok=True)
          (root / "identity.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          (root / "main-reconciliation.json").write_text(json.dumps({
              "result": "PASS",
              "merge_sha": merge_sha,
              "merge_tree": phase5_tree,
              "parent_one_phase5": True,
              "parent_two_historical_main": True,
              "accepted_phase5_tree_preserved": True,
              "content_diff_from_accepted_phase5": False,
          }, indent=2, sort_keys=True) + "\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"MAIN_RECONCILIATION_MERGE_SHA={merge_sha}\n")
          PY
          echo "EVIDENCE_DIR=$RUNNER_TEMP/production-integration-r1-evidence" >> "$GITHUB_ENV"
          echo "UPLOAD_EVIDENCE_DIR=$RUNNER_TEMP/production-integration-r1-upload" >> "$GITHUB_ENV"
          echo "MAIN_MODIFIED=false" >> "$GITHUB_ENV"
          echo "FORCE_PUSH_USED=false" >> "$GITHUB_ENV"

      - name: Python, Node, ODBC Driver 18, and locked dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev >/dev/null
          odbcinst -q -d | grep -F "ODBC Driver 18 for SQL Server"
          python -m pip install -r backend/requirements.txt >/dev/null
          python -m pip check
          (cd frontend && npm ci --silent)

      - name: Account, release, foundation, and Phase5 source gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/azure/audit_account_cutover.py > "$RUNNER_TEMP/account-audit.log" 2>&1
          python -m json.tool release/a1-release-manifest.schema.json > "$RUNNER_TEMP/release-schema.json"
          APP_ENV=TEST SYNTHETIC_ONLY=true REAL_DATA_ALLOWED=false python -m pytest -q backend/tests/test_db_rebaseline.py > "$RUNNER_TEMP/account-test.log" 2>&1
          az bicep install >/dev/null 2>&1
          az bicep build --file infra/azure_sql_foundation/main.bicep --stdout > "$RUNNER_TEMP/foundation.bicep.json"
          python -m json.tool "$RUNNER_TEMP/foundation.bicep.json" >/dev/null
          test -s "$RUNNER_TEMP/foundation.bicep.json"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          account = [
              "backend/tests/test_db_rebaseline.py", "config/azure_account_binding.json",
              "frontend/tests/auth.test.ts", "release/a1-release-manifest.schema.json",
              "scripts/azure/audit_account_cutover.py", "scripts/release/verify_a1_release_manifest.py",
          ]
          foundation = [
              "infra/azure_sql_foundation/foundation.bicepparam.example", "infra/azure_sql_foundation/main.bicep",
              "infra/azure_sql_foundation/modules/budget.bicep", "infra/azure_sql_foundation/modules/core.bicep",
              "infra/azure_sql_foundation/modules/network.bicep", "infra/azure_sql_foundation/modules/private_dns.bicep",
          ]
          def blob(commit, path):
              return subprocess.check_output(["git", "rev-parse", f"{commit}:{path}"], text=True).strip()
          def work(path):
              return subprocess.check_output(["git", "hash-object", path], text=True).strip()
          assert all(blob(os.environ["ACCOUNT_REBIND_SHA"], path) == work(path) for path in account)
          assert all(blob(os.environ["FOUNDATION_SHA"], path) == work(path) for path in foundation)
          frozen = []
          for prefix in ("contracts/amec/phase5", "scripts/phase5"):
              frozen.extend(subprocess.check_output(["git", "ls-tree", "-r", "--name-only", os.environ["PHASE5_SHA"], "--", prefix], text=True).splitlines())
          frozen += ["backend/app/api/phase5.py", "backend/app/schemas/classifier_v2.py", "backend/app/services/classifier_v2.py"]
          frozen += subprocess.check_output(["git", "ls-tree", "-r", "--name-only", os.environ["PHASE5_SHA"], "--", "backend/tests/test_phase5_*", "frontend/browser-real-stack/phase5-classifier-shadow.spec.ts"], text=True).splitlines()
          frozen = sorted(set(frozen))
          assert all(blob(os.environ["PHASE5_SHA"], path) == work(path) for path in frozen)
          try:
              subprocess.check_call(["git", "cat-file", "-e", os.environ["PHASE5_SHA"] + ":infra/azure_sql_foundation"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          except subprocess.CalledProcessError:
              foundation_absent = True
          else:
              foundation_absent = False
          root = Path(os.environ["EVIDENCE_DIR"])
          (root / "source-parity.json").write_text(json.dumps({"result":"PASS", "account_path_count":6, "account_byte_parity_count":6, "foundation_path_count":6, "foundation_byte_parity_count":6, "phase5_frozen_path_mismatch_count":0}, indent=2, sort_keys=True)+"\n")
          (root / "phase5-freeze.json").write_text(json.dumps({"result":"PASS", "frozen_path_count":len(frozen), "mismatch_count":0, "accepted_source_mutated":False}, indent=2, sort_keys=True)+"\n")
          assert foundation_absent
          (root / "account-audit.result.txt").write_text("ACCOUNT_BINDING_AUDIT=PASS\n")
          (root / "release-validation.result.txt").write_text("RELEASE_MANIFEST_VALIDATION=PASS\n")
          (root / "foundation-bicep.result.json").write_text(json.dumps({"result":"PASS", "compiled_json_nonempty":True, "azure_login_executed":False}, indent=2, sort_keys=True)+"\n")
          PY
          git diff --check

      - name: Start disposable native SQL Server 2022 x64
        shell: bash
        run: |
          set -euo pipefail
          SQLSERVER_PASSWORD="$(openssl rand -hex 24)Aa!"
          echo "::add-mask::$SQLSERVER_PASSWORD"
          export SQLSERVER_PASSWORD
          echo "SQLSERVER_PASSWORD=$SQLSERVER_PASSWORD" >> "$GITHUB_ENV"
          SQL_CONTAINER="production-integration-r1-sql-${GITHUB_RUN_ID}"
          export SQL_CONTAINER
          echo "SQL_CONTAINER=$SQL_CONTAINER" >> "$GITHUB_ENV"
          docker pull --platform linux/amd64 "$SQLSERVER_IMAGE_TAG" >/dev/null
          SQLSERVER_IMAGE_REPODIGEST="$(docker image inspect "$SQLSERVER_IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          export SQLSERVER_IMAGE_REPODIGEST
          echo "$SQLSERVER_IMAGE_REPODIGEST" | grep -Eq '^mcr\.microsoft\.com/mssql/server@sha256:[0-9a-f]{64}$'
          python - <<'PY'
          import os
          value = os.environ.get("SQLSERVER_PASSWORD")
          assert value
          assert len(value) >= 20
          print("SQLSERVER_PASSWORD_CURRENT_STEP_EXPORT=PASS")
          PY
          write_sql_diagnostic() {
            local exists=false running=false container_status=absent exit_code=none oom_killed=false
            if docker inspect "$SQL_CONTAINER" >/dev/null 2>&1; then
              exists=true
              running="$(docker inspect --format '{{.State.Running}}' "$SQL_CONTAINER" 2>/dev/null || echo false)"
              container_status="$(docker inspect --format '{{.State.Status}}' "$SQL_CONTAINER" 2>/dev/null || echo unknown)"
              exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$SQL_CONTAINER" 2>/dev/null || echo unknown)"
              oom_killed="$(docker inspect --format '{{.State.OOMKilled}}' "$SQL_CONTAINER" 2>/dev/null || echo false)"
            fi
            python - "$exists" "$running" "$container_status" "$exit_code" "$oom_killed" <<'PY'
          import json, os, sys
          payload = {"container_exists": sys.argv[1] == "true", "container_running": sys.argv[2] == "true", "container_status": sys.argv[3], "container_exit_code": sys.argv[4], "container_oom_killed": sys.argv[5] == "true", "image_repo_digest": os.environ.get("SQLSERVER_IMAGE_REPODIGEST", ""), "attempt_limit": 60, "result": "FAIL"}
          path = os.path.join(os.environ["EVIDENCE_DIR"], "sqlserver-bootstrap-diagnostic.json")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True); handle.write("\n")
          PY
          }
          set +e
          docker run -d --platform linux/amd64 --name "$SQL_CONTAINER" -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$SQLSERVER_PASSWORD" -p 1433:1433 "$SQLSERVER_IMAGE_REPODIGEST" >/dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then write_sql_diagnostic; exit "$rc"; fi
          set +e
          python - <<'PY'
          import json, os, time, pyodbc
          password = os.environ["SQLSERVER_PASSWORD"]
          master = "DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=" + password + ";Encrypt=no;TrustServerCertificate=yes"
          for attempt in range(60):
              try:
                  connection = pyodbc.connect(master, autocommit=True)
                  break
              except pyodbc.Error:
                  if attempt == 59:
                      raise
                  time.sleep(2)
          cursor = connection.cursor()
          cursor.execute("SELECT CONVERT(int, SERVERPROPERTY(?))", ("ProductMajorVersion",))
          major = int(cursor.fetchone()[0])
          assert major == 16
          path = os.path.join(os.environ["EVIDENCE_DIR"], "sqlserver-bootstrap.result.json")
          payload = {"result":"PASS", "engine":"MICROSOFT_SQL_SERVER_2022_X64", "sqlserver_major":major, "image_platform":"linux/amd64", "image_repo_digest":os.environ["SQLSERVER_IMAGE_REPODIGEST"], "connection_probe":"PASS"}
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True); handle.write("\n")
          print("NATIVE_SQLSERVER_BOOTSTRAP=PASS")
          PY
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then write_sql_diagnostic; exit "$rc"; fi
      - name: Native SQL Server migration and compatibility gates
        shell: bash
        run: |
          set -euo pipefail
          make_url() { python -c 'from urllib.parse import quote; import os,sys; print("mssql+pyodbc://sa:%s@127.0.0.1:1433/%s?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes" % (quote(os.environ["SQLSERVER_PASSWORD"], safe=""), sys.argv[1]))' "$1"; }
          export DATABASE_URL="$(make_url productionintegration)"
          make_url() { python -c 'from urllib.parse import quote; import os,sys; print("mssql+pyodbc://sa:%s@127.0.0.1:1433/%s?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes" % (quote(os.environ["SQLSERVER_PASSWORD"], safe=""), sys.argv[1]))' "$1"; }
          create_db() { DB_NAME="$1" python - <<'PY'
          import os, pyodbc
          name=os.environ["DB_NAME"]
          c=pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD="+os.environ["SQLSERVER_PASSWORD"]+";Encrypt=no;TrustServerCertificate=yes",autocommit=True)
          cur=c.cursor(); cur.execute("SELECT DB_ID(?)",(name,))
          if cur.fetchone()[0] is None: cur.execute("CREATE DATABASE ["+name+"]")
          PY
          }
          create_db productionintegration
          DATABASE_URL="$(make_url productionintegration)" python -m alembic -c alembic.ini upgrade head >/dev/null
          DATABASE_URL="$(make_url productionintegration)" python - <<'PY'
          from backend.app.db import database_migration_heads
          assert database_migration_heads() == ("baseline_phase4_v36_azure_sql",)
          PY
          python - <<'PY'
          import json, os
          root = os.environ["EVIDENCE_DIR"]
          bootstrap = json.load(open(os.path.join(root, "sqlserver-bootstrap.result.json"), encoding="utf-8"))
          native = {"result":"PASS", "engine":bootstrap["engine"], "sqlserver_major":bootstrap["sqlserver_major"], "migration_pass":True, "migration_head":"baseline_phase4_v36_azure_sql", "database_schema_delta":0, "image_platform":bootstrap["image_platform"], "image_repo_digest":bootstrap["image_repo_digest"]}
          with open(os.path.join(root, "native-sqlserver.result.json"), "w", encoding="utf-8") as handle:
              json.dump(native, handle, indent=2, sort_keys=True); handle.write("\n")
          PY
          echo "APP_ENV=TEST" >> "$GITHUB_ENV"
          echo "SYNTHETIC_ONLY=true" >> "$GITHUB_ENV"
          echo "REAL_DATA_ALLOWED=false" >> "$GITHUB_ENV"
          echo "STORAGE_PROVIDER=mock" >> "$GITHUB_ENV"
          echo "SYNOLOGY_MODE=SYNTHETIC" >> "$GITHUB_ENV"
          echo "AUTH_MODE=DEV_HEADER" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/sqlserver-probes.py" <<'PY'
          import os
          from scripts.phase5.sqlserver_targeted import _probe_boolean_predicate, _probe_reflection
          def test_boolean_predicates():
              assert _probe_boolean_predicate(os.environ["DATABASE_URL"])
          def test_reflection():
              assert _probe_reflection(os.environ["DATABASE_URL"])
          PY
          python -m pytest -q backend/tests/test_phase5_sqlserver_runtime.py "$RUNNER_TEMP/sqlserver-probes.py" --junitxml="$RUNNER_TEMP/sqlserver.junit.xml" >/dev/null
          python scripts/phase5/sqlserver_targeted.py --junitxml "$RUNNER_TEMP/sqlserver.junit.xml" --bootstrap-result "$EVIDENCE_DIR/native-sqlserver.result.json" --output "$RUNNER_TEMP/sqlserver-targeted.json" >/dev/null
          cp "$RUNNER_TEMP/sqlserver-targeted.json" "$EVIDENCE_DIR/sqlserver-targeted.result.json"
          python - <<'PY'
          import json, os
          result = json.load(open(os.path.join(os.environ["EVIDENCE_DIR"], "sqlserver-targeted.result.json"), encoding="utf-8"))
          assert result["result"] == "PASS"
          assert result["engine"] == "MICROSOFT_SQL_SERVER_2022_X64"
          assert result["sqlserver_major"] == 16
          assert result["migration_pass"] is True
          assert result["migration_head"] == "baseline_phase4_v36_azure_sql"
          assert result["gate_count"] == 16 and result["failed_count"] == 0 and result["skipped_count"] == 0
          assert result["portability_probe_count"] == 2 and result["portability_probe_pass_count"] == 2
          assert result["portability_probe_fail_count"] == 0 and result["portability_probe_not_executed_count"] == 0
          assert result["native_x64"] is True and result["pyodbc_driver"] is True
          PY
          echo "SQLSERVER_MIGRATION_HEAD=baseline_phase4_v36_azure_sql" >> "$GITHUB_ENV"

      - name: Phase4, Phase5, backend, and authority regressions
        shell: bash
        run: |
          set -euo pipefail
          make_url() { python -c 'from urllib.parse import quote; import os,sys; print("mssql+pyodbc://sa:%s@127.0.0.1:1433/%s?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes" % (quote(os.environ["SQLSERVER_PASSWORD"], safe=""), sys.argv[1]))' "$1"; }
          create_db() { DB_NAME="$1" python - <<'PY'
          import os, pyodbc
          c=pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD="+os.environ["SQLSERVER_PASSWORD"]+";Encrypt=no;TrustServerCertificate=yes",autocommit=True)
          cur=c.cursor(); cur.execute("SELECT DB_ID(?)",(os.environ["DB_NAME"],))
          if cur.fetchone()[0] is None: cur.execute("CREATE DATABASE ["+os.environ["DB_NAME"]+"]")
          PY
          }
          create_db phase4integration
          DATABASE_URL="$(make_url phase4integration)" python -m alembic -c alembic.ini upgrade head >/dev/null
          DATABASE_URL="$(make_url phase4integration)" python -m pytest -q backend/tests/test_phase4_corpus_app_integration.py >/dev/null
          DATABASE_URL="$(make_url phase4integration)" python -m pytest -q backend/tests/test_phase4_corpus_app_integration.py -k 'rd_019 or rd_023 or v35_038 or v35_039' >/dev/null
          phase5_database_url="$(make_url productionintegration)"
          DATABASE_URL="$phase5_database_url" python - <<'PY'
          import os
          from sqlalchemy.engine import make_url
          from backend.app.db import database_migration_heads
          assert make_url(os.environ["DATABASE_URL"]).get_backend_name() == "mssql"
          assert database_migration_heads() == ("baseline_phase4_v36_azure_sql",)
          PY
          DATABASE_URL="$phase5_database_url" python -m pytest -q backend/tests/test_phase5_contracts.py backend/tests/test_phase5_evidence_integrity.py backend/tests/test_phase5_finalizer_negative.py >/dev/null
          DATABASE_URL="sqlite:///$RUNNER_TEMP/production-integration-backend.db" python -m pytest -q --ignore=backend/tests/test_phase5_sqlserver_runtime.py >/dev/null
          DATABASE_URL="sqlite:///$RUNNER_TEMP/production-integration-observability.db" python -m pytest -q backend/tests/test_observability.py >/dev/null
          printf '{"result":"PASS"}\n' > "$EVIDENCE_DIR/phase4-regression.result.json"
          printf '{"result":"PASS","protected_action_denial":true}\n' > "$EVIDENCE_DIR/protected-action-denial.result.json"
          printf '{"result":"PASS"}\n' > "$EVIDENCE_DIR/phase5-regression.result.json"
          printf '{"result":"PASS"}\n' > "$EVIDENCE_DIR/backend-regression.result.json"

      - name: Real SQL-backed API and browser/frontend gates
        shell: bash
        run: |
          set -euo pipefail
          make_url() { python -c 'from urllib.parse import quote; import os,sys; print("mssql+pyodbc://sa:%s@127.0.0.1:1433/%s?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes" % (quote(os.environ["SQLSERVER_PASSWORD"], safe=""), sys.argv[1]))' "$1"; }
          export DATABASE_URL="$(make_url productionintegration)"
          nohup env APP_ENV=TEST SYNTHETIC_ONLY=true REAL_DATA_ALLOWED=false DATABASE_URL="$DATABASE_URL" FRONTEND_ORIGINS=http://127.0.0.1:5173 AUTH_MODE=DEV_HEADER uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 & echo $! > "$RUNNER_TEMP/api.pid"
          for attempt in $(seq 1 60); do curl -fsS -H 'X-Dev-Role: SYSTEM_ADMIN' http://127.0.0.1:8000/api/phase5/health >/dev/null && break; test "$attempt" -lt 60 || exit 1; sleep 2; done
          nohup env BASE_URL=http://127.0.0.1:5173 npm --prefix frontend run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/frontend.log" 2>&1 & echo $! > "$RUNNER_TEMP/frontend.pid"
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; test "$attempt" -lt 60 || exit 1; sleep 2; done
          (cd frontend && BASE_URL=http://127.0.0.1:5173 npx playwright test browser-real-stack/phase5-classifier-shadow.spec.ts --config=playwright.real-stack.config.ts --reporter=line) >/dev/null
          (cd frontend && npm test -- --run) > "$RUNNER_TEMP/frontend-tests.log" 2>&1
          (cd frontend && npx tsc -b && npx vite build --outDir "$RUNNER_TEMP/production-integration-dist") > "$RUNNER_TEMP/frontend-build.log" 2>&1
          printf 'PASS\n' > "$EVIDENCE_DIR/browser.result.txt"
          printf 'PASS\n' > "$EVIDENCE_DIR/frontend-regression.result.txt"
          printf 'PASS\n' > "$EVIDENCE_DIR/frontend-production-build.result.txt"

      - name: Local production container builds and release labels
        shell: bash
        run: |
          set -euo pipefail
          backend_image="proposalops-production-integration-backend:${GITHUB_RUN_ID}"
          frontend_image="proposalops-production-integration-frontend:${GITHUB_RUN_ID}"
          docker build --platform linux/amd64 --build-arg RELEASE_SHA="$APPLICATION_SHA" -t "$backend_image" -f backend/Dockerfile . >/dev/null
          docker build --platform linux/amd64 --build-arg RELEASE_SHA="$APPLICATION_SHA" --build-arg BUILD_ID="integration-${GITHUB_RUN_ID}" --build-arg VITE_ENTRA_TENANT_ID=00000000-0000-4000-8000-000000000001 --build-arg VITE_ENTRA_WEB_CLIENT_ID=00000000-0000-4000-8000-000000000002 --build-arg VITE_ENTRA_API_CLIENT_ID=00000000-0000-4000-8000-000000000003 --build-arg VITE_API_URL=http://127.0.0.1:8000 -t "$frontend_image" -f frontend/Dockerfile frontend >/dev/null
          test "$(docker image inspect "$backend_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$APPLICATION_SHA"
          test "$(docker image inspect "$frontend_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$APPLICATION_SHA"
          printf '{"result":"PASS","backend_revision_label_match":true,"frontend_revision_label_match":true,"image_push_count":0}\n' > "$EVIDENCE_DIR/container-build.result.json"

      - name: Final safety and evidence gate
        shell: bash
        run: |
          set -euo pipefail
          test "$MAIN_MODIFIED" = false
          test "$FORCE_PUSH_USED" = false
          test "${AZURE_LOGIN_EXECUTED:-false}" = false
          test "${AZURE_RESOURCE_MUTATION_COUNT:-0}" = 0
          test "${ENTRA_MUTATION_COUNT:-0}" = 0
          test "${DEPLOYMENTS:-0}" = 0
          test "${IMAGE_PUSH_COUNT:-0}" = 0
          if [ -f artifacts/phase5-r3r1r5-semantic-mutation-matrix.json ]; then
            rm -f artifacts/phase5-r3r1r5-semantic-mutation-matrix.json
          fi
          tracked_status="$(git status --porcelain --untracked-files=no)"
          if [ "$tracked_status" = " M mock-systems/excel/permit_tracker.xlsx" ]; then
            git restore --source=HEAD -- mock-systems/excel/permit_tracker.xlsx
          elif [ -n "$tracked_status" ]; then
            printf '%s\n' "$tracked_status"
            exit 1
          fi
          test -z "$(git status --porcelain)"
          git diff --check
          printf '{"result":"PASS","azure_login_executed":false,"azure_resource_mutation_count":0,"entra_mutation_count":0,"synology_accessed":false,"smb_accessed":false,"real_amec_data_used":false,"deployments":0,"image_push_count":0,"main_modified":false,"force_push_used":false}\n' > "$EVIDENCE_DIR/safety-boundary.json"
          printf '{"result":"PASS","accepted_phase5_is_ancestor":true,"historical_main_is_ancestor":true,"accepted_phase5_tree_preserved_during_main_reconciliation":true,"account_source_byte_parity_count":6,"account_source_byte_mismatch_count":0,"foundation_source_byte_parity_count":6,"foundation_source_byte_mismatch_count":0,"phase5_frozen_path_mismatch_count":0,"account_binding_audit":"PASS","release_manifest_validation":"PASS","foundation_bicep_build":"PASS","native_sqlserver":"PASS","sqlserver_major":16,"sqlserver_migration_head":"baseline_phase4_v36_azure_sql","phase4_integration_regression":"PASS","phase5_regression":"PASS","full_backend_regression":"PASS","real_sql_backed_browser":"PASS","frontend_regression":"PASS","frontend_production_build":"PASS","backend_production_image_build":"PASS","frontend_production_image_build":"PASS","production_integration_self_accepted":false}\n' > "$EVIDENCE_DIR/summary.json"
          if rg -n -i '(SQLSERVER_PASSWORD|DATABASE_URL|access[_-]?token|bearer[[:space:]]+[A-Za-z0-9._-]+|client_secret|password=|pwd=)' "$EVIDENCE_DIR"; then
            echo 'SECRET_PATTERN_FOUND'
            exit 1
          fi
          test "$(find "$EVIDENCE_DIR" -type f | wc -l)" -ge 15
          echo 'PRODUCTION_INTEGRATION_RUNTIME_VALIDATION=PASS'

      - name: Prepare sanitized evidence package
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf "$UPLOAD_EVIDENCE_DIR"
          mkdir -p "$UPLOAD_EVIDENCE_DIR"
          allowlist=(identity.json main-reconciliation.json source-parity.json phase5-freeze.json account-audit.result.txt release-validation.result.txt foundation-bicep.result.json sqlserver-bootstrap.result.json sqlserver-bootstrap-diagnostic.json native-sqlserver.result.json sqlserver-targeted.result.json phase4-regression.result.json protected-action-denial.result.json phase5-regression.result.json backend-regression.result.json browser.result.txt frontend-regression.result.txt frontend-production-build.result.txt container-build.result.json safety-boundary.json summary.json)
          for file in "${allowlist[@]}"; do
            if [ -f "$EVIDENCE_DIR/$file" ]; then cp "$EVIDENCE_DIR/$file" "$UPLOAD_EVIDENCE_DIR/$file"; fi
          done
          if rg -n -i "(SQLSERVER_PASSWORD|DATABASE_URL|access[_-]?token|bearer[[:space:]]+[A-Za-z0-9._-]+|client_secret|password=|pwd=)" "$UPLOAD_EVIDENCE_DIR"; then
            rm -f "$UPLOAD_EVIDENCE_DIR/sqlserver-bootstrap-diagnostic.json"
          fi
          (cd "$UPLOAD_EVIDENCE_DIR" && find . -type f ! -name MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256)
          python - "$UPLOAD_EVIDENCE_DIR" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = root / "MANIFEST.sha256"
          rows = [line.strip().split("  ", 1) for line in manifest.read_text().splitlines() if line.strip()]
          mismatches = 0
          for digest, rel in rows:
              path = root / rel
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  mismatches += 1
          print("EVIDENCE_MANIFEST_MISMATCH_COUNT=" + str(mismatches))
          assert mismatches == 0
          PY
          if rg -n -i "(SQLSERVER_PASSWORD|DATABASE_URL|access[_-]?token|bearer[[:space:]]+[A-Za-z0-9._-]+|client_secret|password=|pwd=)" "$UPLOAD_EVIDENCE_DIR"; then exit 1; fi
          if rg -n "/home/runner|/Users/|/private/tmp|\\\\Users\\\\" "$UPLOAD_EVIDENCE_DIR"; then exit 1; fi
      - name: Upload sanitized production-integration evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProposalOps_Production_Integration_V1R1_Evidence
          path: ${{ env.UPLOAD_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup disposable SQL Server and application processes
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/api.pid" ]; then kill "$(cat "$RUNNER_TEMP/api.pid")" >/dev/null 2>&1 || true; fi
          if [ -f "$RUNNER_TEMP/frontend.pid" ]; then kill "$(cat "$RUNNER_TEMP/frontend.pid")" >/dev/null 2>&1 || true; fi
          if [ -n "${SQL_CONTAINER:-}" ]; then docker rm -f "$SQL_CONTAINER" >/dev/null 2>&1 || true; fi
          docker image prune -f >/dev/null 2>&1 || true
