name: ProposalOps production integration acceptance validation

on:
  push:
    branches:
      - proposalops-production-integration-acceptance-v1

permissions:
  contents: read

env:
  APPLICATION_BRANCH_PREFIX: proposalops-production-integration
  APPLICATION_BRANCH_SUFFIX: v1
  APPLICATION_SHA: eec00021a308046998d9d1df1929628f319a96d4
  APPLICATION_PARENT_SHA: 1a17b395fdaa2309a2832609486783fd1f1d8eca
  VALIDATION_BRANCH: proposalops-production-integration-acceptance-v1
  PHASE5_SHA: c42e6c449483b0951de0f366d700dbaf7b9e5525
  PHASE5_TREE: a497c6951064119453d175d1b93d4e59c9029fd0
  HISTORICAL_MAIN_SHA: 3474b35a13d27f0010ec5d03dd4a2f361ac6774d
  ACCOUNT_REBIND_SHA: 4a017b465300fc6c39b7807b24e08868479ec884
  FOUNDATION_SHA: ce8a887703ec8c15c8c781e1589e169ce395845a
  SQLSERVER_IMAGE_TAG: mcr.microsoft.com/mssql/server:2022-latest

jobs:
  validate:
    name: Production integration acceptance validation
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout immutable integration validation child
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize deterministic evidence directories and exporter
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/production-integration-internal"
          EXPORT_EVIDENCE_DIR="$RUNNER_TEMP/production-integration-export"
          rm -rf "$EVIDENCE_DIR" "$EXPORT_EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR" "$EXPORT_EVIDENCE_DIR"
          export EVIDENCE_DIR EXPORT_EVIDENCE_DIR
          echo "APPLICATION_BRANCH=${APPLICATION_BRANCH_PREFIX}-${APPLICATION_BRANCH_SUFFIX}" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          echo "EXPORT_EVIDENCE_DIR=$EXPORT_EVIDENCE_DIR" >> "$GITHUB_ENV"
          echo "INTERNAL_EVIDENCE_UPLOADED=false" >> "$GITHUB_ENV"
          echo "EXPORT_EVIDENCE_ONLY_UPLOAD=true" >> "$GITHUB_ENV"
          test -d "$EVIDENCE_DIR"
          test -d "$EXPORT_EVIDENCE_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["EVIDENCE_DIR"])
          (root / "evidence-directory.result.json").write_text(json.dumps({
              "result": "PASS", "evidence_directory_created": True,
              "export_directory_created": True, "internal_evidence_uploaded": False,
              "export_evidence_only_upload": True
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          cat > "$RUNNER_TEMP/production_integration_exporter.py" <<'PY'
          import hashlib, json, os, re, shutil, subprocess, sys
          from pathlib import Path

          source = Path(sys.argv[1])
          export = Path(sys.argv[2])
          workspace = Path(sys.argv[3])
          runner_temp = Path(sys.argv[4])
          runner_home = Path(sys.argv[5])
          repo_root = workspace
          allowlist = [
              "evidence-directory.result.json", "runner-platform.result.json", "playwright-install.result.txt",
              "identity.json", "main-reconciliation.json", "source-parity.json", "phase5-freeze.json",
              "account-audit.result.txt", "release-validation.result.txt", "foundation-bicep.result.json",
              "sqlserver-bootstrap.result.json", "native-sqlserver.result.json",
              "sqlserver-targeted.result.json", "phase4-regression.result.json", "protected-action-denial.result.json",
              "phase5-regression.result.json", "backend-regression.result.json", "observability-regression.result.json",
              "browser.result.txt", "browser-quality.result.json", "frontend-regression.result.txt",
              "frontend-production-build.result.txt", "container-build.result.json",
              "internal-evidence-hygiene.json", "safety-boundary.json", "summary.json",
          ]
          secret_re = re.compile(r"SQLSERVER_PASSWORD|DATABASE_URL|access[_-]?token|bearer\s+[A-Za-z0-9._-]+|client_secret|password=|pwd=", re.I)
          local_re = re.compile(r"/home/runner|/Users/|/private/tmp|\\Users\\")
          expected_path_files = {"browser-report.json", "browser-quality.result.json"}
          if export.exists():
              shutil.rmtree(export)
          export.mkdir(parents=True)
          rejected = []
          path_replacements = 0

          def normalize(value):
              global path_replacements
              if not isinstance(value, str):
                  return value
              roots = sorted([
                  (str(workspace), "$GITHUB_WORKSPACE"),
                  (str(runner_temp), "$RUNNER_TEMP"),
                  (str(runner_home), "$RUNNER_HOME"),
              ], key=lambda item: len(item[0]), reverse=True)
              for actual, logical in roots:
                  if actual and actual in value:
                      occurrences = value.count(actual)
                      path_replacements += occurrences
                      value = value.replace(actual, logical)
              return value

          def normalize_tree(value):
              if isinstance(value, dict):
                  return {key: normalize_tree(item) for key, item in value.items()}
              if isinstance(value, list):
                  return [normalize_tree(item) for item in value]
              return normalize(value)

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def write_json(path, payload):
              path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          def scan_internal():
              path_files = []
              secret_matches = 0
              for path in sorted(source.iterdir()) if source.exists() else []:
                  if not path.is_file():
                      continue
                  text = path.read_text(encoding="utf-8", errors="strict")
                  if secret_re.search(text):
                      secret_matches += 1
                  if local_re.search(text):
                      path_files.append(path.name)
              unexpected = sorted(set(path_files) - expected_path_files)
              hygiene = {
                  "result": "PASS" if secret_matches == 0 and not unexpected else "FAIL",
                  "internal_expected_path_bearing_files": sorted(expected_path_files),
                  "internal_local_path_files": sorted(path_files),
                  "internal_unexpected_local_path_file_count": len(unexpected),
                  "internal_secret_pattern_match_count": secret_matches,
              }
              write_json(source / "internal-evidence-hygiene.json", hygiene)
              if secret_matches != 0 or unexpected:
                  raise SystemExit("unexpected internal evidence hygiene finding")

          scan_internal()
          raw_path = source / "browser-report.json"
          quality_path = source / "browser-quality.result.json"
          if raw_path.is_file():
              raw_payload = json.loads(raw_path.read_text(encoding="utf-8"))
              sanitized_payload = normalize_tree(raw_payload)
              sanitized_path = export / "browser-report.sanitized.json"
              write_json(sanitized_path, sanitized_payload)
              quality_oracle = runner_temp / "browser-quality-sanitized.json"
              spec = repo_root / "frontend/browser-real-stack/phase5-classifier-shadow.spec.ts"
              subprocess.run([
                  sys.executable, str(repo_root / "scripts/phase5/browser_evidence.py"),
                  "--playwright-json", str(sanitized_path), "--spec", str(spec),
                  "--output", str(quality_oracle),
              ], check=True)
              original_quality = json.loads(quality_path.read_text(encoding="utf-8")) if quality_path.is_file() else {}
              oracle_quality = json.loads(quality_oracle.read_text(encoding="utf-8"))
              original_compare = dict(original_quality)
              oracle_compare = dict(oracle_quality)
              original_compare.pop("report_path", None)
              oracle_compare.pop("report_path", None)
              assert original_compare == oracle_compare
              exported_quality = dict(original_quality)
              exported_quality["report_path"] = "browser-report.sanitized.json"
              write_json(export / "browser-quality.result.json", exported_quality)
              lineage = {
                  "source_browser_report": "browser-report.json",
                  "source_browser_report_sha256": digest(raw_path),
                  "export_browser_report": "browser-report.sanitized.json",
                  "export_browser_report_sha256": digest(sanitized_path),
                  "path_replacement_count": path_replacements,
                  "semantic_equivalence": "PASS",
                  "non_path_field_mismatch_count": 0,
              }
              write_json(export / "browser-export-lineage.json", lineage)
              print("BROWSER_SANITIZED_SEMANTIC_EQUIVALENCE=PASS")
              print("BROWSER_QUALITY_NON_PATH_FIELD_MISMATCH_COUNT=0")
          elif quality_path.is_file():
              raise SystemExit("browser-quality exists without browser report")

          transformations = {}
          for name in allowlist:
              path = source / name
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8", errors="strict")
              if name == "browser-quality.result.json":
                  continue
              if secret_re.search(text) or local_re.search(text):
                  rejected.append(name)
                  continue
              target = export / name
              shutil.copyfile(path, target)
              transformations[name] = "byte-for-byte"
          if rejected:
              raise SystemExit("portable exporter rejected ordinary evidence")
          if (export / "browser-quality.result.json").is_file():
              transformations["browser-quality.result.json"] = "report_path-only"
          if (export / "browser-report.sanitized.json").is_file():
              transformations["browser-report.sanitized.json"] = "local-path-prefix-normalization"
          if (export / "browser-export-lineage.json").is_file():
              transformations["browser-export-lineage.json"] = "generated-lineage"

          export_map = {}
          for path in sorted(export.iterdir()):
              if path.is_file():
                  export_map[path.name] = {
                      "source_logical_member": path.name,
                      "source_sha256": digest(source / path.name) if (source / path.name).is_file() else None,
                      "export_logical_member": path.name,
                      "export_sha256": digest(path),
                      "transformation_type": transformations.get(path.name, "generated"),
                  }
          write_json(export / "export-map.json", export_map)
          package_status = {
              "result": "PASS",
              "rejected_file_count": 0,
              "transformation_non_browser_count": sum(1 for value in transformations.values() if value not in {"byte-for-byte", "report_path-only", "local-path-prefix-normalization", "generated-lineage"}),
          }
          write_json(export / "package-status.json", package_status)
          manifest = export / "MANIFEST.sha256"
          members = sorted(path for path in export.iterdir() if path.is_file() and path.name != "MANIFEST.sha256")
          manifest.write_text("".join(digest(path) + "  " + path.name + "\n" for path in members), encoding="utf-8")
          required_export_members = {
              "evidence-directory.result.json", "runner-platform.result.json", "playwright-install.result.txt",
              "identity.json", "main-reconciliation.json", "source-parity.json", "phase5-freeze.json",
              "account-audit.result.txt", "release-validation.result.txt", "foundation-bicep.result.json",
              "sqlserver-bootstrap.result.json", "native-sqlserver.result.json", "sqlserver-targeted.result.json",
              "phase4-regression.result.json", "protected-action-denial.result.json", "phase5-regression.result.json",
              "backend-regression.result.json", "observability-regression.result.json", "browser.result.txt",
              "browser-report.sanitized.json", "browser-quality.result.json", "browser-export-lineage.json",
              "frontend-regression.result.txt", "frontend-production-build.result.txt", "container-build.result.json",
              "internal-evidence-hygiene.json", "safety-boundary.json", "summary.json", "export-map.json",
              "package-status.json", "MANIFEST.sha256",
          }
          actual_export_members = {path.name for path in export.iterdir() if path.is_file()}
          missing_export_members = sorted(required_export_members - actual_export_members)
          unexpected_export_members = sorted(actual_export_members - required_export_members)
          if missing_export_members or unexpected_export_members:
              raise SystemExit("exact export member set mismatch")
          rows = [line.split("  ", 1) for line in manifest.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert all(len(row) == 2 and row[1] != "-" and not Path(row[1]).is_absolute() for row in rows)
          names = {row[1] for row in rows}
          actual = {path.name for path in export.iterdir() if path.is_file() and path.name != "MANIFEST.sha256"}
          missing = sorted(actual - names)
          extra = sorted(names - actual)
          mismatches = sum(1 for digest_value, name in rows if not (export / name).is_file() or digest(export / name) != digest_value)
          final_secret = sum(1 for path in export.iterdir() if path.is_file() and secret_re.search(path.read_text(encoding="utf-8", errors="strict")))
          final_local = sum(1 for path in export.iterdir() if path.is_file() and local_re.search(path.read_text(encoding="utf-8", errors="strict")))
          assert not missing and not extra and mismatches == 0 and final_secret == 0 and final_local == 0
          print("PACKAGE_STATUS=PASS")
          print("EVIDENCE_MANIFEST_MISMATCH_COUNT=0")
          print("EVIDENCE_MANIFEST_MISSING_COUNT=0")
          print("EVIDENCE_MANIFEST_EXTRA_COUNT=0")
          print("EVIDENCE_SECRET_PATTERN_MATCH_COUNT=0")
          print("EVIDENCE_LOCAL_ABSOLUTE_PATH_MATCH_COUNT=0")
          print("MANIFEST_DASH_PATH_COUNT=0")
          PY
          chmod 700 "$RUNNER_TEMP/production_integration_exporter.py"
      - name: Identity, ancestry, and one-workflow binding gate
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          cat > "$RUNNER_TEMP/production_integration_identity_gate.py" <<'PY'
          import json, os, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          repository = os.environ["GITHUB_REPOSITORY"]
          workflow_ref = os.environ["GITHUB_WORKFLOW_REF"]
          repo_prefix = repository + "/"
          assert workflow_ref.startswith(repo_prefix)
          self_path = workflow_ref[len(repo_prefix):].split("@", 1)[0]
          assert self_path == ".github/workflows/production-integration-acceptance.yml"

          application = os.environ["APPLICATION_SHA"]
          application_parent = os.environ["APPLICATION_PARENT_SHA"]
          application_branch = os.environ["APPLICATION_BRANCH"]
          assert os.environ["GITHUB_REF_NAME"] == os.environ["VALIDATION_BRANCH"]
          assert git("rev-parse", "HEAD^1") == application
          assert git("rev-parse", "HEAD^1^1") == application_parent
          assert git("rev-parse", f"refs/remotes/origin/{application_branch}") == application
          assert git("rev-parse", f"{application}^{{tree}}") == "495ad6e642076c36f65118f10a2b0fe37709fa2f"
          assert git("rev-parse", "refs/remotes/origin/main") == os.environ["HISTORICAL_MAIN_SHA"]
          changed = git("diff", "--name-only", application, "HEAD").splitlines()
          assert changed == [self_path], changed
          assert git("rev-parse", f"{os.environ['PHASE5_SHA']}^{{tree}}") == os.environ["PHASE5_TREE"]
          subprocess.check_call(["git", "merge-base", "--is-ancestor", os.environ["PHASE5_SHA"], application])
          subprocess.check_call(["git", "merge-base", "--is-ancestor", os.environ["HISTORICAL_MAIN_SHA"], application])

          phase5 = os.environ["PHASE5_SHA"]
          historical_main = os.environ["HISTORICAL_MAIN_SHA"]
          matches = []
          for merge_sha in git("rev-list", "--merges", f"{phase5}..{application}").splitlines():
              parents = git("rev-list", "--parents", "-n", "1", merge_sha).split()[1:]
              if parents == [phase5, historical_main] and git("rev-parse", f"{merge_sha}^{{tree}}") == os.environ["PHASE5_TREE"]:
                  matches.append(merge_sha)
          assert len(matches) == 1, matches
          merge_sha = matches[0]
          assert git("rev-parse", f"{merge_sha}^1") == phase5
          assert git("rev-parse", f"{merge_sha}^2") == historical_main

          root = Path(os.environ["EVIDENCE_DIR"])
          (root / "identity.json").write_text(json.dumps({
              "result": "PASS",
              "application_sha": application,
              "application_parent_sha": application_parent,
              "validation_parent_is_application": git("rev-parse", "HEAD^1") == application,
              "validation_workflow_path": self_path,
              "validation_workflow_only_diff": changed == [self_path],
              "accepted_phase5_is_ancestor": True,
              "historical_main_is_ancestor": True,
              "accepted_phase5_tree": os.environ["PHASE5_TREE"],
              "main_reconciliation_merge_sha": merge_sha,
              "main_reconciliation_merge_tree": os.environ["PHASE5_TREE"],
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (root / "main-reconciliation.json").write_text(json.dumps({
              "result": "PASS", "merge_sha": merge_sha,
              "merge_tree": os.environ["PHASE5_TREE"],
              "parent_one_phase5": True, "parent_two_historical_main": True,
              "accepted_phase5_tree_preserved": True,
              "content_diff_from_accepted_phase5": False
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          chmod 700 "$RUNNER_TEMP/production_integration_identity_gate.py"
          python "$RUNNER_TEMP/production_integration_identity_gate.py"
          echo "MAIN_MODIFIED=false" >> "$GITHUB_ENV"
          echo "FORCE_PUSH_USED=false" >> "$GITHUB_ENV"
          echo "APPLICATION_BRANCH_MOVED=false" >> "$GITHUB_ENV"
      - name: Python, Node, ODBC Driver 18, and locked dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pin Node 22 for frontend validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
          odbcinst -q -d | grep -F "ODBC Driver 18 for SQL Server"
          python -m pip install -r backend/requirements.txt
          python -m pip check
          (cd frontend && npm ci --silent)
          python - <<'PY'
          import json, platform
          from pathlib import Path
          Path(__import__("os").environ["EVIDENCE_DIR"] + "/runner-platform.result.json").write_text(json.dumps({
              "result": "PASS", "runner_platform": platform.platform(),
              "architecture": platform.machine(), "native_x64": platform.machine() == "x86_64",
              "odbc_driver_18_ready": True, "python_3_12_ready": True,
              "npm_ci_ready": True
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Explicit Playwright Chromium installation
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          (cd frontend && npx playwright install --with-deps chromium)
          printf 'PASS\n' > "$EVIDENCE_DIR/playwright-install.result.txt"

      - name: Account, release, foundation, and Phase5 source gates
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          python scripts/azure/audit_account_cutover.py > "$RUNNER_TEMP/account-audit.log"
          python -m json.tool release/a1-release-manifest.schema.json > "$RUNNER_TEMP/release-schema.json"
          APP_ENV=TEST SYNTHETIC_ONLY=true REAL_DATA_ALLOWED=false python -m pytest -q backend/tests/test_db_rebaseline.py > "$RUNNER_TEMP/account-test.log"
          az bicep install
          az bicep build --file infra/azure_sql_foundation/main.bicep --stdout > "$RUNNER_TEMP/foundation.bicep.json"
          python -m json.tool "$RUNNER_TEMP/foundation.bicep.json" >/dev/null
          test -s "$RUNNER_TEMP/foundation.bicep.json"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          account = [
              "backend/tests/test_db_rebaseline.py", "config/azure_account_binding.json",
              "frontend/tests/auth.test.ts", "release/a1-release-manifest.schema.json",
              "scripts/azure/audit_account_cutover.py", "scripts/release/verify_a1_release_manifest.py",
          ]
          foundation = [
              "infra/azure_sql_foundation/foundation.bicepparam.example", "infra/azure_sql_foundation/main.bicep",
              "infra/azure_sql_foundation/modules/budget.bicep", "infra/azure_sql_foundation/modules/core.bicep",
              "infra/azure_sql_foundation/modules/network.bicep", "infra/azure_sql_foundation/modules/private_dns.bicep",
          ]
          def blob(commit, path):
              return subprocess.check_output(["git", "rev-parse", f"{commit}:{path}"], text=True).strip()
          def work(path):
              return subprocess.check_output(["git", "hash-object", path], text=True).strip()
          assert all(blob(os.environ["ACCOUNT_REBIND_SHA"], path) == work(path) for path in account)
          assert all(blob(os.environ["FOUNDATION_SHA"], path) == work(path) for path in foundation)
          frozen = []
          for prefix in ("contracts/amec/phase5", "scripts/phase5"):
              frozen.extend(subprocess.check_output(["git", "ls-tree", "-r", "--name-only", os.environ["PHASE5_SHA"], "--", prefix], text=True).splitlines())
          frozen += ["backend/app/api/phase5.py", "backend/app/schemas/classifier_v2.py", "backend/app/services/classifier_v2.py"]
          frozen += subprocess.check_output(["git", "ls-tree", "-r", "--name-only", os.environ["PHASE5_SHA"], "--", "backend/tests/test_phase5_*", "frontend/browser-real-stack/phase5-classifier-shadow.spec.ts"], text=True).splitlines()
          frozen = sorted(set(frozen))
          assert all(blob(os.environ["PHASE5_SHA"], path) == work(path) for path in frozen)
          try:
              subprocess.check_call(["git", "cat-file", "-e", os.environ["PHASE5_SHA"] + ":infra/azure_sql_foundation"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          except subprocess.CalledProcessError:
              foundation_absent = True
          else:
              foundation_absent = False
          assert foundation_absent
          root = Path(os.environ["EVIDENCE_DIR"])
          (root / "source-parity.json").write_text(json.dumps({
              "result": "PASS", "account_path_count": 6, "account_source_byte_parity_count": 6,
              "account_source_byte_mismatch_count": 0, "foundation_path_count": 6,
              "foundation_source_byte_parity_count": 6, "foundation_source_byte_mismatch_count": 0,
              "phase5_frozen_path_mismatch_count": 0
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (root / "phase5-freeze.json").write_text(json.dumps({
              "result": "PASS", "frozen_path_count": len(frozen),
              "mismatch_count": 0, "accepted_source_mutated": False
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (root / "account-audit.result.txt").write_text("ACCOUNT_BINDING_AUDIT=PASS\n", encoding="utf-8")
          (root / "release-validation.result.txt").write_text("RELEASE_MANIFEST_VALIDATION=PASS\n", encoding="utf-8")
          (root / "foundation-bicep.result.json").write_text(json.dumps({
              "result": "PASS", "compiled_json_nonempty": True, "azure_login_executed": False
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Start disposable native SQL Server 2022 x64
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          SQLSERVER_PASSWORD="$(openssl rand -hex 24)Aa!"
          echo "::add-mask::$SQLSERVER_PASSWORD"
          export SQLSERVER_PASSWORD
          echo "SQLSERVER_PASSWORD=$SQLSERVER_PASSWORD" >> "$GITHUB_ENV"
          SQL_CONTAINER="production-integration-sql-${GITHUB_RUN_ID}"
          export SQL_CONTAINER
          echo "SQL_CONTAINER=$SQL_CONTAINER" >> "$GITHUB_ENV"
          docker pull --platform linux/amd64 "$SQLSERVER_IMAGE_TAG"
          SQLSERVER_IMAGE_REPODIGEST="$(docker image inspect "$SQLSERVER_IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          export SQLSERVER_IMAGE_REPODIGEST
          echo "$SQLSERVER_IMAGE_REPODIGEST" | grep -Eq '^mcr\.microsoft\.com/mssql/server@sha256:[0-9a-f]{64}$'
          echo "SQLSERVER_IMAGE_REPODIGEST=$SQLSERVER_IMAGE_REPODIGEST" >> "$GITHUB_ENV"
          python - <<'PY'
          import os
          value = os.environ.get("SQLSERVER_PASSWORD")
          assert value and len(value) >= 20
          print("SQLSERVER_PASSWORD_CURRENT_STEP_EXPORT=PASS")
          PY
          write_sql_diagnostic() {
            local exists=false running=false container_status=absent exit_code=none oom_killed=false
            if docker inspect "$SQL_CONTAINER" >/dev/null 2>&1; then
              exists=true
              running="$(docker inspect --format '{{.State.Running}}' "$SQL_CONTAINER" 2>/dev/null || echo false)"
              container_status="$(docker inspect --format '{{.State.Status}}' "$SQL_CONTAINER" 2>/dev/null || echo unknown)"
              exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$SQL_CONTAINER" 2>/dev/null || echo unknown)"
              oom_killed="$(docker inspect --format '{{.State.OOMKilled}}' "$SQL_CONTAINER" 2>/dev/null || echo false)"
            fi
            python - "$exists" "$running" "$container_status" "$exit_code" "$oom_killed" <<'PY'
          import json, os, sys
          payload = {
              "container_exists": sys.argv[1] == "true", "container_running": sys.argv[2] == "true",
              "container_status": sys.argv[3], "container_exit_code": sys.argv[4],
              "container_oom_killed": sys.argv[5] == "true",
              "image_repo_digest": os.environ.get("SQLSERVER_IMAGE_REPODIGEST", ""),
              "attempt_limit": 60, "result": "FAIL"
          }
          with open(os.path.join(os.environ["EVIDENCE_DIR"], "sqlserver-bootstrap-diagnostic.json"), "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True); handle.write("\n")
          PY
          }
          if ! docker run -d --platform linux/amd64 --name "$SQL_CONTAINER" -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$SQLSERVER_PASSWORD" -p 1433:1433 "$SQLSERVER_IMAGE_REPODIGEST" >/dev/null; then
            write_sql_diagnostic
            exit 1
          fi
          if ! python - <<'PY'
          import os, time, pyodbc
          password = os.environ["SQLSERVER_PASSWORD"]
          master = "DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=" + password + ";Encrypt=no;TrustServerCertificate=yes"
          for attempt in range(60):
              try:
                  connection = pyodbc.connect(master, autocommit=True)
                  break
              except pyodbc.Error:
                  if attempt == 59:
                      raise
                  time.sleep(2)
          cursor = connection.cursor()
          cursor.execute("SELECT CONVERT(int, SERVERPROPERTY(?))", ("ProductMajorVersion",))
          major = int(cursor.fetchone()[0])
          assert major == 16
          import json
          with open(os.path.join(os.environ["EVIDENCE_DIR"], "sqlserver-bootstrap.result.json"), "w", encoding="utf-8") as handle:
              json.dump({"result":"PASS", "engine":"MICROSOFT_SQL_SERVER_2022_X64", "sqlserver_major":major, "image_platform":"linux/amd64", "image_repo_digest":os.environ["SQLSERVER_IMAGE_REPODIGEST"], "connection_probe":"PASS"}, handle, indent=2, sort_keys=True); handle.write("\n")
          print("NATIVE_SQLSERVER_BOOTSTRAP=PASS")
          PY
          then
            write_sql_diagnostic
            exit 1
          fi

