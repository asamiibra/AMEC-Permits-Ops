              "real_amec_data_used": False, "deployments": 0,
              "image_push_count": producers["container-build.result.json"]["image_push_count"],
              "main_modified": False, "force_push_used": False,
              "git_diff_check": "PASS", "internal_evidence_uploaded": False,
              "export_evidence_only_upload": True
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (root / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("SUMMARY_LITERAL_PASS_FALLBACK_COUNT=0")
          print("SUMMARY_INPUT_MISSING_COUNT=0")
          print("SUMMARY_INPUT_FAIL_COUNT=0")
          print("SUMMARY_DERIVATION=PASS")
          print("INTERNAL_SECRET_PATTERN_MATCH_COUNT=0")
          print("INTERNAL_UNEXPECTED_LOCAL_PATH_FILE_COUNT=0")
          print("PRODUCTION_INTEGRATION_RUNTIME_VALIDATION=PASS")
          PY
      - name: Prepare portable evidence export
        id: package
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="${EVIDENCE_DIR:-$RUNNER_TEMP/production-integration-internal}"
          EXPORT_EVIDENCE_DIR="${EXPORT_EVIDENCE_DIR:-$RUNNER_TEMP/production-integration-export}"
          export EVIDENCE_DIR EXPORT_EVIDENCE_DIR
          mkdir -p "$EVIDENCE_DIR" "$EXPORT_EVIDENCE_DIR"
          python "$RUNNER_TEMP/production_integration_exporter.py" "$EVIDENCE_DIR" "$EXPORT_EVIDENCE_DIR" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$HOME"
      - name: Upload portable production-integration evidence only
        if: success() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ProposalOps_Production_Integration_Acceptance_Evidence
          path: ${{ env.EXPORT_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
      - name: Cleanup disposable SQL Server and application processes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/api.pid" ]; then kill "$(cat "$RUNNER_TEMP/api.pid")" >/dev/null 2>&1 || :; fi
          if [ -f "$RUNNER_TEMP/frontend.pid" ]; then kill "$(cat "$RUNNER_TEMP/frontend.pid")" >/dev/null 2>&1 || :; fi
          if [ -n "${SQL_CONTAINER:-}" ]; then docker rm -f "$SQL_CONTAINER" >/dev/null 2>&1 || :; fi
          docker image prune -f >/dev/null 2>&1 || :
