name: T6-B native x64 SQL catalog-SQL final execute canary fix

on:
  push:
    branches:
      - t6b-native-x64-sql-catalog-final-execute-canaryfix-v1
    paths:
      - .github/workflows/t6b-native-x64-sql-catalog-final-execute-canaryfix.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      INPUT_TAG: t6b-native-x64-catalog-sql-final-inputs-20260907
      T6B_ARCHIVE_NAME: ProposalOps_SYN_T6B_APPLICATION_PERSISTENCE_CONSUMER_CATALOG_SQL_FINAL_20260907.tar.gz
      T6B_SHA: d692486b1bfc1ea3e2db858b8698f1d884a07059fc05cb5dafef5ebfe6dcc9da
      T6B_BYTES: "15864"
      RUNNER_SHA: 0405aa32d09ddcfb692e29536f8af5aab008ab26c630f0b7eddefa9f37b32fad
      RUNNER_BYTES: "35212"
      ROOT_CAUSE_SHA: d263cb3c6f32b2c057da65fd5700f1733aad2f182e49bcda59f03b53c96525b6
      ROOT_CAUSE_BYTES: "1610"
      T6A_SHA: 8f5f1b64091d3c9b943dc092773b12794eb5af3ee1a7bb7c5eab7e6475f7f6e2
      T6A_BYTES: "92139101"
      RETURN_SHA: 933c43465e56d6c2a1b51a83692c4cba7038118c1c4f54b5dfce504bbba546cc
      RETURN_BYTES: "1999"
      PHASE5_COMMIT: c42e6c449483b0951de0f366d700dbaf7b9e5525
      PHASE5_TREE: a497c6951064119453d175d1b93d4e59c9029fd0
      IMAGE: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
      VALIDATION_BRANCH: t6b-native-x64-sql-catalog-final-execute-canaryfix-v1
      WORKFLOW_PATH: .github/workflows/t6b-native-x64-sql-catalog-final-execute-canaryfix.yml

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce one-shot push event and exact lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = "refs/heads/$VALIDATION_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$PHASE5_COMMIT"
          test "$(git diff --name-only "$PHASE5_COMMIT" HEAD)" = "$WORKFLOW_PATH"

      - name: Prove native x64 Linux host
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(dpkg --print-architecture)" = amd64
          docker info --format '{{.OSType}} {{.Architecture}}'
          docker_arch="$(docker info --format '{{.Architecture}}')"
          docker_os="$(docker info --format '{{.OSType}}')"
          test "$docker_os" = linux
          test "$docker_arch" = x86_64
          qemu_active=false
          if [ -r /proc/sys/fs/binfmt_misc/qemu-x86_64 ] && grep -q '^enabled' /proc/sys/fs/binfmt_misc/qemu-x86_64; then qemu_active=true; fi
          test "$qemu_active" = false
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          qemu = Path('/proc/sys/fs/binfmt_misc/qemu-x86_64')
          proof = {
              'runner_os': os.environ['RUNNER_OS'],
              'runner_arch': os.environ['RUNNER_ARCH'],
              'uname_s': platform.system(),
              'uname_m': platform.machine(),
              'dpkg_arch': subprocess.check_output(['dpkg', '--print-architecture'], text=True).strip(),
              'kernel': platform.release(),
              'docker_server_arch': subprocess.check_output(['docker', 'info', '--format', '{{.Architecture}}'], text=True).strip(),
              'docker_server_os': subprocess.check_output(['docker', 'info', '--format', '{{.OSType}}'], text=True).strip(),
              'qemu_binfmt_active': bool(qemu.exists() and 'enabled' in qemu.read_text()),
              'emulation_used': False,
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'native_x64_linux_host': True,
          }
          Path(os.environ['RUNNER_TEMP'], 'T6B_NATIVE_X64_HOST_PROOF.json').write_text(json.dumps(proof, sort_keys=True, indent=2) + '\n')
          PY

      - name: Prove validation parent and clean accepted Phase5
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$PHASE5_COMMIT"
          test "$(git diff --name-only "$PHASE5_COMMIT" HEAD)" = "$WORKFLOW_PATH"
          git status --porcelain
          test -z "$(git status --porcelain)"
          phase5="$RUNNER_TEMP/accepted-phase5"
          git worktree add --detach "$phase5" "$PHASE5_COMMIT"
          test "$(git -C "$phase5" rev-parse HEAD)" = "$PHASE5_COMMIT"
          test "$(git -C "$phase5" rev-parse HEAD^{tree})" = "$PHASE5_TREE"
          test -z "$(git -C "$phase5" status --porcelain)"
          echo "T6B_PHASE5_ROOT=$phase5" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SQL Server ODBC driver and Phase5 dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -o "$RUNNER_TEMP/packages-microsoft-prod.deb"
          sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
          sudo apt-get update
          sudo ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get install -y msodbcsql18 unixodbc-dev
          python -m pip install --upgrade pip
          python -m pip install -r "$T6B_PHASE5_ROOT/backend/requirements.txt"
          python -m pip check
          python - <<'PY'
          import pyodbc, sqlalchemy, alembic
          assert pyodbc.version == '5.3.0', pyodbc.version
          assert 'ODBC Driver 18 for SQL Server' in pyodbc.drivers()
          print('PYTHON_ODBC_DEPENDENCIES=PASS')
          PY

      - name: Download and verify immutable inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          input_dir="$RUNNER_TEMP/t6b-inputs"
          mkdir -p "$input_dir"
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --dir "$input_dir"
          test "$(find "$input_dir" -maxdepth 1 -type f | wc -l)" -eq 3
          test -f "$input_dir/$T6B_ARCHIVE_NAME"
          test -f "$input_dir/ProposalOps_SYN_T6A_RECOVERY_R4_CANDIDATE.tar.gz"
          test -f "$input_dir/T6A_ATTEMPT3_SANITIZED_RETURN.tar.gz"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])/'t6b-inputs'
          expected={
            't6b_consumer':(os.environ['T6B_ARCHIVE_NAME'],os.environ['T6B_SHA'],int(os.environ['T6B_BYTES'])),
            't6a_candidate':('ProposalOps_SYN_T6A_RECOVERY_R4_CANDIDATE.tar.gz',os.environ['T6A_SHA'],int(os.environ['T6A_BYTES'])),
            't6a_return':('T6A_ATTEMPT3_SANITIZED_RETURN.tar.gz',os.environ['RETURN_SHA'],int(os.environ['RETURN_BYTES'])),
          }
          proof={}
          for key,(name,want,size) in expected.items():
              p=d/name
              data=p.read_bytes()
              got=hashlib.sha256(data).hexdigest()
              assert got==want and len(data)==size,(key,got,len(data))
              proof[key]={'name':name,'sha256':got,'bytes':len(data)}
          Path(os.environ['RUNNER_TEMP'],'T6B_INPUT_IDENTITY_PROOF.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          PY

      - name: Verify frozen consumer without database access
        shell: bash
        run: |
          set -euo pipefail
          input_dir="$RUNNER_TEMP/t6b-inputs"
          extract="$RUNNER_TEMP/t6b-extract"
          mkdir -p "$extract"
          python - "$input_dir/$T6B_ARCHIVE_NAME" "$extract" <<'PY'
          import hashlib, json, os, sys, tarfile
          from pathlib import Path
          archive=Path(sys.argv[1]); destination=Path(sys.argv[2])
          with tarfile.open(archive,'r:gz') as tf:
              members=tf.getmembers()
              unsafe=[]
              for m in members:
                  n=Path(m.name)
                  if n.is_absolute() or '..' in n.parts or m.issym() or m.islnk() or not (m.isdir() or m.isfile()): unsafe.append(m.name)
              roots={Path(m.name).parts[0] for m in members if m.name}
              assert roots=={'ProposalOps_SYN_T6B_APPLICATION_PERSISTENCE_CONSUMER'} and not unsafe
              for m in members:
                  target=destination/m.name
                  if m.isdir(): target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(tf.extractfile(m).read())
          root=destination/'ProposalOps_SYN_T6B_APPLICATION_PERSISTENCE_CONSUMER'
          os.chdir(root)
          lines=(root/'MANIFEST.sha256').read_text().splitlines()
          for line in lines:
              if not line.strip(): continue
              want,name=line.split('  ',1); p=root/name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==want
          proof={'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'archive_bytes':archive.stat().st_size,'unsafe_member_count':len(unsafe),'manifest':'PASS'}
          (Path(os.environ['RUNNER_TEMP'])/'T6B_FROZEN_INPUT_PROOF.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          PY
          PYTHONPATH="$extract/ProposalOps_SYN_T6B_APPLICATION_PERSISTENCE_CONSUMER" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from t6b import consumer, qualification
          root=Path(qualification.__file__).parent.parent
          expected={'consumer.py':('6689959f300461e2b7eba669728c59c02251362d36bba4e853bdcfbd9ef32778',18389),'qualification.py':(os.environ['RUNNER_SHA'],int(os.environ['RUNNER_BYTES'])),'sqlserver_gate.py':('0f3b7552445754cbb2af195be6e26848562a176756f63bc2ceee10681aff2834',2133)}
          for name,(want,size) in expected.items():
              p=root/'t6b'/name; assert hashlib.sha256(p.read_bytes()).hexdigest()==want and p.stat().st_size==size
          report=root/'T6B_SCHEMA_FINGERPRINT_ROOT_CAUSE.json'; assert hashlib.sha256(report.read_bytes()).hexdigest()==os.environ['ROOT_CAUSE_SHA'] and report.stat().st_size==int(os.environ['ROOT_CAUSE_BYTES'])
          from shutil import copyfile
          copyfile(report, Path(os.environ['RUNNER_TEMP'])/'T6B_SCHEMA_FINGERPRINT_ROOT_CAUSE.json')
          qualification._verify_frozen_implementation_binding()
          assert qualification._reflection_source_audit()=={'SQLALCHEMY_INSPECT_CALL_COUNT':0,'METADATA_REFLECT_CALL_COUNT':0,'GET_COLUMNS_CALL_COUNT':0,'GET_UNIQUE_CONSTRAINTS_CALL_COUNT':0}
          assert all(qualification._assert_schema_mutation_sensitivity().values())
          alias_audit=qualification._catalog_sql_alias_audit()
          assert alias_audit['catalog_query_count']==6
          assert alias_audit['catalog_select_output_alias_count']==42
          assert alias_audit['catalog_unquoted_output_alias_count']==0
          assert alias_audit['catalog_reserved_alias_collision_count']==0
          assert alias_audit['catalog_expected_result_key_mismatch_count']==0
          semantics=qualification._schema_document_semantics_audit()
          assert not any(semantics.values())
          temp=Path(os.environ['RUNNER_TEMP'])
          (temp/'T6B_CATALOG_SQL_INVENTORY.json').write_text(json.dumps({'queries':alias_audit['queries'],'catalog_query_count':alias_audit['catalog_query_count'],'catalog_select_output_alias_count':alias_audit['catalog_select_output_alias_count']},sort_keys=True,indent=2)+'\n')
          (temp/'T6B_CATALOG_ALIAS_AUDIT.json').write_text(json.dumps({'catalog_unquoted_output_alias_count':alias_audit['catalog_unquoted_output_alias_count'],'catalog_reserved_alias_collision_count':alias_audit['catalog_reserved_alias_collision_count'],'catalog_expected_result_key_mismatch_count':alias_audit['catalog_expected_result_key_mismatch_count'],'semantics_audit':semantics,'queries':alias_audit['queries']},sort_keys=True,indent=2)+'\n')
          (temp/'T6B_CATALOG_SQL_CHANGED_PATHS.json').write_text(json.dumps({'changed_paths':['t6b/qualification.py','MANIFEST.sha256'],'business_consumer_changed':False,'sqlserver_gate_changed':False,'phase5_changed':False,'t6a_changed':False,'migration_changed':False},sort_keys=True,indent=2)+'\n')
          print('FROZEN_IMPLEMENTATION_BINDING=PASS')
          print('SQLALCHEMY_INSPECT_CALL_COUNT=0')
          print('METADATA_REFLECT_CALL_COUNT=0')
          print('GET_COLUMNS_CALL_COUNT=0')
          print('GET_UNIQUE_CONSTRAINTS_CALL_COUNT=0')
          print('SCHEMA_FINGERPRINT_MUTATION_SENSITIVITY=PASS')
          print('CATALOG_QUERY_COUNT=6')
          print('CATALOG_SELECT_OUTPUT_ALIAS_COUNT=42')
          print('CATALOG_UNQUOTED_OUTPUT_ALIAS_COUNT=0')
          print('CATALOG_RESERVED_ALIAS_COLLISION_COUNT=0')
          print('CATALOG_EXPECTED_RESULT_KEY_MISMATCH_COUNT=0')
          PY
          echo "T6B_EXTRACT_ROOT=$extract/ProposalOps_SYN_T6B_APPLICATION_PERSISTENCE_CONSUMER" >> "$GITHUB_ENV"

      - name: Prove SQLAlchemy credential seam and failed-run provenance
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/T6B_SQLALCHEMY_URL_CREDENTIAL_SEAM_PROOF.json" "$RUNNER_TEMP/T6B_PREVIOUS_FAILURE_PROVENANCE.json" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          from sqlalchemy.engine import URL
          from sqlalchemy.engine.url import make_url

          seam_path=Path(sys.argv[1]); provenance_path=Path(sys.argv[2])
          sentinel='SyntheticCredentialSeamSentinel_20260907'
          u=URL.create('mssql+pyodbc', username='sa', password=sentinel, host='127.0.0.1', port=1433, database='synthetic_seam', query={'driver':'ODBC Driver 18 for SQL Server','Encrypt':'yes','TrustServerCertificate':'yes'})
          masked=str(u)
          executable=u.render_as_string(hide_password=False)
          parsed=make_url(executable)
          assert '***' in masked and sentinel not in masked
          assert '***' not in executable and sentinel in executable
          assert parsed.password == sentinel
          seam={
              'str_url_masks_sentinel': True,
              'render_as_string_hide_password_false_preserves_sentinel': True,
              'make_url_password_roundtrip': True,
              'masked_url_sha256': hashlib.sha256(masked.encode()).hexdigest(),
              'executable_url_not_persisted': True,
              'password_leak_count': 0,
              't6b_6dae_credential_propagation': 'PASS',
              't6b_consumer_change_required': False,
              'frozen_qualification_call_credential_boundary': 'PASS',
          }
          seam_path.write_text(json.dumps(seam, sort_keys=True, indent=2) + '\n')
          provenance={
              'failed_run_id': 34064808701,
              'failed_validation_sha256': 'cb88d155b701ca9533195c1cfedfa384f464911a',
              'failed_parent_sha256': 'c42e6c449483b0951de0f366d700dbaf7b9e5525',
              'failed_run_classification': 'PRE_PERSISTENCE_SCHEMA_FINGERPRINT_CANARY_FAILURE',
              'failed_runner_invocations': 0,
              'accepted_phase5_migration_canary': 'PASS',
              'schema_fingerprint_canary': 'FAIL',
              'migration_head_observed': 'baseline_phase4_v36_azure_sql',
              'first_commit_started': False,
              't6b_business_persistence_transaction_started': False,
              't6b_consumer_sha256': os.environ['T6B_SHA'],
              'credential_material_included': False,
          }
          provenance_path.write_text(json.dumps(provenance, sort_keys=True, indent=2) + '\n')
          print('SQLALCHEMY_CREDENTIAL_SEAM=PASS')
          print('T6B_6DA_CREDENTIAL_PROPAGATION=PASS')
          print('T6B_CONSUMER_CHANGE_REQUIRED=false')
          print('FAILED_RUN_34064808701_PROVENANCE=RECORDED')
          PY

      - name: Run one SQL Server attempt with pre-persistence Alembic canary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          evidence="$RUNNER_TEMP/t6b-evidence"
          mkdir -p "$evidence"
          container="t6b-native-x64-${GITHUB_RUN_ID}"
          password="A$(python -c 'import secrets; print(secrets.token_urlsafe(36))')9!"
          echo "::add-mask::$password"
          export T6B_SA_PASSWORD="$password"
          export MSSQL_SA_PASSWORD="$password"
          cleanup() { if declare -F drop_canary >/dev/null 2>&1; then drop_canary; fi; docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker pull --platform linux/amd64 "$IMAGE"
          image_os="$(docker image inspect "$IMAGE" --format '{{.Os}}')"
          image_arch="$(docker image inspect "$IMAGE" --format '{{.Architecture}}')"
          image_digest="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          test "$image_os" = linux
          test "$image_arch" = amd64
          test "$image_digest" = "$IMAGE"
          database="t6b_native_x64_${GITHUB_RUN_ID}"
          [[ "$database" =~ ^[A-Za-z0-9_]+$ ]]
          canary_database="t6b_native_x64_canary_${GITHUB_RUN_ID}"
          [[ "$canary_database" =~ ^[A-Za-z0-9_]+$ ]]
          drop_canary() {
            python - "$canary_database" >/dev/null 2>&1 <<'PY' || true
          import os, sys, pyodbc
          db=sys.argv[1]; password=os.environ['T6B_SA_PASSWORD']
          cs='DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;DATABASE=master;UID=sa;PWD='+password+';Encrypt=yes;TrustServerCertificate=yes;Connection Timeout=5'
          try:
              with pyodbc.connect(cs,autocommit=True) as c:
                  if c.execute('SELECT COUNT(*) FROM sys.databases WHERE name=?',(db,)).fetchone()[0]:
                      c.execute('ALTER DATABASE ['+db+'] SET SINGLE_USER WITH ROLLBACK IMMEDIATE')
                      c.execute('DROP DATABASE ['+db+']')
          except Exception:
              pass
          PY
          }
          docker run -d --name "$container" --platform linux/amd64 --publish 127.0.0.1:1433:1433 --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD "$IMAGE" >/dev/null
          echo '1' > "$evidence/T6B_SQLSERVER_CONTAINER_INSTANCE_COUNT.txt"
          set +e
          python - "$evidence/T6B_NATIVE_X64_SQLSERVER_READINESS.json" <<'PY'
          import json, os, sys, time
          import pyodbc
          out=sys.argv[1]; password=os.environ['T6B_SA_PASSWORD']
          cs='DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;DATABASE=master;UID=sa;PWD='+password+';Encrypt=yes;TrustServerCertificate=yes;Connection Timeout=5'
          last=None; props=None
          for _ in range(60):
              try:
                  with pyodbc.connect(cs,autocommit=True) as c:
                      assert int(c.execute('SELECT 1').fetchone()[0])==1
                      props={}
                      for key,sql in {'product_major_version':"SELECT CONVERT(varchar(32), SERVERPROPERTY('ProductMajorVersion'))",'engine_edition':"SELECT CONVERT(varchar(32), SERVERPROPERTY('EngineEdition'))",'product_version':"SELECT CONVERT(varchar(128), SERVERPROPERTY('ProductVersion'))",'edition':"SELECT CONVERT(varchar(256), SERVERPROPERTY('Edition'))"}.items(): props[key]=str(c.execute(sql).fetchone()[0])
                      break
              except Exception as exc:
                  last=type(exc).__name__+':'+str(exc)
                  time.sleep(2)
          if props is None:
              json.dump({'status':'FAIL','last_readiness_exception':last,'product_major_version':'NOT_OBSERVED','engine_edition':'NOT_OBSERVED','product_version':'NOT_OBSERVED','container_instance_count':1,'password_present':False},open(out,'w'),sort_keys=True,indent=2); open(out,'a').write('\n'); sys.exit(1)
          assert int(props['product_major_version'])==16 and int(props['engine_edition']) not in (5,8)
          json.dump({'status':'PASS','product_major_version':int(props['product_major_version']),'engine_edition':int(props['engine_edition']),'product_version':props['product_version'],'edition':props['edition'],'container_instance_count':1,'password_present':False},open(out,'w'),sort_keys=True,indent=2); open(out,'a').write('\n')
          PY
          readiness_status=$?
          set -e
          if [ "$readiness_status" -ne 0 ]; then
            docker logs "$container" > "$evidence/T6B_SQLSERVER_CONTAINER_LOG.txt" 2>&1 || true
            exit 1
          fi
          export T6B_DATABASE="$database" T6B_PHASE5_ROOT="$T6B_PHASE5_ROOT" T6B_CONTAINER="$container" T6B_READINESS="$evidence/T6B_NATIVE_X64_SQLSERVER_READINESS.json"
          python - "$evidence/T6B_ALEMBIC_CANARY_EVIDENCE.json" "$canary_database" <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          from urllib.parse import quote, quote_plus
          import pyodbc
          from sqlalchemy.engine import URL
          from sqlalchemy.engine.url import make_url

          out=Path(sys.argv[1]); db=sys.argv[2]; password=os.environ['T6B_SA_PASSWORD']; phase5=Path(os.environ['T6B_PHASE5_ROOT'])
          raw_url=URL.create('mssql+pyodbc', username='sa', password=password, host='127.0.0.1', port=1433, database=db, query={'driver':'ODBC Driver 18 for SQL Server','Encrypt':'yes','TrustServerCertificate':'yes'}).render_as_string(hide_password=False)
          assert make_url(raw_url).password == password
          def sanitize(value):
              text=value or ''
              for token in (password, quote(password, safe=''), quote_plus(password), raw_url):
                  text=text.replace(token, '[REDACTED]')
              return text[-12000:]
          def connect(database):
              cs='DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;DATABASE='+database+';UID=sa;PWD='+password+';Encrypt=yes;TrustServerCertificate=yes;Connection Timeout=5'
              return pyodbc.connect(cs, autocommit=True)
          evidence={'status':'NOT_STARTED','database':db,'command_identity':['python','-m','alembic','-c',str(phase5/'alembic.ini'),'upgrade','head'],'accepted_phase5_commit':'c42e6c449483b0951de0f366d700dbaf7b9e5525','accepted_phase5_tree':'a497c6951064119453d175d1b93d4e59c9029fd0','migration_head_expected':'baseline_phase4_v36_azure_sql','password_present':False}
          created=False
          try:
              with connect('master') as c:
                  if c.execute('SELECT COUNT(*) FROM sys.databases WHERE name=?',(db,)).fetchone()[0] != 0:
                      raise RuntimeError('canary database already exists')
                  c.execute('CREATE DATABASE ['+db+']')
              created=True
              env=os.environ.copy(); env.update({'APP_ENV':'TEST','SYNTHETIC_ONLY':'true','REAL_DATA_ALLOWED':'false','DATABASE_URL':raw_url,'PYTHONPATH':str(phase5)})
