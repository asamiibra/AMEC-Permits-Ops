          print('T6B_REQUIRED_TEST_SKIPS='+str(value(q,'required_test_skips')))
          print('T6A_RUNTIME_RERUNS=0')
          print('DSM_CONTACTS=0')
          print('SMB_CONNECTIONS=0')
          print('REAL_AMEC_SOURCE_READS=0')
          print('REAL_AMEC_SOURCE_BYTES=0')
          print('PARSER_EXECUTIONS=0')
          print('REAL_CONTENT_LLM_CALLS=0')
          print('CREDENTIAL_EVIDENCE_LEAK_COUNT='+str(value(seam,'password_leak_count',0)))
          expected_zero_counts={'source_events':0,'evidence_envelopes':0,'classification_envelopes':0,'pending_review':0}
          expected_commit_counts={'source_events':3,'evidence_envelopes':3,'classification_envelopes':3,'pending_review':3}
          success=bool(
              q
              and q.get('required_test_skips')==0
              and q.get('server',{}).get('product_major_version')==16
              and q.get('server',{}).get('engine_edition') not in (5,8)
              and q.get('before_counts')==expected_zero_counts
              and q.get('after_rollback_counts')==expected_zero_counts
              and q.get('after_first_commit_counts')==expected_commit_counts
              and q.get('after_replay_counts')==expected_commit_counts
              and q.get('schema_before_sha256')
              and q.get('schema_after_sha256')
              and q.get('schema_before_sha256')==q.get('schema_after_sha256')
              and q.get('schema_delta')==0
              and q.get('verified_assertion_delta')==0
              and q.get('typed_projection_delta')==0
              and q.get('protected_action_delta')==0
              and q.get('review_accept_delta')==0
              and q.get('review_correct_delta')==0
              and q.get('auto_promotion_delta')==0
              and q.get('source_writebacks')==0
              and q.get('phase4_source_change_recorded_first_commit_delta')==3
              and q.get('audit_replay_duplicate_delta')==0
              and q.get('dsm_contacts')==0
              and q.get('smb_connections')==0
              and q.get('real_amec_source_reads')==0
              and q.get('real_amec_source_bytes')==0
              and q.get('parser_executions')==0
              and q.get('llm_calls')==0
              and q.get('mssql_unique_constraint_sys_catalog')=='PASS'
              and q.get('mssql_reflection_api_preflight')=='PASS'
              and q.get('schema_fingerprint_mutation_sensitivity') is True
              and value(seam,'password_leak_count',1)==0
              and value(canary,'status')=='PASS'
              and value(schema_canary,'status')=='PASS'
              and value(schema_canary,'total_catalog_query_execution_count')==6
              and runner_marker.exists()
              and runner_marker.read_text().strip()=='1'
          )
          print('T6B_APPLICATION_PERSISTENCE_CLOSED='+str(success).lower())
          print('T6B_READY_FOR_INDEPENDENT_ACCEPTANCE='+str(success).lower())
          print('T6B_INDEPENDENT_ACCEPTANCE=NOT_PERFORMED_BY_PRODUCER')
          print('MAIN_MERGE_AUTHORIZED=false')
          print('PHASE6_AUTHORIZED=false')
          print('PRODUCTION_READY=false')
          print('GLOBAL_REAL_AMEC_DATA_ALLOWED=false')
          print('ARTIFACT_ID='+os.environ.get('T6B_ARTIFACT_ID','NOT_OBSERVED'))
          print('ARTIFACT_DIGEST='+os.environ.get('T6B_ARTIFACT_DIGEST','NOT_OBSERVED'))
          print('ARTIFACT_NAME=t6b-native-x64-sql-catalog-final-canaryfix-'+os.environ.get('GITHUB_RUN_ID','NOT_OBSERVED'))
          if success:
              next_step='EXTERNAL_INDEPENDENT_ACCEPTANCE'
          elif not ready or ready.get('status') != 'PASS':
              next_step='STOP_SQLSERVER_READINESS_FAILURE'
          elif not canary or canary.get('status') != 'PASS':
              next_step='STOP_ALEMBIC_CANARY_FAILURE'
          elif not schema_canary or schema_canary.get('status') != 'PASS':
              next_step='STOP_SCHEMA_FINGERPRINT_CANARY_FAILURE'
          elif not runner_marker.exists() or runner_marker.read_text().strip() != '1':
              next_step='STOP_RUNNER_NOT_STARTED_AFTER_CANARIES'
          elif not q:
              next_step='STOP_T6B_FROZEN_RUNNER_FAILURE'
          else:
              next_step='STOP_T6B_FROZEN_RUNNER_FAILURE'
          print('NEXT='+next_step)
          PY
