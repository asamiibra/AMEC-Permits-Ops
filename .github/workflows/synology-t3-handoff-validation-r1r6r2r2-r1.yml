name: Synology T3 R1.6R2R2 independent-handoff candidate validation R1

on:
  push:
    branches:
      - synology-t3-owner-dsm-synthetic-r1r6r2r2-validation-r1-v1

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  ACCEPTED_V23_SHA: 4925518b35b58956aaa5870f226af5e57d14b610
  ACCEPTED_V23_TREE: 9dafcf25ac59d4dc2940c03bb081206d7f2820fa
  V22_SHA: 835bcc6208b274d5d95bd0cbd1d414a14e52e9e8
  CANDIDATE_SHA: 01da7d97734e131eb98eea53de1ef382e27d8590
  CANDIDATE_TREE: b88f123ad069d7278d97b0787f9066bee9e95d19
  CANDIDATE_PARENT: d89d13b94606d1546fc8229371d443cba981e6a9
  CANDIDATE_PARENT_TREE: 4790ec3ca9e0390a6295dc4d91cdef6e9ded6d8f
  ACCEPTED_PHASE5_SHA: c42e6c449483b0951de0f366d700dbaf7b9e5525
  ACCEPTED_PHASE5_TREE: a497c6951064119453d175d1b93d4e59c9029fd0
  ACCEPTED_ACCOUNT_CUTOVER_SHA: 4a017b465300fc6c39b7807b24e08868479ec884
  ACCEPTED_ACCOUNT_CUTOVER_TREE: 52f0cd478b556fe59941d416f80dddab9f9db9fa
  ACCEPTED_SYNOLOGY_INTEGRATION_SHA: d4f5a9354881f568845386be2c70a50ff16262fd
  ACCEPTED_SYNOLOGY_INTEGRATION_TREE: 38376a7197c4391b8dee1827a8642e0cc2042259
  ACCEPTED_VALIDATION_SHA: bd93eb5048531448091ffa86ccd9d161b90b91fb

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation child
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify validation child scope and checkout exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"
          test "$(git diff --name-only "$CANDIDATE_SHA" HEAD)" = ".github/workflows/synology-t3-handoff-validation-r1r6r2r2-r1.yml"
          test -z "$(git diff --name-only "$CANDIDATE_SHA" HEAD -- backend frontend infra deploy migrations scripts contracts)"
          echo VALIDATION_CHILD_SCOPE=PASS
          echo VALIDATION_CHILD_APPLICATION_DELTA=0
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_PARENT"
          test "$(git rev-list --count "$CANDIDATE_PARENT..HEAD")" = 1

      - name: Use Python 3.12 for build and harness gates
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact ancestry, scope, frozen application, and storage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD~1)" = "$CANDIDATE_PARENT"
          test "$(git rev-parse "$CANDIDATE_PARENT^{tree}")" = "$CANDIDATE_PARENT_TREE"
          test "$(git rev-list --count "$CANDIDATE_PARENT..HEAD")" = 1
          test "$(git rev-parse HEAD:scripts/synology_t3/t3_common.py)" = afe84785ab1684d91c018d7c795c7d0b3182a4cb
          test "$(git rev-parse HEAD:scripts/synology_t3/t3_runner.py)" = 2aaded8f8f7626e018dbe6914e423831d970aa87
          for commit in "$ACCEPTED_PHASE5_SHA" "$ACCEPTED_ACCOUNT_CUTOVER_SHA" "$ACCEPTED_SYNOLOGY_INTEGRATION_SHA" "$ACCEPTED_VALIDATION_SHA"; do git cat-file -e "$commit^{commit}"; done
          test "$(git rev-parse "$ACCEPTED_PHASE5_SHA^{tree}")" = "$ACCEPTED_PHASE5_TREE"
          test "$(git rev-parse "$ACCEPTED_ACCOUNT_CUTOVER_SHA^{tree}")" = "$ACCEPTED_ACCOUNT_CUTOVER_TREE"
          test "$(git rev-parse "$ACCEPTED_SYNOLOGY_INTEGRATION_SHA^{tree}")" = "$ACCEPTED_SYNOLOGY_INTEGRATION_TREE"
          test "$(git rev-parse "$ACCEPTED_ACCOUNT_CUTOVER_SHA^")" = "$ACCEPTED_PHASE5_SHA"
          test "$(git rev-parse "$ACCEPTED_SYNOLOGY_INTEGRATION_SHA^")" = "$ACCEPTED_ACCOUNT_CUTOVER_SHA"
          test "$(git rev-parse "$ACCEPTED_VALIDATION_SHA^")" = "$ACCEPTED_SYNOLOGY_INTEGRATION_SHA"
          test "$(git diff --name-only "$ACCEPTED_SYNOLOGY_INTEGRATION_SHA" "$ACCEPTED_VALIDATION_SHA")" = ".github/workflows/phase5-classifier-shadow-validation-ci-r3r1r6r3.yml"
          test "$(git rev-parse HEAD:scripts/synology_t3/run_t3_owner_dsm.sh)" = "$(git rev-parse 9117521efb5780e72affad6627f97f7b924bea83:scripts/synology_t3/run_t3_owner_dsm.sh)"
          test "$(git rev-parse HEAD:scripts/synology_t3/run_t3_owner_dsm.sh)" = ee7edac60fe01b5c43bc92144114d14b8438afa7
          test "$(git merge-base HEAD "$ACCEPTED_V23_SHA")" = "$ACCEPTED_V23_SHA"
          test "$(git rev-parse "$ACCEPTED_V23_SHA^{tree}")" = "$ACCEPTED_V23_TREE"
          test "$(git rev-parse "$ACCEPTED_V23_SHA~1")" = "$V22_SHA"
          git diff --name-only "$CANDIDATE_PARENT" HEAD | sort > "$RUNNER_TEMP/r1r6r2r2-scope.txt"
          printf '%s\n' \
            .github/workflows/synology-t3-handoff-build-r1r6r2r2.yml \
            backend/tests/test_synology_t3_harness.py \
            scripts/synology_t3/OWNER_DSM_T3_OPERATOR_INSTRUCTIONS.md \
            scripts/synology_t3/build_handoff.py \
            scripts/synology_t3/scope_validator.py \
            scripts/synology_t3/t3_common.py \
            scripts/synology_t3/t3_runner.py | sort > "$RUNNER_TEMP/r1r6r2r2-expected-scope.txt"
          diff -u "$RUNNER_TEMP/r1r6r2r2-expected-scope.txt" "$RUNNER_TEMP/r1r6r2r2-scope.txt"
          python3 scripts/synology_t3/scope_validator.py $(< "$RUNNER_TEMP/r1r6r2r2-scope.txt")
          test -z "$(git diff --name-only "$CANDIDATE_PARENT" HEAD -- backend/app backend/requirements.txt frontend infra deploy migrations scripts/phase5 contracts/amec/phase5)"
          for frozen in scripts/synology_t3/network_guard.py scripts/synology_t3/dsm_state_schema.py scripts/synology_t3/Dockerfile scripts/synology_t3/preflight_t3_handoff.py scripts/synology_t3/finalize_t3_return.py scripts/synology_t3/validate_t3_return.py scripts/synology_t3/host_bootstrap.py scripts/synology_t3/fixture_manifest.py scripts/synology_t3/seed_t3_synthetic_share.sh scripts/synology_t3/verify_t3_dsm_state.sh; do
            test "$(git rev-parse "HEAD:$frozen")" = "$(git rev-parse "$CANDIDATE_PARENT:$frozen")"
          done
          test "$(git diff --name-only "$CANDIDATE_PARENT" HEAD -- backend/app/storage backend/app/config/settings.py backend/requirements.txt | wc -l | tr -d ' ')" = 0
          test "$(grep -Fxc 'smbprotocol==1.15.0' backend/requirements.txt)" = 1
          echo APPLICATION_DELTA=0
          echo STORAGE_PROVIDER_DELTA=0
          echo REQUIREMENTS_DELTA=0
          for commit in "$ACCEPTED_V23_SHA" "$ACCEPTED_SYNOLOGY_INTEGRATION_SHA" HEAD; do
          for pair in \
            backend/app/storage/smb.py:ad3720c23a9b2d9f65145b32896f8fec60372911 \
            backend/app/storage/external.py:2e4c8ee0bf4b91ecf5b66894751f750a9179af19 \
            backend/app/storage/port.py:2a280b4c06f85fc75812c69b7509fc15f2945507 \
            backend/app/storage/factory.py:fa5836adc7abf040acf7354c0377cb88f0034c8b \
            backend/app/storage/errors.py:4e4f7573336290e36df3ab97476f9390c2ef7cb6 \
            backend/app/storage/path_policy.py:4d079decc4b0bd441020dc97319e8c8043c2317e; do
            rel="${pair%%:*}"; expected="${pair##*:}"
            test "$(git rev-parse "$commit:$rel")" = "$expected"
          done
          done
          test "$(git rev-parse "$ACCEPTED_V23_SHA:backend/requirements.txt")" = 73b9add12255693ab99f65ef0326fb6f0f3f0969
          echo IMMUTABLE_ACCEPTED_STORAGE_LINEAGE_ENTRY=PASS

      - name: Scope validator forbidden-path self-test
        run: |
          set -euo pipefail
          if python3 scripts/synology_t3/scope_validator.py backend/app/storage/smb.py; then exit 1; fi

      - name: Install dependencies and run complete R1.6R2R2 suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r backend/requirements.txt
          count="$(python3 -m pytest --collect-only -q backend/tests/test_synology_t3_harness.py | tail -n 1 | awk '{print $1}')"
          test "$count" -ge 200
          python3 -m pytest -q backend/tests/test_synology_t3_harness.py
          python3 -m pytest -q backend/tests/test_synology_t3_harness.py -k 'pinned_smbprotocol_1150_encrypted_session_semantics_pass or runner_e2e_is_pure_synthetic_and_emits_typed_evidence or runner_accepts_encrypted_smbprotocol_session_without_session_signing_flag or runner_writes_security_evidence_before_connection_signing_gate or runner_encryption_gate_remains_hard_when_encryption_is_not_active or negative_acl_typeerror_is_not_access_denied_proof or negative_acl_object_not_found_is_not_access_denied_proof or negative_acl_unavailable_is_not_access_denied_proof or negative_denied_unavailable_is_not_denied_identity_proof or negative_wrong_missing_share_fails_before_provider_construction'
          python3 -m pytest -q \
            backend/tests/test_synology_adapter_contract.py \
            backend/tests/test_synology_preaccess_interface.py \
            backend/tests/test_synology_preaccess_network_guard.py \
            backend/tests/test_synology_preaccess_v2_2_bounded.py \
            backend/tests/test_synology_preaccess_v2_2_evidence.py \
            backend/tests/test_synology_preaccess_v2_2_secret_scanner.py \
            backend/tests/test_synology_preaccess_v2_3_artifact_hygiene.py \
            backend/tests/test_external_source_readonly_listing.py \
            backend/tests/test_smb_integration.py
          echo FULL_BACKEND_REGRESSION_BEGIN
          if python3 -m pytest -q backend/tests 2>&1 | tee "$RUNNER_TEMP/full-backend-regression.log"; then
            echo FULL_BACKEND_REGRESSION_PASS
          else
            echo FULL_BACKEND_REGRESSION_FAIL
            exit 1
          fi
          compile_root="$(mktemp -d "$RUNNER_TEMP/compileall.XXXXXX")"
          cp -R scripts/synology_t3 "$compile_root/tree"
          python3 -m compileall -q "$compile_root/tree"

      - name: Shell, source-secret, bytecode, and instruction gates
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/synology_t3/*.sh; do bash -n "$file"; done
          test "$(find scripts/synology_t3 -type f -name '*.pyc' | wc -l | tr -d ' ')" = 0
          test "$(find scripts/synology_t3 -type d -name '__pycache__' | wc -l | tr -d ' ')" = 0
          python3 scripts/synology_t3/source_secret_scan.py scripts/synology_t3
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/synology-t3-handoff-build-r1r6r2r2.yml"); puts "YAML_PARSE=PASS"'
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('scripts/synology_t3')
          for name in ('verify_t3_dsm_state.sh', 'seed_t3_synthetic_share.sh', 'run_t3_owner_dsm.sh'):
              text = (root / name).read_text()
              if name != 'seed_t3_synthetic_share.sh':
                  assert 'PYTHONDONTWRITEBYTECODE=1' in text
              assert all('-B' in line for line in text.splitlines() if re.search(r'\bpython3\b', line))
          text = Path('scripts/synology_t3/OWNER_DSM_T3_OPERATOR_INSTRUCTIONS.md').read_text()
          assert re.search(r'independent acceptance has passed[^.\n]*exact R1\.6R2R2 handoff candidate', text)
          for required in (
              'T3_OWNER_EXECUTION_READY=false',
              'T3_HANDOFF_BUILD_ID',
              'T3_RUN_ID',
              '/bin/bash "$T3_HANDOFF_DIR/run_t3_owner_dsm.sh"',
              'unset T3_BOOTSTRAP_ONLY',
              'test -z "${T3_BOOTSTRAP_ONLY+x}"',
          ):
              assert required in text
          active_blocks = re.findall(r"\`\`\`(?:sh|bash|shell)\n(.*?)\`\`\`", text, re.S)
          current_blocks = [block for block in active_blocks if 'T3_HANDOFF_BUILD_ID' in block]
          assert current_blocks
          assert any('/bin/bash "$T3_HANDOFF_DIR/run_t3_owner_dsm.sh"' in block for block in current_blocks)
          assert all('./run_t3_owner_dsm.sh' not in block for block in current_blocks)
          PY

      - name: Build immutable R1.6R2R2 handoff skeleton
        shell: bash
        run: |
          set -euo pipefail
          export T3_OUTPUT="$RUNNER_TEMP/t3-r1r6r2r2-handoff"
          python3 scripts/synology_t3/build_handoff.py --repo-root . --output "$T3_OUTPUT" --run-id "SYN-T3-R1R6R2R2-${GITHUB_RUN_ID}" --harness-sha "$CANDIDATE_SHA"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["harness_sha"])' "$T3_OUTPUT/ProposalOps_SYN_T3_Handoff_SYN-T3-R1R6R2R2-${GITHUB_RUN_ID}/06_IMAGE_BUILD_POLICY.json")" = "$CANDIDATE_SHA"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["image_ref"])' "$T3_OUTPUT/ProposalOps_SYN_T3_Handoff_SYN-T3-R1R6R2R2-${GITHUB_RUN_ID}/06_IMAGE_BUILD_POLICY.json")" = "proposalops/syn-t3:r1r6r2r2-${CANDIDATE_SHA:0:12}"
          echo "T3_OUTPUT=$T3_OUTPUT" >> "$GITHUB_ENV"
          echo "T3_BUNDLE=$T3_OUTPUT/ProposalOps_SYN_T3_Handoff_SYN-T3-R1R6R2R2-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Build and bind immutable linux amd64 image
        shell: bash
        run: |
          set -euo pipefail
          export IMAGE_REF="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["image_ref"])' "$T3_BUNDLE/06_IMAGE_BUILD_POLICY.json")"
          case "$IMAGE_REF" in proposalops/syn-t3:r1r6r2r2-*) ;; *) exit 1 ;; esac
          docker build --platform linux/amd64 --file scripts/synology_t3/Dockerfile --build-arg ACCEPTED_V23_SHA="$ACCEPTED_V23_SHA" --build-arg T3_HARNESS_SHA="$CANDIDATE_SHA" --tag "$IMAGE_REF" .
          docker image inspect "$IMAGE_REF" --format '{{json .}}' > "$T3_BUNDLE/07_DOCKER_IMAGE_INSPECT.json"
          python3 - "$T3_BUNDLE" "$IMAGE_REF" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1]); ref = sys.argv[2]
          policy_path = root / '06_IMAGE_BUILD_POLICY.json'
          policy = json.loads(policy_path.read_text()); image = json.loads((root / '07_DOCKER_IMAGE_INSPECT.json').read_text())
          labels = image['Config']['Labels']
          assert policy['image_ref'] == ref and ref.startswith('proposalops/syn-t3:r1r6r2r2-')
          assert labels['org.opencontainers.image.revision'] == policy['harness_sha'] == '01da7d97734e131eb98eea53de1ef382e27d8590'
          assert labels['org.opencontainers.image.proposalops-application-revision'] == policy['application_sha']
          assert labels['org.opencontainers.image.synthetic-only'] == 'true'
          assert image['Os'] == 'linux' and image['Architecture'] == 'amd64'
          assert image['Config']['User'] == '10001:10001'
          policy['image_id'] = image['Id']
          policy_path.write_text(json.dumps(policy, indent=2, sort_keys=True) + '\n')
          PY
          docker run --rm --platform linux/amd64 "$IMAGE_REF" python3 --version > "$T3_BUNDLE/08_PYTHON_VERSION.txt"
          docker run --rm --platform linux/amd64 "$IMAGE_REF" python3 -c 'import ssl; print(ssl.OPENSSL_VERSION)' > "$T3_BUNDLE/09_OPENSSL_VERSION.txt"
          docker run --rm --platform linux/amd64 "$IMAGE_REF" python3 -m pip freeze > "$T3_BUNDLE/10_PIP_FREEZE.txt"
          docker run --rm --platform linux/amd64 "$IMAGE_REF" python3 -m compileall -q /opt/proposalops/scripts/synology_t3
          docker save --output "$T3_BUNDLE/proposalops-syn-t3-image.tar" "$IMAGE_REF"

      - name: Finalize and validate immutable handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/synology_t3/build_handoff.py --finalize "$T3_BUNDLE"
          python3 scripts/synology_t3/validate_t3_return.py --handoff-root "$T3_BUNDLE"
          python3 scripts/synology_t3/preflight_t3_handoff.py --handoff-root "$T3_BUNDLE" --image-tar "$T3_BUNDLE/proposalops-syn-t3-image.tar" --image-ref "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["image_ref"])' "$T3_BUNDLE/06_IMAGE_BUILD_POLICY.json")"
          python3 - "$T3_BUNDLE" <<'PY'
          import pathlib, sys, stat, tarfile
          root = pathlib.Path(sys.argv[1])
          manifest = root / '13_FIXTURE_MANIFEST.json'
          assert stat.S_IMODE(manifest.stat().st_mode) == 0o644
          print('HANDOFF_MANIFEST_MODE=0644')
          with tarfile.open(root.with_suffix('.tar.gz'), 'r:gz') as tar:
              members = tar.getmembers()
              names = [m.name for m in members]
              assert all(not pathlib.Path(n).is_absolute() and '..' not in pathlib.Path(n).parts for n in names)
              assert all(m.isfile() or m.isdir() for m in members)
              assert all(n == root.name or n.startswith(root.name + '/') for n in names)
              target = next(m for m in members if m.name.endswith('/13_FIXTURE_MANIFEST.json'))
              assert stat.S_IMODE(target.mode) == 0o644
          print('HANDOFF_TAR_MANIFEST_MODE=0644')
          print('T3_R1R6R2R2_HANDOFF_ARCHIVE_REOPEN=PASS')
          PY
          IMAGE_REF="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["image_ref"])' "$T3_BUNDLE/06_IMAGE_BUILD_POLICY.json")"
          docker run --rm --network=none --user 10001:10001 --mount "type=bind,src=$T3_BUNDLE/13_FIXTURE_MANIFEST.json,dst=/tmp/13_FIXTURE_MANIFEST.json,readonly" "$IMAGE_REF" python3 -B -c 'import json; x=json.load(open("/tmp/13_FIXTURE_MANIFEST.json")); assert x["root"] == "cert/v1" and len(x["entries"]) == 270; print("NONROOT_MANIFEST_READ_CANARY=PASS")'

      - name: Exercise preflight absent exact and conflict tag matrix
        shell: bash
        run: |
          set -euo pipefail
          fake="$RUNNER_TEMP/fake-docker"; state="$RUNNER_TEMP/fake-docker-state"
          cat > "$fake" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          mode="${FAKE_DOCKER_MODE:?}"; policy="${FAKE_POLICY:?}"; state="${FAKE_DOCKER_STATE:?}"
          if [[ "$1 $2 $3" == "image inspect"* ]]; then
            if [[ "$mode" == absent && ! -f "$state" ]]; then exit 1; fi
            python3 - "$policy" "$mode" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1])); mode=sys.argv[2]
          x={"Id":p["image_id"],"Os":"linux","Architecture":"amd64","Config":{"User":"10001:10001","Labels":{"org.opencontainers.image.proposalops-application-revision":p["application_sha"],"org.opencontainers.image.revision":p["harness_sha"],"org.opencontainers.image.synthetic-only":"true"}}}
          if mode == "conflict": x["Config"]["Labels"]["org.opencontainers.image.revision"]="conflict"
          print(json.dumps(x))
          PY
          elif [[ "$1 $2" == "load --input" ]]; then touch "$state"; echo "Loaded image"; fi
          SH
          chmod +x "$fake"
          export PATH="$RUNNER_TEMP:$PATH" FAKE_POLICY="$T3_BUNDLE/06_IMAGE_BUILD_POLICY.json" FAKE_DOCKER_STATE="$state"
          ln -sf "$fake" "$RUNNER_TEMP/docker"
          for mode in absent exact conflict; do
            find "$state" -delete 2>/dev/null || true
            export FAKE_DOCKER_MODE="$mode"
            if [[ "$mode" == conflict ]]; then
              if output="$(python3 scripts/synology_t3/preflight_t3_handoff.py --handoff-root "$T3_BUNDLE" --image-tar "$T3_BUNDLE/proposalops-syn-t3-image.tar")"; then exit 1; fi
              echo "$output" | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["status"] == "STOP_T3_IMAGE_TAG_COLLISION" and x["docker_load_count"] == 0'
            else
              output="$(python3 scripts/synology_t3/preflight_t3_handoff.py --handoff-root "$T3_BUNDLE" --image-tar "$T3_BUNDLE/proposalops-syn-t3-image.tar")"
              echo "$output"
              if [[ "$mode" == absent ]]; then echo "$output" | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["image_ref_preexisting"] is False and x["docker_load_count"] == 1'; else echo "$output" | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["image_ref_preexisting_exact"] is True and x["docker_load_count"] == 0'; fi
            fi
          done

      - name: Use CPython 3.8 for complete fresh-handoff matrix
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Python 3.8 validator, PRE, POST, finalizer, and mutation gates
        shell: bash
        run: |
          set -euo pipefail
          python -B -c 'import sys; assert sys.version_info[:2] == (3, 8); print(sys.version)'
          fresh_parent="$RUNNER_TEMP/r1r6r2r2-fresh"
          mkdir -p "$fresh_parent"
          tar -xzf "$T3_BUNDLE.tar.gz" -C "$fresh_parent"
          FRESH="$fresh_parent/$(basename "$T3_BUNDLE")"
          echo "FRESH=$FRESH" >> "$GITHUB_ENV"
          before="$(sha256sum "$FRESH/MANIFEST.sha256" | awk '{print $1}')"
          python -B "$FRESH/validate_t3_return.py" --handoff-root "$FRESH"
          python -B "$FRESH/validate_t3_return.py" --handoff-root "$FRESH"
          py38_bin="$RUNNER_TEMP/python38-bin"
          mkdir -p "$py38_bin"
          ln -sf "$(command -v python)" "$py38_bin/python3"
          export PATH="$py38_bin:$PATH"
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 8)'
          synthetic="$RUNNER_TEMP/r1r6r2r2-synthetic-return"
          mkdir -p "$synthetic"
          python3 - "$synthetic" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          pre = {"state_schema_version":"SYN-T3-DSM-STATE-V1","phase":"PRE","model":"DS220+","dsm_version":"7","dsm_build":"1","hostname":"synthetic","architecture":"x86_64","active_lan_ip":"192.0.2.10","gateway":"192.0.2.1","docker_version":"24","smb":{"min":"SMB2"},"firewall":{"enabled":True},"auto_block":{"enabled":True},"tun1000":{"exists":False},"existing_proposalops_identities":["existing"],"business_share_acl_fingerprint":"synthetic-acl","test_share_exists":False,"test_accounts_exist":False}
          post = dict(pre)
