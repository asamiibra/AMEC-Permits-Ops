name: release-critical-gates

on:
  pull_request:
  push:
    branches:
      - main
      - release/production-stabilization-v2

permissions:
  contents: read

jobs:
  backend-regression:
    name: backend-regression
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Run complete SQLite-safe backend regression
        env:
          PYTHONPATH: .
          APP_ENV: TEST
          SYNTHETIC_ONLY: "true"
          DATABASE_URL: sqlite:///./release-critical-gates.db
        run: python -m pytest -q backend/tests --ignore=backend/tests/test_phase5_sqlserver_runtime.py

  frontend-regression:
    name: frontend-regression
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and production build
        working-directory: frontend
        run: npm run build
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

  migration-head:
    name: migration-head
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install migration dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Require one migration head and clean diff
        env:
          PYTHONPATH: .
          APP_ENV: TEST
          SYNTHETIC_ONLY: "true"
          DATABASE_URL: sqlite:///./migration-head.db
        run: |
          set -euo pipefail
          test "$(alembic heads | grep -c '(head)')" = 1
          python -m pytest -q backend/tests/test_migration_runner.py backend/tests/test_migration_roundtrip.py
          git diff --check

  policy-and-security:
    name: policy-and-security
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Compile Python sources and validate IaC
        run: |
          set -euo pipefail
          python -m compileall -q backend scripts
          git diff --check
          if command -v az >/dev/null 2>&1; then az bicep build --file infra/azure/main.bicep --stdout >/dev/null; fi
      - name: Dependency audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r backend/requirements.txt
          npm audit --prefix frontend --audit-level=high
