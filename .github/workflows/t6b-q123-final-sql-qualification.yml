name: T6B Q123 final SQL qualification corrected

on:
  push:
    branches:
      - t6b-q123-final-sql-qualification-corrected-v1

permissions:
  contents: read

env:
  REPOSITORY: asamiibra/AMEC-Permits-Ops
  VALIDATION_BRANCH: t6b-q123-final-sql-qualification-corrected-v1
  PARENT_COMMIT: c42e6c449483b0951de0f366d700dbaf7b9e5525
  PARENT_TREE: a497c6951064119453d175d1b93d4e59c9029fd0
  INPUT_RELEASE_TAG: t6b-q123-final-sqlqual-inputs-20260908-v1
  Q123_SHA256: 4087832d304c847fa5a2b53aa73032610e678c596101ad8711b987db7a8c27f9
  Q123_BYTES: "12362"
  Q123_LEDGER_SHA256: 6e7c803dc5237fc2a371b50ff4d6c7854136259b6a6e037dbf71f24ba08f969c
  T6A_SHA256: 8f5f1b64091d3c9b943dc092773b12794eb5af3ee1a7bb7c5eab7e6475f7f6e2
  T6A_BYTES: "92139101"
  T6A_RETURN_SHA256: 933c43465e56d6c2a1b51a83692c4cba7038118c1c4f54b5dfce504bbba546cc
  T6A_RETURN_BYTES: "1999"
  SQLSERVER_IMAGE: mcr.microsoft.com/mssql/server@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89

jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Initialize credential-free evidence directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/t6b-q123-evidence"

      - name: Check out exact workflow child
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download and verify frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          input_dir="$RUNNER_TEMP/t6b-q123-inputs"
          phase5_dir="$RUNNER_TEMP/t6b-q123-phase5"
          extract_dir="$RUNNER_TEMP/t6b-q123-extract"
          qroot="$extract_dir/ProposalOps_SYN_T6B_FINAL_SQLQUAL_Q123_20260908"
          mkdir -p "$input_dir"

          test "$GITHUB_REF_NAME" = "$VALIDATION_BRANCH"
          test "$(git rev-parse HEAD^1)" = "$PARENT_COMMIT"
          test "$(git rev-parse "$PARENT_COMMIT^{tree}")" = "$PARENT_TREE"
          test "$(git diff --name-only "$PARENT_COMMIT" HEAD)" = ".github/workflows/t6b-q123-final-sql-qualification.yml"
          test -z "$(git status --porcelain)"

          gh release download "$INPUT_RELEASE_TAG" --repo "$REPOSITORY" --dir "$input_dir" --clobber \
            --pattern 'ProposalOps_SYN_T6B_FINAL_SQLQUAL_Q123_20260908.tar.gz' \
            --pattern 'T6B_FINAL_PRE_SQL_RELEASE_LEDGER.json' \
            --pattern 'ProposalOps_SYN_T6A_RECOVERY_R4_CANDIDATE.tar.gz' \
            --pattern 'T6A_ATTEMPT3_SANITIZED_RETURN.tar.gz'

          q="$input_dir/ProposalOps_SYN_T6B_FINAL_SQLQUAL_Q123_20260908.tar.gz"
          ledger="$input_dir/T6B_FINAL_PRE_SQL_RELEASE_LEDGER.json"
          candidate="$input_dir/ProposalOps_SYN_T6A_RECOVERY_R4_CANDIDATE.tar.gz"
          returned="$input_dir/T6A_ATTEMPT3_SANITIZED_RETURN.tar.gz"

          test "$(sha256sum "$q" | awk '{print $1}')" = "$Q123_SHA256"
          test "$(stat -c '%s' "$q")" = "$Q123_BYTES"
          test "$(sha256sum "$ledger" | awk '{print $1}')" = "$Q123_LEDGER_SHA256"
          test "$(sha256sum "$candidate" | awk '{print $1}')" = "$T6A_SHA256"
          test "$(stat -c '%s' "$candidate")" = "$T6A_BYTES"
          test "$(sha256sum "$returned" | awk '{print $1}')" = "$T6A_RETURN_SHA256"
          test "$(stat -c '%s' "$returned")" = "$T6A_RETURN_BYTES"

          jq -e --arg q "$Q123_SHA256" --argjson bytes "$Q123_BYTES" \
            '.final_t6b_sha256 == $q and .final_t6b_bytes == $bytes and .T6B_APPLICATION_PERSISTENCE_CLOSED == false and .T6B_READY_FOR_INDEPENDENT_ACCEPTANCE == false' \
            "$ledger" >/dev/null

          git worktree add --detach "$phase5_dir" "$PARENT_COMMIT"
          test "$(git -C "$phase5_dir" rev-parse HEAD)" = "$PARENT_COMMIT"
          test "$(git -C "$phase5_dir" rev-parse HEAD^{tree})" = "$PARENT_TREE"
          test -z "$(git -C "$phase5_dir" status --porcelain)"

          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          python - "$q" "$extract_dir" <<'PY'
          import hashlib, pathlib, sys, tarfile
          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          expected_root = "ProposalOps_SYN_T6B_FINAL_SQLQUAL_Q123_20260908"
          with tarfile.open(archive, "r:gz") as tf:
              members = tf.getmembers()
              for member in members:
                  name = pathlib.PurePosixPath(member.name)
                  if name.is_absolute() or ".." in name.parts or member.issym() or member.islnk() or not (member.isdir() or member.isfile()):
                      raise SystemExit("UNSAFE_Q123_ARCHIVE_MEMBER")
                  target = destination / member.name
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with tf.extractfile(member) as source, target.open("wb") as sink:
                          while True:
                              chunk = source.read(1024 * 1024)
                              if not chunk:
                                  break
                              sink.write(chunk)
          roots = list(destination.iterdir())
          if len(roots) != 1 or not roots[0].is_dir() or roots[0].name != expected_root:
              raise SystemExit("Q123_ROOT_INVALID")
          root = roots[0]
          manifest = root / "MANIFEST.sha256"
          if not manifest.is_file():
              raise SystemExit("Q123_MANIFEST_MISSING")
          for line in manifest.read_text(encoding="ascii").splitlines():
              if line.strip():
                  expected, relative = line.split("  ", 1)
                  target = root / relative
                  if not target.is_file():
                      raise SystemExit("Q123_MANIFEST_MEMBER_MISSING")
                  digest = hashlib.sha256(target.read_bytes()).hexdigest()
                  if digest != expected:
                      raise SystemExit("Q123_MANIFEST_MISMATCH")
          forbidden = list(root.rglob(".git")) + list(root.rglob("__pycache__")) + list(root.rglob("*.pyc"))
          if forbidden:
              raise SystemExit("Q123_FORBIDDEN_BUILD_ARTIFACT")
          if not (root / "t6b" / "qualification.py").is_file():
              raise SystemExit("Q123_QUALIFICATION_MODULE_MISSING")
          print("Q123_FRESH_EXTRACT_MANIFEST=PASS")
          print("Q123_QUALIFICATION_MODULE_PRESENT=PASS")
          PY

          cat > "$RUNNER_TEMP/t6b-q123-evidence/T6B_Q123_PREEXECUTION_AUDIT.json" <<EOF
          {"q123_sha256":"$Q123_SHA256","q123_bytes":$Q123_BYTES,"q123_ledger_sha256":"$Q123_LEDGER_SHA256","consumer_sha256":"6689959f300461e2b7eba669728c59c02251362d36bba4e853bdcfbd9ef32778","consumer_bytes":18389,"sqlserver_gate_sha256":"0f3b7552445754cbb2af195be6e26848562a176756f63bc2ceee10681aff2834","sqlserver_gate_bytes":2133,"qualification_runner_sha256":"1a3e78c3db2010e0a6240de48e416a481a1358993fa5f3a3e2914ecddb814fc6","qualification_runner_bytes":19879,"phase5_commit":"$PARENT_COMMIT","phase5_tree":"$PARENT_TREE","t6a_candidate_sha256":"$T6A_SHA256","t6a_return_sha256":"$T6A_RETURN_SHA256","manifest_mismatches":0,"qualification_module_present":true,"sql_execution_performed":false}
          EOF

      - name: Prove native x64 host and Docker daemon
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          uname_arch="$(uname -m)"
          dpkg_arch="$(dpkg --print-architecture)"
          docker_os="$(docker info --format '{{.OSType}}')"
          docker_arch="$(docker info --format '{{.Architecture}}')"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "UNAME_ARCH=$uname_arch"
          echo "DPKG_ARCH=$dpkg_arch"
          echo "DOCKER_OSTYPE=$docker_os"
          echo "DOCKER_ARCHITECTURE=$docker_arch"
          test "$uname_arch" = x86_64
          test "$dpkg_arch" = amd64
          test "$docker_os" = linux
          test "$docker_arch" = x86_64
          jq -n --arg os "$RUNNER_OS" --arg arch "$RUNNER_ARCH" --arg uname "$uname_arch" --arg dpkg "$dpkg_arch" --arg docker_os "$docker_os" --arg docker_arch "$docker_arch" \
            '{runner_os:$os,runner_arch:$arch,uname_m:$uname,dpkg_architecture:$dpkg,docker_ostype:$docker_os,docker_architecture:$docker_arch,qemu_or_binfmt:false}' \
            > "$RUNNER_TEMP/t6b-q123-evidence/T6B_Q123_NATIVE_X64_HOST_PROOF.json"

      - name: Set up accepted Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install accepted dependencies and prove frozen import root
        shell: bash
        run: |
          set -euo pipefail
          phase5_dir="$RUNNER_TEMP/t6b-q123-phase5"
          qroot="$RUNNER_TEMP/t6b-q123-extract/ProposalOps_SYN_T6B_FINAL_SQLQUAL_Q123_20260908"
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
          python -m pip install --disable-pip-version-check --no-input -r "$phase5_dir/backend/requirements.txt" pyodbc
          python -m pip check
          python -c 'import pyodbc; assert "ODBC Driver 18 for SQL Server" in pyodbc.drivers()'
          test -f "$qroot/t6b/__init__.py"
          test -f "$qroot/t6b/qualification.py"
          PYTHONPATH="$qroot" python - "$qroot" <<'PY'
          import os, pathlib, sys
          root = pathlib.Path(sys.argv[1]).resolve()
          import t6b
          import t6b.qualification
          for module in (t6b, t6b.qualification):
              path = pathlib.Path(module.__file__).resolve()
              if not (str(path) == str(root) or str(path).startswith(str(root) + os.sep)):
                  raise SystemExit("Q123_TRUSTED_IMPORT_ROOT_FAIL")
          print("Q123_TRUSTED_IMPORT_ROOT=PASS")
          PY

      - name: Run one frozen Q123 SQL qualification
        shell: bash
        run: |
          set -euo pipefail
          input_dir="$RUNNER_TEMP/t6b-q123-inputs"
          qroot="$RUNNER_TEMP/t6b-q123-extract/ProposalOps_SYN_T6B_FINAL_SQLQUAL_Q123_20260908"
          phase5_dir="$RUNNER_TEMP/t6b-q123-phase5"
          evidence="$RUNNER_TEMP/t6b-q123-evidence"
          container="t6b-q123-sql-${GITHUB_RUN_ID}"
          db_name="t6b_q123_${GITHUB_RUN_ID}"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker pull --platform linux/amd64 "$SQLSERVER_IMAGE"
          inspect_json="$(docker image inspect "$SQLSERVER_IMAGE" --format '{{json .}}')"
          echo "$inspect_json" | jq -e '.Os == "linux" and .Architecture == "amd64"' >/dev/null

          docker run --detach --platform linux/amd64 --name "$container" --publish 127.0.0.1:14333:1433 \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD="$password" "$SQLSERVER_IMAGE" >/dev/null

          export SQL_PASSWORD="$password"
          export SQL_DB_NAME="$db_name"
          ready=0
          for attempt in $(seq 1 30); do
            if python - <<'PY'
          import json, os, pathlib, pyodbc, re
          password = os.environ["SQL_PASSWORD"]
          db = os.environ["SQL_DB_NAME"]
          if not re.fullmatch(r"t6b_q123_[0-9]+", db):
              raise SystemExit("SQL_DB_NAME_INVALID")
          connection = pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,14333;UID=sa;PWD=" + password + ";DATABASE=master;Encrypt=no;TrustServerCertificate=yes", timeout=2, autocommit=True)
          cursor = connection.cursor()
          cursor.execute("SELECT 1")
          assert cursor.fetchone()[0] == 1
          cursor.execute("SELECT SERVERPROPERTY('ProductMajorVersion'), SERVERPROPERTY('EngineEdition'), SERVERPROPERTY('ProductVersion')")
          major, edition, version = cursor.fetchone()
          if int(major) != 16 or int(edition) in (5, 8) or not str(version):
              raise SystemExit("SQLSERVER_IDENTITY_REJECTED")
          cursor.execute("SELECT DB_ID(?)", db)
          if cursor.fetchone()[0] is None:
              cursor.execute("CREATE DATABASE [" + db + "]")
          pathlib.Path(os.environ["RUNNER_TEMP"], "t6b-q123-evidence", "T6B_Q123_SQLSERVER_IDENTITY.json").write_text(json.dumps({"product_major_version":int(major),"engine_edition":int(edition),"product_version":str(version),"azure":False}, sort_keys=True) + "\n")
          connection.close()
          PY
            then
              ready=1
              break
            fi
            test "$attempt" -lt 30
            sleep 2
          done
          test "$ready" -eq 1

          export DATABASE_URL="mssql+pyodbc://sa:${password}@127.0.0.1:14333/${db_name}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          start_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          PYTHONPATH="$qroot" python -m t6b.qualification \
            --database-url "$DATABASE_URL" \
            --candidate-archive "$input_dir/ProposalOps_SYN_T6A_RECOVERY_R4_CANDIDATE.tar.gz" \
            --return-archive "$input_dir/T6A_ATTEMPT3_SANITIZED_RETURN.tar.gz" \
            --phase5-root "$phase5_dir" \
            --evidence-dir "$evidence" \
            > "$evidence/T6B_Q123_RUNNER_STDOUT.txt" \
            2> "$evidence/T6B_Q123_RUNNER_STDERR.txt"
          rc=$?
          set -e
          end_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' "$rc" > "$evidence/T6B_Q123_RUNNER_RC.txt"
          jq -n --arg start "$start_utc" --arg end "$end_utc" --argjson rc "$rc" --argjson count 1 \
            '{invocation_count:$count,runner_rc:$rc,start_utc:$start,end_utc:$end}' > "$evidence/T6B_Q123_RUNNER_META.json"

          cleanup
          trap - EXIT

          credential_leak=0
          if grep -R -F "$password" "$evidence" >/dev/null 2>&1; then
            credential_leak=1
            python - "$evidence" "$password" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          secret = sys.argv[2]
          replacement = "[REDACTED_EPHEMERAL_SQL_PASSWORD]"
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if secret in text:
                  path.write_text(text.replace(secret, replacement), encoding="utf-8")
          PY
            rc=97
          fi
          printf '%s\n' "$credential_leak" > "$evidence/T6B_EPHEMERAL_PASSWORD_MATCHES.txt"

          if test "$rc" -ne 0; then
            first_failure="$(sed -n '1p' "$evidence/T6B_Q123_RUNNER_STDERR.txt" | tr -d '\r')"
            if test "$credential_leak" -ne 0; then
              first_failure="CREDENTIAL_LEAK_REDACTED"
            fi
            jq -n --arg failure "$first_failure" --argjson rc "$rc" \
              '{result:"FAIL",first_failure:$failure,runner_rc:$rc,T6B_APPLICATION_PERSISTENCE_CLOSED:false,T6B_READY_FOR_INDEPENDENT_ACCEPTANCE:false,T6B_INDEPENDENT_ACCEPTANCE:"NOT_PERFORMED_BY_PRODUCER"}' \
              > "$evidence/T6B_Q123_FINAL_PRODUCER_ADJUDICATION.json"
            exit "$rc"
          fi

          python - "$evidence" <<'PY'
          import json, pathlib, sys
          evidence = pathlib.Path(sys.argv[1])
          result = json.loads((evidence / "T6B_SQLSERVER_2022_QUALIFICATION.json").read_text())
          required = result["counts"] == {"source_events":3,"evidence_envelopes":3,"classification_envelopes":3,"pending_review":3}
          required = required and result["t6b_rollback_audit_delta"] == 0
          required = required and result["t6b_audit_first_commit_delta"] == 3
          required = required and result["t6b_audit_replay_delta"] == 3
          required = required and result["t6b_audit_replay_duplicate_delta"] == 0
          required = required and result["t6b_unexpected_audit_event_delta"] == 0
          required = required and result["verified_assertion_delta"] == 0
          required = required and result["typed_projection_delta"] == 0
          required = required and result["protected_action_delta"] == 0
          required = required and result["before_schema_canonical_json_sha256"] == result["after_first_commit_schema_canonical_json_sha256"] == result["after_replay_schema_canonical_json_sha256"]
          if not required:
              raise SystemExit("EVIDENCE_INCOMPLETE_FAIL")
          adjudication = {
              "result":"PASS",
              "SQLSERVER_2022_T6B_QUALIFICATION":"PASS",
              "T6B_APPLICATION_PERSISTENCE_CLOSED":True,
              "T6B_READY_FOR_INDEPENDENT_ACCEPTANCE":True,
              "T6B_INDEPENDENT_ACCEPTANCE":"NOT_PERFORMED_BY_PRODUCER",
              "T6B_SMB_CONNECTIONS":0,
              "T6B_REAL_SOURCE_READS":0,
              "T6B_REAL_SOURCE_BYTES":0,
              "T6B_PARSER_EXECUTIONS":0,
              "T6B_REAL_CONTENT_LLM_CALLS":0,
              "T6B_REQUIRED_TEST_SKIPS":0,
              "T6B_NEGATIVE_CASE_MISSES":0
          }
          (evidence / "T6B_Q123_FINAL_PRODUCER_ADJUDICATION.json").write_text(json.dumps(adjudication, sort_keys=True, indent=2) + "\n")
          PY

          if grep -R -E -i 'MSSQL_SA_PASSWORD|PWD=|DATABASE_URL=|gho_|proposalops_reader_ro|192\.168\.8\.149|/volume1/ProposalOps|T4-TENDERS-01\.docx|T4-TENDERS-08\.pdf|T4-TENDERS-12\.xlsx' "$evidence"; then
            exit 98
          fi
          printf '%s\n' '0' > "$evidence/T6B_CREDENTIAL_SCAN_MATCHES.txt"
          test ! -e "$evidence/T6B_SQL_PASSWORD.txt"

      - name: Upload credential-free Q123 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6B_Q123_SQL_QUALIFICATION_EVIDENCE_${{ github.run_id }}
          path: ${{ runner.temp }}/t6b-q123-evidence
          if-no-files-found: error
