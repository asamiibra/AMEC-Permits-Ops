name: T6B Q123 final SQL qualification

on:
  push:
    branches:
      - t6b-q123-final-sql-qualification-harness-v1

permissions:
  contents: read

env:
  REPOSITORY: asamiibra/AMEC-Permits-Ops
  PARENT_COMMIT: c42e6c449483b0951de0f366d700dbaf7b9e5525
  PARENT_TREE: a497c6951064119453d175d1b93d4e59c9029fd0
  INPUT_RELEASE_TAG: t6b-q123-final-sqlqual-inputs-20260908-v1
  Q123_SHA256: 4087832d304c847fa5a2b53aa73032610e678c596101ad8711b987db7a8c27f9
  Q123_BYTES: "12362"
  Q123_LEDGER_SHA256: 6e7c803dc5237fc2a371b50ff4d6c7854136259b6a6e037dbf71f24ba08f969c
  T6A_SHA256: 8f5f1b64091d3c9b943dc092773b12794eb5af3ee1a7bb7c5eab7e6475f7f6e2
  T6A_BYTES: "92139101"
  T6A_RETURN_SHA256: 933c43465e56d6c2a1b51a83692c4cba7038118c1c4f54b5dfce504bbba546cc
  T6A_RETURN_BYTES: "1999"
  SQLSERVER_IMAGE_TAG: mcr.microsoft.com/mssql/server:2022-latest

jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Initialize credential-free evidence directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/t6b-q123-evidence"

      - name: Check out workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download and verify frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          input_dir="$RUNNER_TEMP/t6b-q123-inputs"
          phase5_dir="$RUNNER_TEMP/t6b-q123-phase5"
          evidence="$RUNNER_TEMP/t6b-q123-evidence"
          mkdir -p "$input_dir"
          printf '%s\n' '{"status":"preflight-started"}' > "$evidence/T6B_Q123_PREEXECUTION_AUDIT.json"
          gh release download "$INPUT_RELEASE_TAG" --repo "$REPOSITORY" --dir "$input_dir" --clobber \
            --pattern 'ProposalOps_SYN_T6B_FINAL_SQLQUAL_Q123_20260908.tar.gz' \
            --pattern 'T6B_FINAL_PRE_SQL_RELEASE_LEDGER.json' \
            --pattern 'ProposalOps_SYN_T6A_RECOVERY_R4_CANDIDATE.tar.gz' \
            --pattern 'T6A_ATTEMPT3_SANITIZED_RETURN.tar.gz'
          q="$input_dir/ProposalOps_SYN_T6B_FINAL_SQLQUAL_Q123_20260908.tar.gz"
          ledger="$input_dir/T6B_FINAL_PRE_SQL_RELEASE_LEDGER.json"
          candidate="$input_dir/ProposalOps_SYN_T6A_RECOVERY_R4_CANDIDATE.tar.gz"
          returned="$input_dir/T6A_ATTEMPT3_SANITIZED_RETURN.tar.gz"
          test "$(sha256sum "$q" | awk '{print $1}')" = "$Q123_SHA256"
          test "$(stat -c '%s' "$q")" = "$Q123_BYTES"
          test "$(sha256sum "$ledger" | awk '{print $1}')" = "$Q123_LEDGER_SHA256"
          test "$(sha256sum "$candidate" | awk '{print $1}')" = "$T6A_SHA256"
          test "$(stat -c '%s' "$candidate")" = "$T6A_BYTES"
          test "$(sha256sum "$returned" | awk '{print $1}')" = "$T6A_RETURN_SHA256"
          test "$(stat -c '%s' "$returned")" = "$T6A_RETURN_BYTES"
          jq -e --arg q "$Q123_SHA256" --argjson bytes "$Q123_BYTES" \
            '.final_t6b_sha256 == $q and .final_t6b_bytes == $bytes and .T6B_APPLICATION_PERSISTENCE_CLOSED == false and .T6B_READY_FOR_INDEPENDENT_ACCEPTANCE == false' \
            "$ledger" >/dev/null
          git fetch --no-tags origin "$PARENT_COMMIT"
          test "$(git rev-parse "$PARENT_COMMIT^{tree}")" = "$PARENT_TREE"
          test "$(git diff --name-only "$PARENT_COMMIT" HEAD)" = ".github/workflows/t6b-q123-final-sql-qualification.yml"
          git worktree add --detach "$phase5_dir" "$PARENT_COMMIT"
          test "$(git -C "$phase5_dir" rev-parse HEAD)" = "$PARENT_COMMIT"
          test "$(git -C "$phase5_dir" rev-parse HEAD^{tree})" = "$PARENT_TREE"
          test -z "$(git -C "$phase5_dir" status --porcelain)"
          mkdir -p "$RUNNER_TEMP/t6b-q123-extract"
          python - "$q" "$RUNNER_TEMP/t6b-q123-extract" <<'PY'
          import pathlib, sys, tarfile
          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          with tarfile.open(archive, "r:gz") as tf:
              members = tf.getmembers()
              for member in members:
                  name = pathlib.PurePosixPath(member.name)
                  if name.is_absolute() or ".." in name.parts or member.issym() or member.islnk() or not (member.isdir() or member.isfile()):
                      raise SystemExit("UNSAFE_Q123_ARCHIVE_MEMBER")
                  target = destination / member.name
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with tf.extractfile(member) as source, target.open("wb") as sink:
                          while True:
                              chunk = source.read(1024 * 1024)
                              if not chunk:
                                  break
                              sink.write(chunk)
          roots = [path for path in destination.iterdir()]
          if len(roots) != 1 or not roots[0].is_dir():
              raise SystemExit("Q123_ROOT_INVALID")
          root = roots[0]
          if not (root / "t6b" / "qualification.py").is_file():
              raise SystemExit("Q123_ENTRY_MODULE_MISSING")
          manifest = root / "MANIFEST.sha256"
          for line in manifest.read_text(encoding="ascii").splitlines():
              if line.strip():
                  expected, relative = line.split("  ", 1)
                  target = root / relative
                  import hashlib
                  digest = hashlib.sha256(target.read_bytes()).hexdigest()
                  if digest != expected:
                      raise SystemExit("Q123_MANIFEST_MISMATCH")
          forbidden = list(root.rglob(".git")) + list(root.rglob("__pycache__")) + list(root.rglob("*.pyc"))
          if forbidden:
              raise SystemExit("Q123_FORBIDDEN_BUILD_ARTIFACT")
          print("Q123_FRESH_EXTRACT_MANIFEST=PASS")
          PY
          q123_root="$(find "$RUNNER_TEMP/t6b-q123-extract" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$q123_root"
          test "$(find "$RUNNER_TEMP/t6b-q123-extract" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = 1
          jq -n --arg sha "$Q123_SHA256" --argjson bytes "$Q123_BYTES" --arg file "ProposalOps_SYN_T6B_FINAL_SQLQUAL_Q123_20260908.tar.gz" \
            '{q123_sha256:$sha,q123_bytes:$bytes,q123_filename:$file}' > "$evidence/q123-identity.json"
          PYTHONPATH="$q123_root" python - <<'PY'
          import t6b.qualification
          print("Q123_IMPORT_SMOKE=PASS")
          PY
          cat > "$evidence/T6B_Q123_PREEXECUTION_AUDIT.json" <<EOF
          {"q123_sha256":"$Q123_SHA256","q123_bytes":$Q123_BYTES,"q123_ledger_sha256":"$Q123_LEDGER_SHA256","consumer_sha256":"6689959f300461e2b7eba669728c59c02251362d36bba4e853bdcfbd9ef32778","consumer_bytes":18389,"sqlserver_gate_sha256":"0f3b7552445754cbb2af195be6e26848562a176756f63bc2ceee10681aff2834","sqlserver_gate_bytes":2133,"qualification_runner_sha256":"1a3e78c3db2010e0a6240de48e416a481a1358993fa5f3a3e2914ecddb814fc6","qualification_runner_bytes":19879,"phase5_commit":"$PARENT_COMMIT","phase5_tree":"$PARENT_TREE","t6a_candidate_sha256":"$T6A_SHA256","t6a_return_sha256":"$T6A_RETURN_SHA256","manifest_mismatches":0,"sql_execution_performed":false}
          EOF

      - name: Prove native x64 host and install accepted dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          test "$(dpkg --print-architecture)" = amd64
          docker_info="$(docker info --format '{{.OSType}} {{.Architecture}}')"
          test "$docker_info" = "linux amd64"
          jq -n --arg os "$RUNNER_OS" --arg arch "$RUNNER_ARCH" --arg uname "$(uname -m)" --arg dpkg "$(dpkg --print-architecture)" --arg docker "$docker_info" \
            '{runner_os:$os,runner_arch:$arch,uname_m:$uname,dpkg_architecture:$dpkg,docker:$docker,qemu_or_binfmt:false}' \
            > "$RUNNER_TEMP/t6b-q123-evidence/T6B_Q123_NATIVE_X64_HOST_PROOF.json"

      - name: Install Python 3.12 and accepted dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ODBC Driver 18 and accepted Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl gnupg2 unixodbc-dev
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/microsoft-prod.list >/dev/null
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18
          python --version | grep -E '^Python 3\.12\.'
          python -m pip install --disable-pip-version-check --no-input -r "$RUNNER_TEMP/t6b-q123-phase5/backend/requirements.txt" pyodbc
          python -m pip check
          python -c 'import pyodbc; assert "ODBC Driver 18 for SQL Server" in pyodbc.drivers()'

      - name: Run one frozen Q123 SQL qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          input_dir="$RUNNER_TEMP/t6b-q123-inputs"
          qroot="$(find "$RUNNER_TEMP/t6b-q123-extract" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$qroot"
          test "$(find "$RUNNER_TEMP/t6b-q123-extract" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = 1
          phase5_dir="$RUNNER_TEMP/t6b-q123-phase5"
          evidence="$RUNNER_TEMP/t6b-q123-evidence"
          container="t6b-q123-sql-${GITHUB_RUN_ID}"
          db_name="t6b_q123_${GITHUB_RUN_ID}"
          SQLSERVER_PASSWORD="$(openssl rand -hex 24)Aa!"
          echo "::add-mask::$SQLSERVER_PASSWORD"
          export SQLSERVER_PASSWORD
          python - <<'PY'
          import os
          value = os.environ.get("SQLSERVER_PASSWORD")
          assert value and len(value) >= 3
          print("SQLSERVER_PASSWORD_CHILD_ENV_PROPAGATION=PASS")
          PY
          cleanup() { local cleanup_rc=0; docker rm -f "$container" >/dev/null 2>&1 || cleanup_rc=$?; if test "$cleanup_rc" -eq 0; then printf '%s\n' '{"container_present_after":false,"cleanup":"PASS"}' > "$evidence/cleanup-status.json"; else printf '%s\n' '{"container_present_after":unknown,"cleanup":"FAIL"}' > "$evidence/cleanup-status.json"; fi; return "$cleanup_rc"; }
          trap cleanup EXIT
          docker pull --platform linux/amd64 "$SQLSERVER_IMAGE_TAG"
          image_repo_digest="$(docker image inspect "$SQLSERVER_IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          [[ "$image_repo_digest" =~ ^mcr\.microsoft\.com/mssql/server@sha256:[0-9a-f]{64}$ ]]
          image_platform="$(docker image inspect "$image_repo_digest" --format '{{.Os}} {{.Architecture}}')"
          test "$image_platform" = "linux amd64"
          jq -n --arg tag "$SQLSERVER_IMAGE_TAG" --arg digest "$image_repo_digest" \
            '{image_tag:$tag,image_repo_digest:$digest,platform:"linux/amd64"}' > "$evidence/sqlserver-image.json"
          docker run --detach --platform linux/amd64 --name "$container" --publish 127.0.0.1:14333:1433 \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD="$SQLSERVER_PASSWORD" "$image_repo_digest" >/dev/null
          export SQL_PASSWORD="$SQLSERVER_PASSWORD"
          export SQL_DB_NAME="$db_name"
          ready=false
          for attempt in $(seq 1 60); do
            state="$(docker inspect "$container" --format '{{.State.Status}} {{.State.Running}} {{.State.ExitCode}} {{.State.OOMKilled}}' 2>/dev/null || true)"
            if [[ "$state" != "running true 0 false" ]]; then
              docker inspect "$container" --format '{"container_exists":true,"running":{{.State.Running}},"status":"{{.State.Status}}","exit_code":{{.State.ExitCode}},"oom_killed":{{.State.OOMKilled}},"started_at":"{{.State.StartedAt}}","finished_at":"{{.State.FinishedAt}}"}' > "$evidence/sqlserver-startup-state.json"
              docker logs --timestamps "$container" 2> "$RUNNER_TEMP/t6b-q123-docker-log.err" | sed -E "s|$SQLSERVER_PASSWORD|[REDACTED]|g; s/MSSQL_SA_PASSWORD=[^[:space:]]+/MSSQL_SA_PASSWORD=[REDACTED]/g; s/SA_PASSWORD=[^[:space:]]+/SA_PASSWORD=[REDACTED]/g; s/PWD=[^;[:space:]]+/PWD=[REDACTED]/g" > "$evidence/sqlserver-startup.log" || true
              jq -n --arg state "$state" --arg log_sha "$(sha256sum "$evidence/sqlserver-startup.log" | awk '{print $1}')" --argjson log_bytes "$(stat -c '%s' "$evidence/sqlserver-startup.log")" \
                '{result:"FAIL_CONTAINER_EXITED",container_state:$state,startup_log_sha256:$log_sha,startup_log_bytes:$log_bytes}' > "$evidence/sqlserver-bootstrap-diagnostic.json"
              exit 1
            fi
            if python - <<'PY'
          import os, pyodbc
          password = os.environ["SQL_PASSWORD"]
          try:
              connection = pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,14333;UID=sa;PWD=" + password + ";DATABASE=master;Encrypt=no;TrustServerCertificate=yes", timeout=2, autocommit=True)
              cursor = connection.cursor(); cursor.execute("SELECT 1")
              assert cursor.fetchone()[0] == 1
              connection.close()
          except pyodbc.Error:
              raise SystemExit(75)
          PY
            then ready=true; break
            else probe_rc=$?; if test "$probe_rc" -ne 75; then exit "$probe_rc"; fi
            fi
            test "$attempt" -lt 60
            sleep 2
          done
          if test "$ready" != true; then
            docker inspect "$container" --format '{"container_exists":true,"running":{{.State.Running}},"status":"{{.State.Status}}","exit_code":{{.State.ExitCode}},"oom_killed":{{.State.OOMKilled}},"started_at":"{{.State.StartedAt}}","finished_at":"{{.State.FinishedAt}}"}' > "$evidence/sqlserver-startup-state.json"
            docker logs --timestamps "$container" 2> "$RUNNER_TEMP/t6b-q123-docker-log.err" | sed -E "s|$SQLSERVER_PASSWORD|[REDACTED]|g; s/MSSQL_SA_PASSWORD=[^[:space:]]+/MSSQL_SA_PASSWORD=[REDACTED]/g; s/SA_PASSWORD=[^[:space:]]+/SA_PASSWORD=[REDACTED]/g; s/PWD=[^;[:space:]]+/PWD=[REDACTED]/g" > "$evidence/sqlserver-startup.log" || true
            jq -n --arg log_sha "$(sha256sum "$evidence/sqlserver-startup.log" | awk '{print $1}')" --argjson log_bytes "$(stat -c '%s' "$evidence/sqlserver-startup.log")" \
              '{result:"FAIL_PYODBC_TIMEOUT",pyodbc_attempts:60,startup_log_sha256:$log_sha,startup_log_bytes:$log_bytes}' > "$evidence/sqlserver-bootstrap-diagnostic.json"
            exit 1
          fi
          python - <<'PY'
          import json, os, pathlib, pyodbc
          password = os.environ["SQL_PASSWORD"]
          db = os.environ["SQL_DB_NAME"]
          connection = pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,14333;UID=sa;PWD=" + password + ";DATABASE=master;Encrypt=no;TrustServerCertificate=yes", timeout=2, autocommit=True)
          cursor = connection.cursor(); cursor.execute("SELECT SERVERPROPERTY('ProductMajorVersion'), SERVERPROPERTY('EngineEdition'), SERVERPROPERTY('ProductVersion')")
          major, edition, version = cursor.fetchone()
          if int(major) != 16 or int(edition) in (5, 8) or not str(version): raise SystemExit("SQLSERVER_IDENTITY_REJECTED")
          cursor.execute("IF DB_ID(?) IS NULL EXEC(N'CREATE DATABASE [' + REPLACE(?, ']', ']]') + N']')", db, db)
          pathlib.Path(os.environ["RUNNER_TEMP"], "t6b-q123-evidence", "sqlserver-bootstrap.result.json").write_text(json.dumps({"result":"PASS","connection_probe":"PASS","product_major_version":int(major),"engine_edition":int(edition),"product_version":str(version),"azure":False,"pyodbc_attempt_count":1}) + "\n")
          connection.close()
          PY
          qroot="$(find "$RUNNER_TEMP/t6b-q123-extract" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          export DATABASE_URL="mssql+pyodbc://sa:${SQLSERVER_PASSWORD}@127.0.0.1:14333/${db_name}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          start_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          PYTHONPATH="$qroot" python -m t6b.qualification --database-url "$DATABASE_URL" --candidate-archive "$input_dir/ProposalOps_SYN_T6A_RECOVERY_R4_CANDIDATE.tar.gz" --return-archive "$input_dir/T6A_ATTEMPT3_SANITIZED_RETURN.tar.gz" --phase5-root "$phase5_dir" --evidence-dir "$evidence" > "$evidence/T6B_Q123_RUNNER_STDOUT.txt" 2> "$evidence/T6B_Q123_RUNNER_STDERR.txt"
          rc=$?
          set -e
          end_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' "$rc" > "$evidence/T6B_Q123_RUNNER_RC.txt"
          jq -n --arg start "$start_utc" --arg end "$end_utc" --argjson rc "$rc" --argjson count 1 \
            '{invocation_count:$count,runner_rc:$rc,start_utc:$start,end_utc:$end}' > "$evidence/T6B_Q123_RUNNER_META.json"
          cleanup
          trap - EXIT
          if test "$rc" -ne 0; then
            first_failure="$(sed -n '1p' "$evidence/T6B_Q123_RUNNER_STDERR.txt" | tr -d '\r')"
            jq -n --arg failure "$first_failure" --argjson rc "$rc" \
              '{result:"FAIL",first_failure:$failure,runner_rc:$rc,T6B_APPLICATION_PERSISTENCE_CLOSED:false,T6B_READY_FOR_INDEPENDENT_ACCEPTANCE:false}' \
              > "$evidence/T6B_Q123_FINAL_PRODUCER_ADJUDICATION.json"
            exit "$rc"
          fi
          python - "$evidence" <<'PY'
          import json, pathlib, sys
          evidence = pathlib.Path(sys.argv[1])
          result = json.loads((evidence / "T6B_SQLSERVER_2022_QUALIFICATION.json").read_text())
          required = result["counts"] == {"source_events":3,"evidence_envelopes":3,"classification_envelopes":3,"pending_review":3}
          required = required and result["t6b_rollback_audit_delta"] == 0 and result["t6b_audit_first_commit_delta"] == 3 and result["t6b_audit_replay_delta"] == 3 and result["t6b_audit_replay_duplicate_delta"] == 0
          required = required and result["t6b_unexpected_audit_event_delta"] == 0 and result["verified_assertion_delta"] == 0 and result["typed_projection_delta"] == 0 and result["protected_action_delta"] == 0
          required = required and result["before_schema_canonical_json_sha256"] == result["after_first_commit_schema_canonical_json_sha256"] == result["after_replay_schema_canonical_json_sha256"]
          if not required:
              raise SystemExit("EVIDENCE_INCOMPLETE_FAIL")
          adjudication = {"result":"PASS","SQLSERVER_2022_T6B_QUALIFICATION":"PASS","T6B_APPLICATION_PERSISTENCE_CLOSED":True,"T6B_READY_FOR_INDEPENDENT_ACCEPTANCE":True,"T6B_SMB_CONNECTIONS":0,"T6B_REAL_SOURCE_READS":0,"T6B_REAL_SOURCE_BYTES":0,"T6B_PARSER_EXECUTIONS":0,"T6B_REAL_CONTENT_LLM_CALLS":0,"T6B_REQUIRED_TEST_SKIPS":0,"T6B_NEGATIVE_CASE_MISSES":0}
          (evidence / "T6B_Q123_FINAL_PRODUCER_ADJUDICATION.json").write_text(json.dumps(adjudication, sort_keys=True, indent=2) + "\n")
          PY
          grep -R -E -i 'MSSQL_SA_PASSWORD|PWD=|password=|DATABASE_URL=|gho_|smb|proposalops_reader_ro|192\.168\.8\.149|/volume1/ProposalOps|T4-TENDERS-01\.docx|T4-TENDERS-08\.pdf|T4-TENDERS-12\.xlsx' "$evidence" && exit 1 || true
          printf '%s\n' '0' > "$evidence/T6B_CREDENTIAL_SCAN_MATCHES.txt"
          test ! -e "$evidence/T6B_SQL_PASSWORD.txt"

      - name: Upload credential-free Q123 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6B_Q123_SQL_QUALIFICATION_EVIDENCE_${{ github.run_id }}
          path: ${{ runner.temp }}/t6b-q123-evidence
          if-no-files-found: error
