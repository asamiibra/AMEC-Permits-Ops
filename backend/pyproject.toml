[project]
name = "permitops-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.4,<3",
  "psycopg[binary]>=3.2,<4",
  "openpyxl>=3.1,<4",
  "reportlab>=4.2,<5",
]

[tool.vercel]
entrypoint = "app.main:app"
